<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Rift Runner</title>
<link rel="stylesheet" href="/assets/fonts.css">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0a0418;color:#fff;font-family:'Exo 2',sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.ov{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,rgba(20,5,45,.88),rgba(60,10,70,.9));padding:12px;box-sizing:border-box;overflow:auto}
.hidden{display:none!important}
.box{text-align:center;width:100%;max-width:580px}
h1{font-family:'Orbitron',sans-serif;font-weight:900;font-size:clamp(42px,11vw,84px);margin:0;line-height:1;color:#fff;text-shadow:0 0 10px #ff3fbf,0 0 30px #ff3fbf,4px 4px 0 #3ff7ff;letter-spacing:2px;font-style:italic}
.btn{font-family:'Orbitron';font-weight:700;font-size:18px;letter-spacing:2px;color:#0a0418;background:linear-gradient(#9ffcff,#3fc8ff);border:none;border-radius:12px;padding:14px 30px;margin:7px;cursor:pointer;box-shadow:0 0 20px #3fc8ff99;transform:skewX(-8deg)}
.btn:active{transform:skewX(-8deg) translateY(3px)}
.btn.p{background:linear-gradient(#ff8ad8,#ff3fbf);color:#fff;box-shadow:0 0 20px #ff3fbf99}
.btn.y{background:linear-gradient(#fff2a0,#ffd23f);box-shadow:0 0 20px #ffd23f99}
.small{font-size:13px;opacity:.85;margin-top:12px;line-height:1.7}
.stat{display:inline-block;font-family:'Orbitron';font-size:16px;background:rgba(0,0,0,.35);border-radius:10px;padding:6px 12px;margin:4px}
#chars{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.ch{background:rgba(255,255,255,.07);border:2px solid #fff3;border-radius:12px;padding:8px 4px;cursor:pointer}
.ch canvas{width:70px;height:90px}
.ch b{display:block;font-family:'Orbitron';font-size:12px;margin-top:4px}
.ch span{font-size:12px}
.ch.sel{border-color:#3ff7ff;box-shadow:0 0 14px #3ff7ff}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ov" id="home"><div class="box">
  <h1>RIFT<br>RUNNER</h1>
  <div style="margin:14px 0"><span class="stat">BEST <span id="hBest">0</span>m</span><span class="stat">🪙 <span id="hCoins">0</span></span></div>
  <button class="btn" id="runB">▶ RUN</button><br><button class="btn p" id="charB">RUNNERS</button>
  <div class="small" id="help"></div>
</div></div>
<div class="ov hidden" id="chs"><div class="box">
  <h1 style="font-size:clamp(28px,7vw,44px)">RUNNERS</h1>
  <div class="stat">🪙 <span id="cCoins">0</span></div>
  <div id="chars"></div>
  <button class="btn" id="chBack">◀ BACK</button>
</div></div>
<div class="ov hidden" id="over"><div class="box">
  <h1 id="oT" style="font-size:clamp(30px,8vw,54px)">WIPEOUT!</h1>
  <div id="oS" class="small" style="font-size:18px"></div>
  <button class="btn y" id="revB">⚡ REVIVE · 🪙50</button><br>
  <button class="btn" id="againB">↻ RUN AGAIN</button><button class="btn p" id="oHome">MENU</button>
</div></div>
<script>
(()=>{
const cv=document.getElementById('c'),ctx=cv.getContext('2d');const $=id=>document.getElementById(id);
const isTouch=('ontouchstart' in window)||navigator.maxTouchPoints>0;
$('help').innerHTML=isTouch?'TAP to jump (tap again in the air to double jump)<br>SWIPE DOWN to slide · SWIPE RIGHT to dash through orange walls':'SPACE / ↑ to jump (twice for double jump)<br>↓ / S to slide · → / SHIFT to dash through orange walls';
const VH=600,GRAV=2700;
const CHARS=[{n:'Neon',a:'#3ff7ff',b:'#ff3fbf',cost:0},{n:'Blaze',a:'#ff8a2a',b:'#ffd23f',cost:300},{n:'Volt',a:'#fff04f',b:'#5f8cff',cost:700},{n:'Shadow',a:'#b46bff',b:'#2a1a4a',cost:1200},{n:'Toxic',a:'#9dff3f',b:'#1a4a1a',cost:2000},{n:'Glitch',a:'rainbow',b:'#ffffff',cost:3500}];
let sv={best:0,coins:0,owned:[0],sel:0,runs:0};try{const d=JSON.parse(localStorage.getItem('riftrunner_v1')||'null');if(d)sv=Object.assign(sv,d)}catch(e){}
function persist(){try{localStorage.setItem('riftrunner_v1',JSON.stringify(sv))}catch(e){}}
let AC=null;function snd(f,d=0.08,type='square',v=0.04,f2,noise){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const n=AC.currentTime,g=AC.createGain();g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(0.0008,n+d);
 if(noise){const len=Math.floor(AC.sampleRate*d),b=AC.createBuffer(1,len,AC.sampleRate),dd=b.getChannelData(0);for(let i=0;i<len;i++)dd[i]=(Math.random()*2-1)*(1-i/len);const s=AC.createBufferSource();s.buffer=b;const fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.value=f;s.connect(fl).connect(g).connect(AC.destination);s.start(n);return}
 const o=AC.createOscillator();o.type=type;o.frequency.setValueAtTime(f,n);if(f2)o.frequency.exponentialRampToValueAtTime(f2,n+d);o.connect(g).connect(AC.destination);o.start(n);o.stop(n+d+0.03)}catch(e){}}
const colOf=(c,t)=>c==='rainbow'?`hsl(${(t*200)%360},100%,60%)`:c;

let lastDashX=-1e9,W,H,DPR,S=1,VW=800,OY=0,state='home',P=null,segs=[],obs=[],coins=[],pows=[],parts=[],texts=[],rain=[],sky=[],camX=0,speed=420,dist=0,runCoins=0,time=0,shake=0,revived=false,deathT=0,mag=0,dbl=0,genX=0,lastY=440;
function layout(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;S=Math.min(H/VH,W/700);VW=W/S;OY=(H-VH*S)/2;makeSky()}
addEventListener('resize',layout);
function makeSky(){sky=[];for(let l=0;l<3;l++){const c=document.createElement('canvas');const w=1600,h=VH;c.width=w;c.height=h;const g=c.getContext('2d');const col=['#2a0f4a','#1e0a38','#140628'][l];let x=0;let sd=l*99+7;const r=()=>{sd=(sd*9301+49297)%233280;return sd/233280};
 while(x<w){const bw=60+r()*120,bh=(140+r()*260)*(1-l*0.18)+l*60;g.fillStyle=col;g.fillRect(x,h-bh,bw,bh);if(r()<0.4){g.fillRect(x+bw*0.45,h-bh-30-r()*40,4,40)}
  for(let wy=h-bh+10;wy<h-10;wy+=14)for(let wx=x+6;wx<x+bw-8;wx+=12)if(r()<0.25-l*0.05){g.fillStyle=r()<0.7?`rgba(255,${180+r()*60|0},120,${0.5-l*0.12})`:`rgba(120,220,255,${0.5-l*0.12})`;g.fillRect(wx,wy,5,7)}
  if(r()<0.25&&l<2){g.fillStyle=r()<0.5?'#ff3fbf':'#3ff7ff';g.globalAlpha=0.7;g.fillRect(x+10,h-bh+20,bw-20,6);g.globalAlpha=1}
  g.fillStyle=col;x+=bw+r()*20}sky.push(c)}
 rain=[];for(let i=0;i<90;i++)rain.push({x:Math.random()*W,y:Math.random()*H,v:600+Math.random()*500})}

// ---------- generation ----------
function addSeg(x,w,y){segs.push({x,w,y,deco:Math.random(),sign:Math.random()<0.3?(Math.random()<0.5?'#ff3fbf':'#3ff7ff'):null})}
function gen(){
 while(genX<camX+VW+900){
  const m=dist/1;const gapMax=Math.min(300,130+speed*0.17),gap=segs.length<1?0:90+Math.random()*(gapMax-90);
  let ny=lastY+(Math.random()-0.5)*160;ny=Math.max(330,Math.min(520,ny));if(ny<lastY-90)ny=lastY-90;
  const w=segs.length<1?1400:500+Math.random()*700;const x=genX+gap;addSeg(x,w,ny);
  // coins over gap (arc)
  if(gap>140&&Math.random()<0.7){const n=6;for(let i=0;i<n;i++){const t=i/(n-1);const cx=genX-40+t*(gap+80),cy=Math.min(lastY,ny)-90-Math.sin(t*Math.PI)*90;coins.push({x:cx,y:cy})}}
  // obstacles
  if(segs.length>1){let ox=x+180;const spacing=Math.max(300,speed*0.6);
   while(ox<x+w-160){const r=Math.random();const lv=dist/40;let type='crate';
    if(lv>250&&r<0.22)type='bar';else if(lv>500&&r<0.38)type='wall';else if(lv>800&&r<0.52)type='drone';else if(lv>1100&&r<0.62)type='laser';else if(r<0.75)type='crate';else type=null;
    if((type==='wall'||type==='laser')&&ox-lastDashX<speed*1.7)type='crate';if(type==='wall'||type==='laser')lastDashX=ox;
    if(type){const o={type,x:ox,y:ny};if(type==='crate'){o.w=46;o.h=Math.random()<0.3?70:46}if(type==='bar'){o.w=80;o.h=26;o.gap=46}if(type==='wall'){o.w=34;o.h=210}if(type==='drone'){o.w=44;o.h=26;o.base=ny-46-Math.random()*60;o.ph=Math.random()*6}if(type==='laser'){o.w=12;o.h=240;o.ph=Math.random()*3}obs.push(o)
     if(Math.random()<0.5&&type!=='wall'){for(let i=0;i<5;i++)coins.push({x:ox-60+i*30,y:type==='bar'?ny-24:ny-140-(type==='crate'?o.h-46:0)})}}
    else if(Math.random()<0.8){for(let i=0;i<6;i++)coins.push({x:ox-80+i*34,y:ny-34})}
    if(Math.random()<0.06)pows.push({x:ox+spacing/2,y:ny-60,k:['magnet','shield','double'][Math.floor(Math.random()*3)]});
    ox+=spacing*(0.8+Math.random()*0.6)}}
  genX=x+w;lastY=ny}
 // cleanup
 const cut=camX-300;segs=segs.filter(s=>s.x+s.w>cut);obs=obs.filter(o=>o.x>cut&&!o.gone);coins=coins.filter(c=>c.x>cut&&!c.got);pows=pows.filter(p=>p.x>cut&&!p.got);
}
function start(){lastDashX=-1e9;segs=[];obs=[];coins=[];pows=[];parts=[];texts=[];genX=0;lastY=440;speed=420;dist=0;runCoins=0;revived=false;mag=0;dbl=0;
 P={x:200,y:440,vy:0,ground:true,jumps:0,slide:0,dash:0,dashCd:0,shield:false,phase:0,trail:[],scarf:[],dead:false,inv:0};for(let i=0;i<8;i++)P.scarf.push([P.x-i*6,P.y-58]);
 camX=P.x-VW*0.25;gen();state='play';show(null);sv.runs++;persist();snd(400,0.2,'square',0.05,800)}
function revive(){P.dead=false;state='play';P.inv=2;P.vy=-900;P.jumps=1;P.ground=false;
 // find next platform and place player above
 const s=segs.find(s=>s.x+s.w>P.x+40)||segs[segs.length-1];P.x=Math.max(P.x,s.x+40);P.y=s.y-200;for(const o of obs)if(o.x>P.x-50&&o.x<P.x+500)o.gone=true;show(null);snd(600,0.4,'square',0.06,1200)}

// ---------- input ----------
const keys={};let tstart=null;
function jump(){if(state!=='play'||P.dead)return;if(P.ground||P.coyote>0){P.coyote=0;P.vy=-940;P.ground=false;P.jumps=1;P.slide=0;snd(500,0.08,'square',0.04,800);dust(P.x,P.y,6)}else if(P.jumps<2){P.vy=-860;P.jumps=2;snd(700,0.1,'square',0.04,1200);for(let i=0;i<10;i++){const a=Math.random()*6.28;parts.push({x:P.x,y:P.y-20,vx:Math.cos(a)*150,vy:Math.abs(Math.sin(a))*200,life:0,max:0.4,col:colOf(CHARS[sv.sel].a,time),r:3})}}}
function slide(){if(state!=='play'||P.dead)return;if(P.ground){P.slide=0.6;snd(250,0.15,'sawtooth',0.03,120,true)}else{P.vy=Math.max(P.vy,1300);P.slideQueued=true}}
function dash(){if(state!=='play'||P.dead||P.dashCd>0)return;P.dash=0.38;P.dashCd=1.4;if(!P.ground)P.vy=Math.min(P.vy,0);snd(300,0.3,'sawtooth',0.05,1200,true);shake=Math.max(shake,3)}
addEventListener('keydown',e=>{if(keys[e.code])return;keys[e.code]=true;if(['Space','ArrowUp','KeyW'].includes(e.code)){jump();e.preventDefault()}if(['ArrowDown','KeyS'].includes(e.code)){slide();e.preventDefault()}if(['ArrowRight','KeyD','ShiftLeft','ShiftRight'].includes(e.code)){dash();e.preventDefault()}if(e.code==='Enter'&&state!=='play')start()});
addEventListener('keyup',e=>{keys[e.code]=false});
cv.addEventListener('pointerdown',e=>{tstart={x:e.clientX,y:e.clientY,t:performance.now(),done:false}});
cv.addEventListener('pointermove',e=>{if(!tstart||tstart.done)return;const dx=e.clientX-tstart.x,dy=e.clientY-tstart.y;if(Math.abs(dy)>40&&dy>Math.abs(dx)){slide();tstart.done=true}else if(dx>40&&dx>Math.abs(dy)){dash();tstart.done=true}else if(dy<-40&&-dy>Math.abs(dx)){jump();tstart.done=true}});
cv.addEventListener('pointerup',e=>{if(tstart&&!tstart.done)jump();tstart=null});

function dust(x,y,n){for(let i=0;i<n;i++)parts.push({x:x+(Math.random()-0.5)*20,y,vx:-speed*0.3+(Math.random()-0.5)*80,vy:-Math.random()*100,life:0,max:0.4,col:'rgba(200,180,255,.6)',r:3})}
function groundAt(x){for(const s of segs)if(x>=s.x-4&&x<=s.x+s.w+4)return s.y;return null}
function die(why){if(P.dead)return;if(P.shield&&why!=='fall'){P.shield=false;P.inv=1.2;shake=8;snd(900,0.3,'sine',0.06,200);texts.push({x:P.x,y:P.y-90,t:'SHIELD BROKEN!',col:'#5ff7ff',life:0});return}
 P.dead=true;state='dying';deathT=0;shake=14;snd(150,0.6,'sawtooth',0.07,40);for(let i=0;i<30;i++){const a=Math.random()*6.28;parts.push({x:P.x,y:P.y-35,vx:Math.cos(a)*300,vy:Math.sin(a)*300,life:0,max:0.7,col:colOf(CHARS[sv.sel].a,time),r:4})}}
function boxHit(o,px,py,pw,ph){return px+pw/2>o.x-o.w/2&&px-pw/2<o.x+o.w/2&&py>o.top&&py-ph<o.bot}
function update(dt){
 speed=Math.min(1050,speed+dt*7);const sp=P.dash>0?speed*1.6:speed;P.x+=sp*dt;dist+=sp*dt;
 P.dash=Math.max(0,P.dash-dt);P.dashCd=Math.max(0,P.dashCd-dt);P.slide=Math.max(0,P.slide-dt);P.inv=Math.max(0,P.inv-dt);mag=Math.max(0,mag-dt);dbl=Math.max(0,dbl-dt);
 if(!P.ground){P.vy+=GRAV*dt*(P.dash>0?0.2:1)}
 const ny=P.y+P.vy*dt;const g=groundAt(P.x);
 if(g!==null&&P.vy>=0&&P.y<=g+2&&ny>=g){P.y=g;if(!P.ground){P.ground=true;P.jumps=0;dust(P.x,g,5);if(P.slideQueued){P.slide=0.6;P.slideQueued=false}}P.vy=0}
 else{P.y=ny;if(g===null||P.y<g-2){if(P.ground&&P.vy>=0)P.coyote=0.12;P.ground=false}}
 P.coyote=Math.max(0,(P.coyote||0)-dt);
 if(P.ground&&g===null)P.ground=false;
 // wall face collision: running into a higher rooftop
 const gAhead=groundAt(P.x+14);if(gAhead!==null&&P.y>gAhead+8&&g===null){die('wall')}
 if(P.y>VH+200){die('fall')}
 P.phase+=dt*sp*0.022;
 // obstacles
 const ph=P.slide>0?34:68,pw=26;
 for(const o of obs){if(o.gone)continue;
  if(o.type==='crate'){o.top=o.y-o.h;o.bot=o.y}
  else if(o.type==='bar'){o.top=o.y-o.gap-o.h;o.bot=o.y-o.gap}
  else if(o.type==='wall'){o.top=o.y-o.h;o.bot=o.y}
  else if(o.type==='drone'){const yy=o.base+Math.sin(time*3+o.ph)*30;o.top=yy-o.h/2;o.bot=yy+o.h/2;o.cy=yy}
  else if(o.type==='laser'){o.on=Math.sin(time*2.4+o.ph)>-0.1;o.top=o.y-o.h;o.bot=o.y}
  if(o.type==='laser'&&!o.on)continue;
  if(boxHit(o,P.x,P.y,pw,ph)){
   if(o.type==='crate'&&(P.vy>=0&&P.y-P.vy*dt<=o.top+6||P.y-o.top<38)){P.y=o.top;P.vy=Math.min(P.vy,0);if(P.vy===0){P.ground=true;P.jumps=0}continue}
   if(P.dash>0&&o.type==='laser')continue;
   if(P.dash>0){o.gone=true;shake=8;snd(120,0.25,'square',0.06,0,true);for(let i=0;i<16;i++){const a=Math.random()*6.28;parts.push({x:o.x,y:(o.top+o.bot)/2,vx:Math.cos(a)*300+speed*0.3,vy:Math.sin(a)*300,life:0,max:0.6,col:o.type==='wall'?'#ff8a2a':'#aab',r:4})}texts.push({x:o.x,y:o.top-10,t:'SMASH!',col:'#ff8a2a',life:0});continue}
   if(P.inv>0)continue;
   die(o.type)}}
 // standing on crates: ground check
 if(P.ground&&g!==null&&P.y<g-2){const on=obs.some(o=>o.type==='crate'&&!o.gone&&Math.abs(P.x-o.x)<o.w/2+10&&Math.abs(P.y-o.top)<3);if(!on)P.ground=false}
 // coins & powerups
 for(const c of coins){if(c.got)continue;const dx=c.x-P.x,dy=c.y-(P.y-34),d=Math.hypot(dx,dy);if(mag>0&&d<260){c.x-=dx/d*700*dt;c.y-=dy/d*700*dt}if(d<34){c.got=true;const v=dbl>0?2:1;runCoins+=v;snd(1300+Math.random()*200,0.05,'square',0.025,1900);parts.push({x:c.x,y:c.y,vx:0,vy:-60,life:0,max:0.3,col:'#ffd23f',r:6})}}
 for(const p of pows){if(p.got)continue;if(Math.hypot(p.x-P.x,p.y-(P.y-34))<40){p.got=true;if(p.k==='magnet')mag=9;if(p.k==='shield')P.shield=true;if(p.k==='double')dbl=10;texts.push({x:P.x,y:P.y-100,t:{magnet:'MAGNET!',shield:'SHIELD!',double:'2X COINS!'}[p.k],col:'#fff',life:0});snd(600,0.2,'square',0.05,1200)}}
 // scarf
 P.scarf[0]=[P.x-6,P.y-(P.slide>0?30:58)];for(let i=1;i<P.scarf.length;i++){const a=P.scarf[i],b=P.scarf[i-1];a[0]-=sp*dt*0.15;a[1]+=Math.sin(time*12+i)*0.8+0.4;const dx=a[0]-b[0],dy=a[1]-b[1],d=Math.hypot(dx,dy)||1;a[0]=b[0]+dx/d*7;a[1]=b[1]+dy/d*7}
 if(P.dash>0)P.trail.push({x:P.x,y:P.y,life:0,slide:P.slide>0});
 camX=P.x-VW*0.25;gen();
}
function endRun(){const m=Math.floor(dist/40);const nb=m>sv.best;if(nb)sv.best=m;sv.coins+=runCoins;persist();
 $('oT').textContent=nb?'NEW RECORD!':'WIPEOUT!';$('oS').innerHTML=`Distance <b style="color:#3ff7ff">${m}m</b> · Coins <b style="color:#ffd23f">+${runCoins}</b><br>Best ${sv.best}m · Bank 🪙${sv.coins}`;
 $('revB').style.display=(!revived&&sv.coins>=50)?'inline-block':'none';show('over')}

// ---------- render ----------
function drawRunner(g,x,y,ph,col,col2,t,o={}){
 const c=colOf(col,t),sl=o.slide;g.save();g.translate(x,y);g.scale(1.3,1.3);g.lineCap='round';g.lineJoin='round';
 if(sl){g.rotate(-1.1);g.translate(10,-6)}
 const leg=Math.sin(ph),air=o.air;
 const hip=[0,-34],sh=[3,-58],head=[5,-70];
 const lim=(a,b,cc,w)=>{g.strokeStyle=cc;g.lineWidth=w;g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.stroke()};
 const L1=air?[hip[0]+12,hip[1]+14]:[hip[0]+leg*14,hip[1]+16],F1=air?[hip[0]+4,hip[1]+30]:[hip[0]+leg*22,hip[1]+34-Math.max(0,-leg)*8];
 const L2=air?[hip[0]-6,hip[1]+18]:[hip[0]-leg*14,hip[1]+16],F2=air?[hip[0]-16,hip[1]+30]:[hip[0]-leg*22,hip[1]+34-Math.max(0,leg)*8];
 lim(hip,L2,'#8a7ab8',8);lim(L2,F2,'#8a7ab8',7);
 const A2=[sh[0]+leg*12,sh[1]+14],H2=[sh[0]+leg*18+4,sh[1]+24];lim(sh,A2,'#8a7ab8',6);lim(A2,H2,'#8a7ab8',5);
 g.shadowColor=c;g.shadowBlur=14;lim(hip,sh,'#f0eaff',14);g.shadowBlur=0;lim(hip,sh,c,5);
 lim(hip,L1,'#f0eaff',8);lim(L1,F1,'#f0eaff',7);g.fillStyle=c;g.fillRect(F1[0]-4,F1[1]-3,12,5);
 const A1=[sh[0]-leg*12,sh[1]+14],H1=[sh[0]-leg*18+4,sh[1]+24];lim(sh,A1,'#f0eaff',6);lim(A1,H1,'#f0eaff',5);
