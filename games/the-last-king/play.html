<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" href="/assets/fonts.css">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>The Last King: Louis XVI &amp; the French Revolution</title>
<style>
:root{--gold:#f0cc62;--gold2:#b8862a;--red:#d8283a;--blue:#2457c8;--ink:#140a0c;--paper:#f6ecd4;--fury:0}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;overflow:hidden;font-family:Nunito,system-ui,sans-serif;color:#fff;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.screen{position:fixed;inset:0;display:none;overflow:hidden;overflow:clip}
#play *{scroll-margin:0}
.screen.on{display:block}
svg.bg{position:absolute;inset:0;width:100%;height:100%;display:block}
#fxc{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
#flash{position:fixed;inset:0;pointer-events:none;opacity:0;z-index:60}
#flash.go{animation:flash .5s ease-out}
@keyframes flash{0%{opacity:1}100%{opacity:0}}
.shake{animation:shk .35s}.shakeB{animation:shkB .5s}
@keyframes shk{20%{transform:translate(-6px,3px)}40%{transform:translate(5px,-4px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-1px)}}
@keyframes shkB{10%{transform:translate(-14px,6px) rotate(-1deg)}25%{transform:translate(12px,-8px) rotate(1deg)}40%{transform:translate(-10px,4px)}55%{transform:translate(8px,-5px)}70%{transform:translate(-5px,3px)}85%{transform:translate(3px,-2px)}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 22px;border-radius:14px;font-weight:900;letter-spacing:.5px;background:rgba(20,10,16,.72);border:2px solid rgba(240,204,98,.55);box-shadow:0 6px 0 rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.15);transition:transform .1s,box-shadow .1s;backdrop-filter:blur(6px)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.45)}
.btn.gold{background:linear-gradient(180deg,#ffe596,#f0b93a 55%,#c9861c);color:#3a1a04;border-color:#fff3c0;text-shadow:0 1px 0 rgba(255,255,255,.5);box-shadow:0 6px 0 #7a4a0a,0 10px 30px rgba(255,190,60,.35)}
.btn.gold:active{box-shadow:0 2px 0 #7a4a0a}
.snd{width:42px;height:42px;border-radius:50%;background:rgba(0,0,0,.45);border:2px solid rgba(255,255,255,.25);font-size:18px;display:grid;place-items:center;position:relative}
.snd.off::after{content:'';position:absolute;width:60%;height:3px;background:#ff4a5a;transform:rotate(-45deg);border-radius:2px}

/* ---------- TITLE ---------- */
#title{cursor:pointer}
#tLouis{position:absolute;right:-6%;bottom:-4%;height:92%;aspect-ratio:460/690;filter:drop-shadow(0 0 40px rgba(255,120,60,.55)) drop-shadow(-10px 0 0 rgba(0,0,0,.35));animation:float 6s ease-in-out infinite}
#tLouis svg{width:100%;height:100%}
@keyframes float{50%{transform:translateY(-12px)}}
.logo{position:absolute;left:5%;top:9%;width:min(640px,64%);text-shadow:0 6px 0 rgba(0,0,0,.45)}
.logo .pre{font-family:Bangers,Impact;letter-spacing:4px;font-size:clamp(16px,2.6vw,28px);color:#ffd9a0}
.logo h1{font-family:'Cinzel Decorative',serif;font-weight:900;line-height:.92;font-size:clamp(46px,9vw,118px);background:linear-gradient(180deg,#fff7d0,#f0cc62 45%,#b8761a 75%,#ffe9a0);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:2px #3a1404;filter:drop-shadow(0 6px 0 #2a0808) drop-shadow(0 0 22px rgba(255,180,60,.5));animation:logoIn 1.2s cubic-bezier(.2,1.3,.4,1)}
.logo .sub{display:inline-block;margin-top:10px;font-weight:900;letter-spacing:1px;font-size:clamp(13px,2.1vw,22px);color:#fff;text-shadow:0 2px 0 #000;padding-bottom:6px;border-bottom:5px solid;border-image:linear-gradient(90deg,var(--blue) 0 33%,#ece6d6 33% 66%,var(--red) 66%) 1}
.logo .sub2{font-family:Bangers,Impact;letter-spacing:3px;color:#ffd9a0;font-size:clamp(15px,2.2vw,22px);margin-top:4px;opacity:.85}
@keyframes logoIn{0%{transform:scale(2.4) rotate(-6deg);opacity:0}100%{transform:none;opacity:1}}
.tap{position:absolute;left:0;right:0;bottom:12%;text-align:center;font-family:Bangers,Impact;font-size:clamp(24px,4vw,40px);letter-spacing:4px;color:#fff;text-shadow:0 0 18px #ff7a3a,0 4px 0 #000;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35;transform:scale(.96)}}
.tbtns{position:absolute;left:5%;bottom:10%;display:none;flex-direction:column;gap:14px;width:min(320px,70%)}
.tbtns .btn{font-size:19px;padding:16px}
#title.ready .tap{display:none}
#title.ready .tbtns{display:flex;animation:up .5s cubic-bezier(.2,1.3,.4,1)}
@keyframes up{0%{transform:translateY(40px);opacity:0}}
.tsnd{position:absolute;top:calc(14px + env(safe-area-inset-top));right:14px;display:flex;gap:8px;z-index:5}
.credit{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-size:11px;opacity:.5}
@media (max-aspect-ratio:3/4){
  #tLouis{right:-22%;bottom:16%;height:62%}
  .logo{width:86%;top:7%}
  .tbtns{left:50%;transform:translateX(-50%);width:min(340px,86%);bottom:7%}
  #title.ready .tbtns{animation:none}
  .tap{bottom:10%}
}

/* ---------- CUTSCENE ---------- */
#cs{background:#000;cursor:pointer}
#csCam{position:absolute;inset:-4%;transform-origin:50% 55%}
#csBg,#csChars{position:absolute;inset:0}
.bgl{position:absolute;inset:0;opacity:0;transition:opacity .6s}
.bgl.in{opacity:1}
.chr{position:absolute;bottom:-6%;height:124%;aspect-ratio:460/690;transform:translateX(-50%);transition:filter .3s;filter:drop-shadow(0 0 2px rgba(0,0,0,.6)) drop-shadow(0 18px 30px rgba(0,0,0,.5))}
.chr.flip{transform:translateX(-50%) scaleX(-1)}
.chr.dim{filter:brightness(.55) saturate(.7) drop-shadow(0 18px 30px rgba(0,0,0,.5))}
.chr svg{width:100%;height:100%}
#csClose,#csPanels,#csCard{position:absolute;inset:0;display:none}
#cs[data-mode=close] #csClose,#cs[data-mode=panels] #csPanels,#cs[data-mode=card] #csCard{display:block}
#cs[data-mode=close] #csCam,#cs[data-mode=panels] #csCam,#cs[data-mode=card] #csCam{visibility:hidden}
#csClose{inset:-10%}
.clbg{position:absolute;inset:0}
.clbg svg{width:100%;height:100%;animation:jit .12s steps(2) infinite}
@keyframes jit{50%{transform:rotate(1.2deg) scale(1.02)}}
.clface{position:absolute;inset:8% 0;display:flex;align-items:center;justify-content:center}
.clface svg{width:100%;height:100%;filter:drop-shadow(0 0 0 #000) drop-shadow(8px 8px 0 rgba(0,0,0,.35))}
#csPanels{background:#fff}
.pnl{position:absolute;overflow:hidden}
.pnl .pface{position:absolute;inset:0}
.pnl .pface svg{width:100%;height:100%}
.pnl.p1{inset:0 0 0 0;clip-path:polygon(0 0,38% 0,28% 100%,0 100%)}
.pnl.p2{inset:0;clip-path:polygon(39.5% 0,70% 0,60% 100%,29.5% 100%)}
.pnl.p3{inset:0;clip-path:polygon(71.5% 0,100% 0,100% 100%,61.5% 100%)}
.pnl.p1 .pface{right:62%}.pnl.p2 .pface{left:30%;right:31%}.pnl.p3 .pface{left:62%}
@media (max-aspect-ratio:1/1){
  .pnl.p1{clip-path:polygon(0 0,100% 0,100% 30%,0 36%)}
  .pnl.p2{clip-path:polygon(0 37.5%,100% 31.5%,100% 64%,0 70%)}
  .pnl.p3{clip-path:polygon(0 71.5%,100% 65.5%,100% 100%,0 100%)}
  .pnl.p1 .pface{right:0;bottom:62%}.pnl.p2 .pface{left:0;right:0;top:31%;bottom:30%}.pnl.p3 .pface{left:0;top:65%}
}
#csCard{background:radial-gradient(ellipse at center,#5a0a14,#14020a 75%);display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:24px}
#cs[data-mode=card] #csCard{display:flex}
#csCard.dark{background:#000}
#csCard.dark .slash{background:#3a3a44}
.slash{position:absolute;left:-10%;right:-10%;top:50%;height:120px;margin-top:-80px;background:linear-gradient(90deg,var(--blue) 0 33%,#ece6d6 33% 66%,var(--red) 66%);transform:rotate(-6deg) scaleX(0);animation:slash .5s .05s cubic-bezier(.2,1,.3,1) forwards;opacity:.9;box-shadow:0 0 60px rgba(0,0,0,.6)}
@keyframes slash{to{transform:rotate(-6deg) scaleX(1)}}
.cbig{position:relative;font-family:Bangers,Impact;font-size:clamp(48px,11vw,140px);letter-spacing:4px;color:#fff;-webkit-text-stroke:3px #000;text-shadow:6px 6px 0 #000,0 0 40px rgba(255,200,120,.5);line-height:1}
.cbig .w{display:inline-block;white-space:nowrap}.cbig .w span{display:inline-block;animation:let .5s cubic-bezier(.2,1.6,.4,1) backwards}
@keyframes let{0%{transform:scale(3) translateY(-40px) rotate(-20deg);opacity:0}}
.csub{position:relative;margin-top:22px;font-family:'Cinzel Decorative',serif;font-weight:700;font-size:clamp(16px,2.6vw,28px);color:#ffe7b0;text-shadow:0 2px 6px #000;animation:up .8s .5s backwards;max-width:900px}
.lb{position:absolute;left:0;right:0;height:5vh;background:#000;z-index:3;pointer-events:none}
.lb.t{top:0}.lb.b{bottom:0}
#dlg{position:absolute;left:50%;bottom:calc(5vh + 12px);transform:translateX(-50%) translateY(20px);width:min(920px,94%);padding:22px 24px 18px;border-radius:18px;background:linear-gradient(180deg,rgba(18,10,22,.92),rgba(8,4,10,.95));border:2px solid var(--gold);box-shadow:0 0 0 4px rgba(0,0,0,.5),0 20px 50px rgba(0,0,0,.6),inset 0 0 30px rgba(240,204,98,.08);opacity:0;transition:opacity .25s,transform .25s;z-index:4;pointer-events:none}
#dlg.on{opacity:1;transform:translateX(-50%)}
#dlg.narr{background:linear-gradient(180deg,rgba(40,28,14,.93),rgba(22,14,6,.95));border-color:#c9a86a}
#dlg.narr #dtext{font-style:italic;color:#f6e8c8}
#dname{position:absolute;top:-18px;left:18px;padding:5px 16px;border-radius:8px;font-family:Bangers,Impact;letter-spacing:1.5px;font-size:20px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.5);transform:skewX(-10deg);box-shadow:3px 3px 0 #000;border:2px solid #fff}
#dtext{font-weight:800;font-size:clamp(16px,2.3vw,22px);line-height:1.45;min-height:3em;color:#fff}
#dnext{position:absolute;right:18px;bottom:8px;color:var(--gold);animation:bob .8s infinite;opacity:0}
@keyframes bob{50%{transform:translateY(4px)}}
.skip{position:absolute;top:calc(5vh + 10px);right:14px;z-index:6;padding:7px 14px;border-radius:20px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.35);font-weight:900;font-size:13px;letter-spacing:1px}

/* ---------- CHAPTERS ---------- */
#chapters{overflow:auto;background:radial-gradient(ellipse at top,#3a1420,#0e0508 70%);overflow-y:auto}
.chwrap{max-width:620px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px 40px}
.chhead{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.chhead h2{flex:1;font-family:'Cinzel Decorative',serif;font-weight:900;font-size:clamp(22px,5vw,34px);color:var(--gold);text-shadow:0 3px 0 #000}
#chStars{font-family:Bangers,Impact;font-size:22px;letter-spacing:1px;color:#ffe27a}
.chap{display:flex;width:100%;text-align:left;margin-bottom:14px;border-radius:18px;overflow:hidden;background:linear-gradient(90deg,#1e1016,#2a1420);border:2px solid rgba(240,204,98,.4);box-shadow:0 6px 0 rgba(0,0,0,.5);position:relative;animation:up .5s backwards;transition:transform .15s}
.chap:active{transform:scale(.98)}
.chap .thumb{position:relative;width:38%;min-height:120px;flex-shrink:0;-webkit-mask-image:linear-gradient(90deg,#000 70%,transparent);mask-image:linear-gradient(90deg,#000 70%,transparent)}
.cinfo{padding:12px 14px;flex:1}
.cnum{font-family:Bangers,Impact;letter-spacing:2px;color:#ff8a8a;font-size:15px}
.cttl{font-family:'Cinzel Decorative',serif;font-weight:900;font-size:clamp(17px,4vw,22px);color:#fff;line-height:1.1;margin:2px 0 4px}
.cdate{font-size:12.5px;opacity:.75;font-weight:700}
.cstars{margin-top:6px;font-size:22px;color:#4a3a3a;display:flex;align-items:center;gap:2px}
.cstars .on{color:#ffd23a;text-shadow:0 0 10px rgba(255,210,58,.7)}
.cstars em{font-style:normal;font-size:12px;color:#ffe9b0;margin-left:10px;font-weight:800}
.chap.locked{filter:grayscale(1) brightness(.5)}
.lock{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:30px}
.chfoot{text-align:center;margin-top:20px}
#chReset{font-size:12px;opacity:.55;text-decoration:underline;padding:8px}

/* ---------- PLAY ---------- */
#play{background:#000}
#pBgWrap{position:absolute;inset:-3%;animation:kb 30s ease-in-out infinite alternate}
@keyframes kb{to{transform:scale(1.12) translate(-2%,-1%)}}
#pBg{position:absolute;inset:0}
.pdim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,.05) 25%,rgba(0,0,0,.15) 50%,rgba(0,0,0,.8) 100%)}
.redglow{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 120%,rgba(255,30,30,.85),transparent 60%);opacity:calc(var(--fury) * 1.1);pointer-events:none;mix-blend-mode:screen}
#pCrowd{position:absolute;left:-2%;right:-2%;bottom:0;height:62%;transition:transform .6s ease-out;pointer-events:none}
#pCrowd svg{width:100%;height:100%}
#pCrowd .cr{animation:crowdBob 1s ease-in-out infinite alternate}
#pCrowd .r2{animation-duration:.8s;animation-delay:-.3s}#pCrowd .r3{animation-duration:.65s;animation-delay:-.5s}
@keyframes crowdBob{to{transform:translateY(-12px)}}
.vign{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 calc(40px + var(--fury) * 160px) rgba(200,0,20,calc(var(--fury) * .9))}
#play.critical .vign{animation:vpulse .9s infinite}
@keyframes vpulse{50%{opacity:.55}}
.hud{position:absolute;top:0;left:0;right:0;padding:calc(10px + env(safe-area-inset-top)) 12px 0;display:flex;align-items:center;gap:10px;z-index:5}
#pBtn{width:40px;height:40px;border-radius:12px;background:rgba(0,0,0,.5);border:2px solid rgba(255,255,255,.3);font-size:18px;font-weight:900}
#pTitle{flex:1;font-size:13px;font-weight:800;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 2px 4px #000}
#pTitle b{font-family:Bangers,Impact;letter-spacing:1px;color:var(--gold);font-size:16px;font-weight:400;margin-right:4px}
.score{font-family:Bangers,Impact;font-size:26px;letter-spacing:1px;color:#fff;text-shadow:0 3px 0 #000,0 0 12px rgba(255,210,90,.6);min-width:70px;text-align:right}
#fury{position:absolute;top:calc(58px + env(safe-area-inset-top));left:12px;right:12px;z-index:5;display:flex;align-items:center;gap:8px}
.ficon{width:42px;height:34px;flex-shrink:0;filter:drop-shadow(0 2px 2px #000)}
.ficon svg{width:100%;height:100%}
.fbar{flex:1;position:relative;height:22px;border-radius:12px;background:rgba(0,0,0,.6);border:2px solid #fff;overflow:hidden;box-shadow:0 0 0 2px #000}
#furyFill{position:absolute;inset:0 auto 0 0;width:20%;background:linear-gradient(90deg,#ffd23a,#ff8a1a 50%,#ff1a2a);transition:width .25s;box-shadow:0 0 20px #ff4a1a}
#furyFill::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(-45deg,rgba(255,255,255,.18) 0 8px,transparent 8px 16px);animation:stripes .6s linear infinite}
@keyframes stripes{to{background-position:22px 0}}
.flabel{position:absolute;inset:0;display:flex;align-items:center;padding-left:10px;font-family:Bangers,Impact;letter-spacing:2px;font-size:14px;text-shadow:0 1px 2px #000,0 0 4px #000}
#furyPct{font-family:Bangers,Impact;font-size:20px;min-width:46px;text-align:right;text-shadow:0 2px 0 #000}
#fury.hot .fbar{animation:shk .5s infinite}
#fury.crit #furyPct{color:#ff4a4a;animation:pulse .5s infinite}
#prog{position:absolute;top:calc(92px + env(safe-area-inset-top));left:0;right:0;display:flex;justify-content:center;gap:6px;z-index:5}
#prog i{width:16px;height:16px;transform:rotate(45deg);background:rgba(0,0,0,.5);border:2px solid rgba(255,255,255,.55);border-radius:3px}
#prog i.on{background:linear-gradient(135deg,#fff3b0,#f0b93a);border-color:#fff;box-shadow:0 0 10px #ffd23a}
#prog i.pop{animation:ipop .5s}
@keyframes ipop{50%{transform:rotate(45deg) scale(1.8)}}
#pLouis{position:absolute;left:-2%;bottom:calc(var(--cardH,52%) - 4%);height:34%;aspect-ratio:340/440;z-index:3;filter:drop-shadow(0 0 20px rgba(0,0,0,.6));transition:filter .3s}
#pLouis svg{width:100%;height:100%}
.bubble{position:absolute;left:min(30vw,190px);bottom:calc(var(--cardH,52%) + 18%);z-index:6;padding:9px 16px;border-radius:18px;background:#fff;color:#1a0a0a;font-weight:900;font-size:16px;border:3px solid #000;box-shadow:4px 4px 0 #000;opacity:0;transform:scale(.4);transform-origin:0 100%;transition:all .2s cubic-bezier(.2,1.5,.4,1);pointer-events:none;white-space:nowrap}
.bubble::before{content:'';position:absolute;left:-14px;bottom:8px;border:8px solid transparent;border-right:14px solid #000}
.bubble.on{opacity:1;transform:none}
.bubble.bad{background:#ffe0e0}
.bubble.good{background:#fffbe0}
#qwrap{position:absolute;left:0;right:0;bottom:0;padding:0 12px calc(12px + env(safe-area-inset-bottom));z-index:4;display:flex;flex-direction:column;align-items:center}
#powers{display:flex;gap:8px;margin-bottom:8px;width:min(760px,100%);justify-content:flex-end}
.pow{position:relative;display:flex;align-items:center;gap:6px;padding:6px 12px 6px 8px;border-radius:30px;background:rgba(10,6,14,.8);border:2px solid rgba(240,204,98,.6);font-weight:900;font-size:12px;box-shadow:0 3px 0 #000}
.pow .pi{font-size:20px}
.pow .pc{position:absolute;top:-8px;right:-6px;background:var(--red);border:2px solid #fff;border-radius:10px;min-width:20px;height:20px;font-size:11px;display:grid;place-items:center;padding:0 4px}
.pow:disabled{opacity:.4;filter:grayscale(.8)}
.pow.pulse{animation:ipop2 .6s}
@keyframes ipop2{50%{transform:scale(1.25)}}
#qcard{width:min(760px,100%);border-radius:20px;background:linear-gradient(180deg,rgba(255,250,236,.97),rgba(240,226,196,.97));color:#1a0e0a;padding:16px 16px 14px;box-shadow:0 0 0 3px #000,0 0 0 6px var(--gold),0 16px 40px rgba(0,0,0,.6);transform:translateY(30px) scale(.96);opacity:0;transition:transform .35s cubic-bezier(.2,1.3,.4,1),opacity .25s;position:relative}
#qcard.in{transform:none;opacity:1}
#timer{height:10px;border-radius:6px;background:rgba(0,0,0,.15);overflow:hidden;margin-bottom:10px;border:2px solid #1a0e0a}
#timerFill{height:100%;background:linear-gradient(90deg,#3aa8ff,#6ad4ff);transform-origin:0 50%}
#timerFill.low{background:linear-gradient(90deg,#ff2a3a,#ff8a3a);animation:pulse .4s infinite}
#timer.frozen #timerFill{background:linear-gradient(90deg,#c48aff,#e8d0ff);animation:none}
#qtag{display:inline-block;font-family:Bangers,Impact;letter-spacing:1.5px;font-size:14px;padding:2px 10px;border-radius:6px;color:#1a0a0a;border:2px solid #1a0a0a;transform:skewX(-8deg);margin-bottom:6px}
#qtext{font-weight:900;font-size:clamp(17px,2.6vw,22px);line-height:1.3;margin-bottom:12px}
#answers{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.ans{display:flex;align-items:center;gap:10px;text-align:left;padding:11px 12px;border-radius:14px;background:#fff;border:3px solid #1a0e0a;box-shadow:0 4px 0 #1a0e0a;font-weight:800;font-size:clamp(14px,2vw,17px);line-height:1.2;color:#1a0e0a;transition:transform .08s,background .2s,opacity .3s;min-height:54px}
.ans:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 #1a0e0a}
.ans .al{flex-shrink:0;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:#1a0e0a;color:var(--gold);font-family:Bangers,Impact;font-size:17px}
.ans.right{background:linear-gradient(180deg,#a6f0b0,#4ac46a);animation:ipop2 .4s;box-shadow:0 4px 0 #1a0e0a,0 0 24px #6aff8a}
.ans.wrong{background:linear-gradient(180deg,#ffb0b0,#ff4a5a);animation:shk .35s}
.ans.gone{opacity:.15;transform:scale(.95)}
.ans:disabled{cursor:default}
@media (max-width:560px){#answers{grid-template-columns:1fr}.ans{min-height:46px;padding:9px 12px}.pow .pn{display:none}#powers{justify-content:center}}
@media (max-aspect-ratio:4/3){#pCrowd{bottom:calc(var(--cardH,50%) - 14%);height:46%}}

<script>
/* ================= ART: anime-style SVG characters & scenes ================= */
const ART = (() => {
  let uid = 0; const U = p => p + (++uid);
  function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function shade(hex, a) { let c = hex.replace('#', ''); if (c.length == 3) c = c.split('').map(x => x + x).join(''); const n = parseInt(c, 16); let r = n >> 16, g = n >> 8 & 255, b = n & 255; const t = a < 0 ? 0 : 255, p = Math.abs(a); r = Math.round(r + (t - r) * p); g = Math.round(g + (t - g) * p); b = Math.round(b + (t - b) * p); return '#' + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1); }
  const f1 = n => (+n).toFixed(1);
  const OL = '#2a1714';
  const SK = ['#ffe4d2', '#f2b79c'];

  /* ---------- CHARACTERS ---------- */
  const C = {
    louis: { n: 'Louis XVI', col: '#4a7cf0', face: 'jowl', nose: 'bourbon', lid: 'heavy', chin: 'double', lip: 'full', eyeS: .9, hair: 'wig', hc: ['#f7f4ee', '#c9c1b3'], eye: '#6f8fb8', coat: '#2c52b4', coat2: '#162d70', trim: '#ecc75e', vest: '#f4e8c8', sash: '#5ab0ff', jabot: 1, star: 1 },
    marie: { n: 'Marie Antoinette', col: '#ec6ea6', face: 'slim', nose: 'aquiline', lip: 'habsburg', hair: 'pouf', hc: ['#fbf4e8', '#dccbb0'], eye: '#6a8fc8', coat: '#f6b3cc', coat2: '#cf6f97', trim: '#fff4cf', female: 1, pearls: 1 },
    necker: { n: 'Jacques Necker', col: '#a67ad2', face: 'jowl', nose: 'long', lid: 'heavy', chin: 'double', age: 1, eyeS: .85, hair: 'wig', hc: ['#ece8e0', '#b9b2a6'], eye: '#7a522b', coat: '#5f4078', coat2: '#38244c', trim: '#cfae5e', vest: '#efe2c4', jabot: 1 },
    sieyes: { n: 'Abbé Sieyès', col: '#93a4b8', face: 'narrow', nose: 'pointed', lip: 'thin', eyeS: .88, hair: 'short', hc: ['#4c3b33', '#271c17'], eye: '#3a8a62', coat: '#262630', coat2: '#101015', clergy: 1 },
    mirabeau: { n: 'Comte de Mirabeau', col: '#e0603e', face: 'massive', nose: 'flat', brow: 'bushy', pox: 1, chin: 'double', eyeS: .84, hair: 'big', hc: ['#ede7db', '#b8ad9b'], eye: '#8a431f', coat: '#802636', coat2: '#511420', trim: '#dbb65c', vest: '#f0e3c6', jabot: 1 },
    bailly: { n: 'Jean-Sylvain Bailly', col: '#7aa0d0', face: 'long', nose: 'long', lid: 'heavy', age: 1, eyeS: .84, hair: 'wig', hc: ['#e6e2da', '#ada699'], eye: '#4f6378', coat: '#23232a', coat2: '#0e0e12', vest: '#ece6da', jabot: 1 },
    lafayette: { n: 'Marquis de Lafayette', col: '#4a8ce0', face: 'narrow', nose: 'long', eyeS: .92, hair: 'wig', hc: ['#d98a52', '#9a5a2a'], eye: '#7a8a5a', coat: '#26448f', coat2: '#142a5e', trim: '#f0d06a', vest: '#f6f1e6', epau: 1, hat: 'bicorne', cockade: 1 },
    courtier: { n: 'Duc de Liancourt', col: '#c9a04a', face: 'def', hair: 'wig', hc: ['#f0eadf', '#c2b9a9'], eye: '#6a5238', coat: '#7d6c2a', coat2: '#4b4019', trim: '#ead28c', vest: '#f3e9d0', jabot: 1 },
    sansc: { n: 'Sans-culotte', col: '#ff4a4a', face: 'def', hair: 'messy', hc: ['#55331f', '#26170e'], eye: '#c2482a', coat: '#6e5641', coat2: '#3c2d20', stripes: 1, hat: 'phrygian', cockade: 1, scarf: '#d8352a' },
    woman: { n: 'Market Woman', col: '#f2923e', face: 'slim', hair: 'bun', hc: ['#74402a', '#3e2012'], eye: '#3f9a62', coat: '#ad5c3c', coat2: '#6e3522', trim: '#f4e8d2', female: 1, hat: 'mobcap', cockade: 1, shawl: '#ecdcbc' },
    drouet: { n: 'Jean-Baptiste Drouet', col: '#6ac06a', face: 'def', nose: 'long', eyeS: .95, hair: 'short', hc: ['#30251f', '#15100d'], eye: '#d0962e', coat: '#3f603b', coat2: '#223a20', trim: '#c9b07a', vest: '#e6dcc4', scarf: '#f2efe6' },
    robespierre: { n: 'Maximilien Robespierre', col: '#5ac487', face: 'narrow', nose: 'snub', lip: 'thin', pox: .5, eyeS: .88, hair: 'wig', hc: ['#f0ebe1', '#c3bbad'], eye: '#3fae6b', coat: '#40709a', coat2: '#264563', trim: '#d4dde6', vest: '#f2ede2', jabot: 1, glasses: 1 },
    danton: { n: 'Georges Danton', col: '#e2783a', face: 'massive', nose: 'flat', brow: 'bushy', pox: 1, scar: 1, eyeS: .82, hair: 'messy', hc: ['#3c2519', '#1d110a'], eye: '#93501f', coat: '#422e22', coat2: '#20160e', trim: '#a88a5a', vest: '#d9c9a9', scarf: '#f4f0e6' },
    commune: { n: 'Commune Official', col: '#e0354a', face: 'long', hair: 'short', hc: ['#3b2b22', '#1a120e'], eye: '#7a3030', coat: '#202027', coat2: '#0b0b0f', tsash: 1, hat: 'phrygian', cockade: 1, vest: '#e8e2d6' },
    guard: { n: 'Swiss Guard', col: '#e0363b', face: 'def', hair: 'short', hc: ['#cfa76c', '#8a6a3a'], eye: '#4a6ab0', coat: '#c62b2f', coat2: '#82191c', trim: '#f2d36a', vest: '#f4f0e8', epau: 1, hat: 'bicorne' }
  };

  const FACES = {
    def: 'M136,190 C136,118 264,118 264,190 C264,248 246,282 222,304 Q200,322 178,304 C154,282 136,248 136,190Z',
    round: 'M131,190 C131,114 269,114 269,190 C269,258 250,298 200,318 C150,298 131,258 131,190Z',
    slim: 'M140,190 C140,122 260,122 260,190 C260,244 242,280 220,302 Q200,318 180,302 C158,280 140,244 140,190Z',
    long: 'M140,186 C140,116 260,116 260,186 C260,256 240,298 218,316 Q200,330 182,316 C160,298 140,256 140,186Z',
    broad: 'M130,190 C130,114 270,114 270,190 C270,256 252,292 226,310 Q200,324 174,310 C148,292 130,256 130,190Z',
    jowl: 'M128,188 C128,112 272,112 272,188 C275,262 258,308 200,323 C142,308 125,262 128,188Z',
    narrow: 'M144,190 C144,124 256,124 256,190 C256,246 236,286 214,308 Q200,322 186,308 C164,286 144,246 144,190Z',
    massive: 'M122,186 C122,106 278,106 278,186 C281,252 268,298 236,318 Q200,334 164,318 C132,298 119,252 122,186Z'
  };

  function cockade(x, y, r = 15) { return `<circle cx="${x}" cy="${y}" r="${r}" fill="#2457c8" stroke="${OL}" stroke-width="2.5"/><circle cx="${x}" cy="${y}" r="${r * .68}" fill="#fff"/><circle cx="${x}" cy="${y}" r="${r * .36}" fill="#d8283a"/>`; }

  function body(c, g) {
    const st = `stroke="${OL}" stroke-width="4" stroke-linejoin="round"`;
    let s = '';
    if (c.female) {
      s += `<path d="M24,560 C34,452 78,410 140,394 C162,389 178,386 200,386 C222,386 238,389 260,394 C322,410 366,452 376,560Z" fill="url(#${g}co)" ${st}/>`;
      s += `<path d="M262,396 C324,412 366,452 376,560 L310,560 C306,480 290,430 262,396Z" fill="#000" opacity=".16"/>`;
      if (c.shawl) {
        s += `<path d="M96,412 Q200,520 304,412 L318,440 Q200,560 82,440Z" fill="${c.shawl}" ${st}/>`;
        s += `<path d="M150,394 Q200,378 250,394 Q238,436 200,446 Q162,436 150,394Z" fill="${SK[0]}" stroke="${OL}" stroke-width="3"/>`;
      } else {
        s += `<path d="M146,394 Q200,374 254,394 Q240,446 200,456 Q160,446 146,394Z" fill="${SK[0]}" stroke="${OL}" stroke-width="3"/>`;
        s += `<path d="M132,398 Q200,486 268,398" fill="none" stroke="${c.trim}" stroke-width="12" stroke-dasharray="1 9" stroke-linecap="round"/>`;
        s += `<path d="M180,470 Q200,456 220,470 Q200,486 180,470Z M200,470 L188,500 M200,470 L212,500" fill="#7ab8ff" stroke="${OL}" stroke-width="2.5"/>`;
      }
      if (c.pearls) { for (let i = 0; i <= 10; i++) { const t = i / 10, x = 166 + 68 * t, y = 392 + Math.sin(t * Math.PI) * 26; s += `<circle cx="${f1(x)}" cy="${f1(y)}" r="5" fill="#fffaf0" stroke="#b9a98a" stroke-width="1.5"/>`; } s += `<circle cx="200" cy="426" r="9" fill="#fffaf0" stroke="#b9a98a" stroke-width="2"/>`; }
      if (c.cockade && c.shawl) s += cockade(150, 470, 13);
      return s;

  const mkQ = (l, idx, extra) => { const q = LEVELS[l].qs[idx]; return Object.assign({ kind: 'mc', lvl: l, idx, tag: q[0], q: q[1], a: q.slice(2, 6), ex: q[6] }, extra || {}); };

  function setLouis(ex, force) { if (!force && G.louisEx === ex) return; G.louisEx = ex; $('#pLouis').innerHTML = ART.portrait('louis', ex, 'bust'); }
  function baseExpr() { return G.fury < 35 ? 'determined' : G.fury < 60 ? 'neutral' : G.fury < 80 ? 'sad' : 'fear'; }

  function bubble(txt, good) { const b = $('#bubble'); b.textContent = txt; b.className = 'bubble on ' + (good ? 'good' : 'bad'); clearTimeout(bubT); bubT = setTimeout(() => b.classList.remove('on'), 1300); }
  let bbT;
  function bossSay(txt) { const b = $('#bossBub'); b.textContent = txt; b.classList.add('on'); clearTimeout(bbT); bbT = setTimeout(() => b.classList.remove('on'), 1500); }

  /* ----- next question ----- */
  function nextQ() {
    if (!G.surv && !G.boss && !G.bossDone && G.correct >= G.L.goal) return startBoss();

    if (q.kind === 'order') G.tmax += 6;

  /* ----- loop ----- */
  function loop(t) {
    const dt = Math.min(.1, (t - G.last) / 1000); G.last = t;

        if (G.mg.tick && !G.boss) G.mg.tick(dt);
        if (G.time <= 0) { G.time = 0; timeout(); }
      }
      if (G.fever > 0) { G.fever -= dt; if (G.fever <= 0) endFever(); }
      if (G.fury >= 100) { G.fury = 100; updateHUD(); return lose(); }
      if (G.fury > 75) { G.beat -= dt; if (G.beat <= 0) { AU.sfx('heart'); G.beat = 1.1 - (G.fury - 75) / 50; } }
      updateHUD();
    }
  }

  function updateHUD() {
    const f = Math.max(0, Math.min(100, G.fury));
    $('#furyFill').style.width = f + '%';
    $('#furyPct').textContent = Math.round(f) + '%';
    const fb = $('#fury'); fb.classList.toggle('hot', f > 60); fb.classList.toggle('crit', f > 80);
    const tp = Math.max(0, G.time / G.tmax);
    $('#timerFill').style.transform = `scaleX(${tp})`;
    $('#timerFill').classList.toggle('low', tp < .3);
    $('#timer').classList.toggle('frozen', !!G.freeze);
    $('#pScore').textContent = G.score.toLocaleString();
    $('#play').style.setProperty('--fury', f / 100);
    $('#play').classList.toggle('critical', f > 80);
    $('#pCrowd').style.transform = `translateY(${(1 - f / 100) * 55}%)`;
    AU.crowd(Math.pow(f / 100, 1.6));
    if (!G.reacting) setLouis(baseExpr());
  }
  function react(ex, ms = 900) { G.reacting = true; setLouis(ex); clearTimeout(G.rt); G.rt = setTimeout(() => { G.reacting = false; setLouis(baseExpr()); }, ms); }

  /* ----- answering ----- */
  function answer(btn, ok) {
    if (!G.running || G.paused) return;
    G.running = false; G.answered++;
    const q = G.q;
    $$('#answers .ans').forEach(b => b.disabled = true);
    const key = q.key || (q.lvl + ':' + q.idx);
    if (ok) {
      G.correct++; G.streak++; G.best = Math.max(G.best, G.streak);
      const tb = Math.round(G.time / G.tmax * 100), mult = (1 + Math.min(4, Math.floor(G.streak / 2)) * .25) * (G.fever > 0 ? 2 : 1) * (G.boss ? 1.5 : 1);
      const pts = Math.round((100 + tb) * mult); G.score += pts;
      G.fury = Math.max(0, G.fury - (9 + Math.min(G.streak, 6)));
      if (q.lvl != null) delete SAVE.missed[key];
      if (btn) btn.classList.add('right');
      if (q.kind === 'order') $$('#answers .ans').forEach(b => b.classList.add('right'));
      AU.sfx('correct');
      const r = (btn || $('#qcard')).getBoundingClientRect(); PX.burst(r.left + r.width / 2, r.top + r.height / 2, '#ffd76a', 30, 340, 1);
      floater('+' + pts, r.left + r.width / 2, r.top);
      react('happy');
      if (G.boss) bossHit(); else { bubble(pick(LOUIS_LINES.good), true); G.mg.correct(); }
      if (G.streak >= 2) combo(G.streak, mult);
      if (G.streak > 0 && G.streak % 4 === 0) grantPower();
      if (G.streak >= 8 && !G.fever && !G.feverUsed) startFever();

  function answerText(q) {

    return q.a[0];
  }
  function miss(btn, q, key, late) {

  function floater(txt, x, y, cls) { const f = el('div', 'floater' + (cls ? ' ' + cls : ''), txt); f.style.left = x + 'px'; f.style.top = y + 'px'; document.body.appendChild(f); setTimeout(() => f.remove(), 1100); }

  /* ----- cards ----- */
  function maybeCard(force) {
    const chance = .22 + .08 * upg('luck');
    if (!force && Math.random() > chance) return;
    const maxCh = G.surv ? Math.max(2, SAVE.unlocked) : G.lvl;
    const pool = CARDS.filter(c => !SAVE.cards[c.id] && !c.boss && c.ch <= maxCh);
    if (!pool.length) return;
    const cur = pool.filter(c => c.ch === maxCh);
    const weighted = (cur.length && Math.random() < .6 ? cur : pool).flatMap(c => c.r === 2 ? [c] : [c, c, c]);
    awardCard(pick(weighted));
  }
  function cardArt(c, crop = 'head') { return c.art.length > 3 ? ART.portrait(c.art, c.boss ? 'angry' : 'neutral', crop) : `<span class="emo">${c.art}</span>`; }

  function lose() {

  }

  function missedList() { return G.missed.slice(0, 4).map(q => `<li><b>${q.kind === 'order' ? 'Timeline' : q.a[0]}</b><span>${q.kind === 'order' ? q.ex : q.q}</span></li>`).join(''); }
  function cardsWonHTML() { return G.cardsWon && G.cardsWon.length ? `<div class="rcards">${G.cardsWon.map(c => `<div class="mini r${c.r}">${cardArt(c)}<b>${c.name}</b></div>`).join('')}</div>` : ''; }

      <div class="rfavor">+${r.favor} ⚜ Royal Favor <span>(${SAVE.favor} total)</span></div>
      ${cardsWonHTML()}
      ${missed ? `<div class="rmiss"><h4>📜 Study these</h4><ul>${missed}</ul></div>` : (r.win ? '<div class="rperfect">Flawless! Not a single mistake.</div>' : '')}
      <div class="rbtns">${r.win ? `<button class="btn gold" id="resNext">${i === LEVELS.length - 1 ? 'Witness the End' : 'Continue Story'} ▸</button>` : `<button class="btn gold" id="resRetry">Try Again</button>`}
      <div class="row"><button class="btn" id="resReplay">${r.win ? 'Replay' : 'Rewatch Intro'}</button><button class="btn" id="resShop">⚜ Shop</button><button class="btn" id="resMenu">Chapters</button></div></div>`;
    if (r.win) {
      $$('.rstars .st').forEach((s, k) => { if (k < r.stars) setTimeout(() => { s.classList.add('on'); AU.sfx('star', k); const b = s.getBoundingClientRect(); PX.burst(b.left + b.width / 2, b.top + b.height / 2, '#ffe27a', 24, 260, 1); }, 500 + k * 450); });
      $('#resNext').onclick = () => { AU.sfx('click'); afterLevel(i); };
      $('#resReplay').onclick = () => { AU.sfx('click'); startGame(i); };
      AU.music('title');
    } else {
      $('#resRetry').onclick = () => { AU.sfx('click'); startGame(i); };
      $('#resReplay').onclick = () => { AU.sfx('click'); playLevel(i); };
      AU.music('somber');
    }
    $('#resShop').onclick = () => { AU.sfx('click'); openShop(() => showResults(r)); };
    $('#resMenu').onclick = () => { AU.sfx('click'); openChapters(); };
    PX.setMode(r.win ? 'sparkle' : 'embers');
  }

  /* ---------- SURVIVAL END + LEADERBOARDS ---------- */
  const TEAMS = { third: { name: 'Third Estate', col: '#2457c8' }, nobles: { name: 'Nobles', col: '#b8862a' } };
  function showSurvivalEnd(favor) {
    const box = $('#results'); box.className = 'screen on lost surv';
    $$('.screen').forEach(s => { if (s !== box) s.classList.remove('on'); });
    $('#resBg').innerHTML = ART.bg('title'); $('#resPortrait').innerHTML = ART.portrait('sansc', 'angry', 'bust');
    const isBest = G.score > (SAVE.survBest || 0); if (isBest) { SAVE.survBest = G.score; persist(); }
    $('#resBody').innerHTML = `<div class="rhead">Survival Over</div>
      <div class="rstats"><div><b>${G.score.toLocaleString()}</b><span>Score${isBest ? ' · NEW BEST' : ''}</span></div><div><b>${G.correct}</b><span>Correct</span></div><div><b>${G.bossesBeaten}</b><span>Bosses</span></div></div>
      <div class="rfavor">+${favor} ⚜ Royal Favor <span>(${SAVE.favor} total)</span></div>${cardsWonHTML()}
      <div class="sform"><label>Your name for the leaderboard<input id="sName" maxlength="16" placeholder="First name or nickname" value="${(SAVE.nick || '').replace(/"/g, '')}"></label>
      <div class="teams">${Object.entries(TEAMS).map(([k, t]) => `<button class="team ${SAVE.team === k ? 'on' : ''}" data-t="${k}" style="--tc:${t.col}">${t.name}</button>`).join('')}</div>
      <button class="btn gold" id="sSubmit">Post my score</button><div class="snote" id="sNote"></div></div>
      ${missedList() ? `<div class="rmiss"><h4>📜 Study these</h4><ul>${missedList()}</ul></div>` : ''}
      <div class="rbtns"><div class="row"><button class="btn" id="sAgain">Play again</button><button class="btn" id="sBoard">🏆 Leaderboard</button><button class="btn" id="sMenu">Title</button></div></div>`;
    $$('.team').forEach(b => b.onclick = () => { SAVE.team = b.dataset.t; persist(); $$('.team').forEach(x => x.classList.toggle('on', x === b)); AU.sfx('click'); });
    $('#sSubmit').onclick = async () => {
      const nick = $('#sName').value.trim().slice(0, 16);
      if (!nick) { $('#sNote').textContent = 'Type a name first.'; return; }
      if (!SAVE.team) { $('#sNote').textContent = 'Pick a team first.'; return; }
      SAVE.nick = nick; SAVE.board = (SAVE.board || []).concat({ nick, team: SAVE.team, score: G.score, at: Date.now() }).sort((a, b) => b.score - a.score).slice(0, 15); persist();
      $('#sSubmit').disabled = true; AU.sfx('power');
      const ok = await CLASS.submit(nick, SAVE.team, G.score);
      $('#sNote').textContent = ok === true ? 'Posted to this device and the class board!' : 'Saved to this device’s leaderboard.' + (ok === false ? ' (The class board isn’t available here.)' : '');
    };
    $('#sAgain').onclick = () => { AU.sfx('click'); startGame(-1); };
    $('#sBoard').onclick = () => { AU.sfx('click'); openBoard(); };
    $('#sMenu').onclick = () => { AU.sfx('click'); show('title'); AU.music('title'); PX.setMode('embers'); };
    AU.music('somber'); PX.setMode('embers');
  }

  const CLASS = (() => {
    let db = null, uid = null, user = null, ready = false, writable = true;
    (async () => {
      try {
        if (!window.claude || !window.claude.use) return;
        db = await window.claude.use('db'); user = await window.claude.use('user');
        uid = user ? await user.id() : null; ready = !!(db && uid);
      } catch (e) { ready = false; }
    })();
    return {
      get ready() { return ready && writable; },
      get owner() { try { return !!(user && user.isOwner()); } catch (e) { return false; } },
      async submit(nick, team, score) {
        if (!ready) return false;
        try {
          const ref = db.collection('scores').doc(uid); const s = await ref.get();
          const old = s.exists ? s.data() : null;
          if (old && old.score >= score && old.nick === nick && old.team === team) return true;
          await ref.set({ nick, team, score: Math.max(score, old && old.team === team ? old.score || 0 : 0), at: Date.now() });
          return true;
        } catch (e) { writable = false; return false; }
      },
      async list() {
        if (!ready) return null;
        try { const q = await db.collection('scores').orderBy('score', 'desc').limit(40).get(); return q.docs.map(d => Object.assign({ id: d.id }, d.data())); } catch (e) { return null; }
      },
      async clear(rows) { for (const r of rows) { try { await db.collection('scores').doc(r.id).delete(); } catch (e) { } } }
    };
  })();

  async function openBoard(tab) {
    show('board'); PX.setMode('sparkle');
    tab = tab || 'device';
    const body = $('#boardBody');
    const head = `<div class="tabs"><button data-tab="device" class="${tab === 'device' ? 'on' : ''}">This device</button><button data-tab="class" class="${tab === 'class' ? 'on' : ''}">Class</button></div>`;
    const rowsHTML = rows => rows.length ? `<ol class="lb">${rows.slice(0, 20).map((r, k) => `<li><span class="rk">${k + 1}</span><span class="nm"></span><span class="tm" style="background:${(TEAMS[r.team] || TEAMS.third).col}">${(TEAMS[r.team] || TEAMS.third).name}</span><b>${(+r.score || 0).toLocaleString()}</b></li>`).join('')}</ol>` : '<p class="empty">No scores yet. Play Survival to get on the board!</p>';
    const teamBar = rows => { const t = { third: 0, nobles: 0 }; rows.forEach(r => { if (t[r.team] != null) t[r.team] += +r.score || 0; }); const z = !(t.third + t.nobles); return `<div class="tbar"><div style="flex:${z ? 1 : t.third || .001};background:${TEAMS.third.col}">Third Estate ${t.third.toLocaleString()}</div><div style="flex:${z ? 1 : t.nobles || .001};background:${TEAMS.nobles.col}">Nobles ${t.nobles.toLocaleString()}</div></div>`; };
    const fill = rows => { body.querySelectorAll('.lb .nm').forEach((n, k) => n.textContent = rows[k].nick || 'Player'); };
    if (tab === 'device') {
      const rows = SAVE.board || [];
      body.innerHTML = head + teamBar(rows) + rowsHTML(rows); fill(rows);
    } else {
      body.innerHTML = head + '<p class="empty">Loading the class board…</p>';
      const rows = await Promise.race([CLASS.list(), wait(8000).then(() => null)]);
      if (!rows) body.innerHTML = head + `<p class="empty">The class board isn’t available in this view. It works when students open the game signed in to Claude with Contributor access to it. Scores are still saved on each device.</p>`;
      else { body.innerHTML = head + teamBar(rows) + rowsHTML(rows) + (CLASS.owner && rows.length ? '<button class="btn" id="lbClear">Clear class board</button>' : ''); fill(rows);
        const c = $('#lbClear'); if (c) c.onclick = async () => { if (!c.dataset.arm) { c.dataset.arm = 1; c.textContent = 'Tap again to clear'; return; } c.disabled = true; await CLASS.clear(rows); openBoard('class'); }; }
    }
    body.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { AU.sfx('click'); openBoard(b.dataset.tab); });
  }
  $('#boardBack').addEventListener('click', () => { AU.sfx('click'); show('title'); PX.setMode('embers'); });

  /* ---------- ALBUM ---------- */
  function openAlbum() {
    show('album'); PX.setMode('sparkle');
    const have = CARDS.filter(c => SAVE.cards[c.id]).length;
    $('#albumCount').textContent = `${have} / ${CARDS.length}`;
    const g = $('#albumGrid'); g.innerHTML = '';
    LEVELS.forEach((L, ch) => {
      g.appendChild(el('h3', 'ach', `Chapter ${ROMAN[ch]} · ${L.title}`));
      const row = el('div', 'arow');
      CARDS.filter(c => c.ch === ch).forEach(c => {
        const own = SAVE.cards[c.id];
        const d = el('button', 'acard r' + c.r + (own ? '' : ' locked'), own ? `<div class="aart">${cardArt(c)}</div><b>${c.name}</b><span>${'★'.repeat(c.r)}</span>` : `<div class="aart q">?</div><b>???</b><span>${c.boss ? 'Boss card' : '★'.repeat(c.r)}</span>`);
        d.onclick = () => { if (!own) { AU.sfx('wrong'); shake(d); return; } AU.sfx('card'); cardDetail(c); };
        row.appendChild(d);
      });
      g.appendChild(row);
    });
  }
  function cardDetail(c) {
    const m = $('#cardModal'); m.classList.add('on');
    m.innerHTML = `<div class="bigcard r${c.r}"><div class="bart">${cardArt(c, 'bust')}</div><div class="binfo"><span>${'★'.repeat(c.r)} · Chapter ${ROMAN[c.ch]}</span><b>${c.name}</b><p>${c.fact}</p></div><button class="btn" id="cmClose">Close</button></div>`;
    $('#cmClose').onclick = () => { AU.sfx('click'); m.classList.remove('on'); };
  }
  $('#albumBack').addEventListener('click', () => { AU.sfx('click'); show('title'); PX.setMode('embers'); });

  /* ---------- SHOP ---------- */
  let shopBack = null;
  function openShop(back) {
    shopBack = back || null; show('shop'); PX.setMode('sparkle');
    $('#favorBal').textContent = `⚜ ${SAVE.favor || 0}`;
    const list = $('#shopList'); list.innerHTML = '';
    UPGRADES.forEach(u => {
      const tier = upg(u.id), maxed = tier >= u.costs.length, cost = u.costs[tier];
      const row = el('div', 'up', `<div class="uico">${u.ico}</div><div class="uinfo"><b>${u.name}</b><span>${u.desc}</span><div class="pips">${u.costs.map((_, k) => `<i class="${k < tier ? 'on' : ''}"></i>`).join('')}</div></div>`);
      const b = el('button', 'btn ' + (maxed ? '' : 'gold'), maxed ? 'MAX' : `⚜ ${cost}`);
      b.disabled = maxed || (SAVE.favor || 0) < cost;
      b.onclick = () => { if ((SAVE.favor || 0) < cost) return; SAVE.favor -= cost; SAVE.upg[u.id] = tier + 1; persist(); AU.sfx('buy'); PX.burst(innerWidth / 2, innerHeight / 3, '#ffd76a', 40, 400, 1); openShop(shopBack); };
      row.appendChild(b); list.appendChild(row);
    });
  }
  $('#shopBack').addEventListener('click', () => { AU.sfx('click'); if (shopBack) shopBack(); else { show('title'); PX.setMode('embers'); } });

  /* ---------- END ---------- */
  function showEnd() {
    const tot = SAVE.stars.reduce((a, b) => a + (b || 0), 0), max = LEVELS.length * 3;
    const score = SAVE.best.reduce((a, b) => a + (b || 0), 0);
    const rank = tot >= 19 ? 'Master of the Revolution' : tot >= 14 ? 'Revolutionary Scholar' : tot >= 8 ? 'Loyal Deputy' : 'Confused Courtier';
    $('#endBg').innerHTML = ART.bg('title');
    $('#endBody').innerHTML = `<div class="ebig">FIN</div><div class="esub">The story of Louis XVI is complete.</div>
      <div class="erank"><span>Your title</span><b>${rank}</b></div>
      <div class="rstats"><div><b>★ ${tot}/${max}</b><span>Stars</span></div><div><b>${score.toLocaleString()}</b><span>Total best score</span></div></div>
      <p class="enote">Earn 3 stars in every chapter to become a <b>Master of the Revolution</b>.</p>
      <div class="rbtns"><button class="btn gold" id="endCh">Chapters</button><button class="btn" id="endTitle">Title Screen</button></div>`;
    show('end'); AU.music('end'); PX.setMode('sparkle');
    $('#endCh').onclick = () => { AU.sfx('click'); openChapters(); };
    $('#endTitle').onclick = () => { AU.sfx('click'); show('title'); PX.setMode('embers'); AU.music('title'); };
  }

  /* ---------- PAUSE & SOUND ---------- */
  function updateSoundBtns() { $$('.sndM').forEach(b => b.classList.toggle('off', !AU.musicOn)); $$('.sndS').forEach(b => b.classList.toggle('off', !AU.sfxOn)); }
  $$('.sndM').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); AU.unlock(); AU.toggleMusic(); updateSoundBtns(); }));
  $$('.sndS').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); AU.unlock(); AU.toggleSfx(); updateSoundBtns(); AU.sfx('click'); }));
  function pause(on) { if (!G.L || G.over) return; G.paused = on; $('#pause').classList.toggle('on', on); if (!on) G.last = performance.now(); }
  $('#pBtn').addEventListener('click', () => { AU.sfx('click'); pause(true); });
  $('#pResume').addEventListener('click', () => { AU.sfx('click'); pause(false); });
  $('#pRestart').addEventListener('click', () => { AU.sfx('click'); $('#pause').classList.remove('on'); stopPlay(); startGame(G.lvl); });
  $('#pQuit').addEventListener('click', () => { AU.sfx('click'); $('#pause').classList.remove('on'); stopPlay(); if (G.surv) { show('title'); AU.music('title'); PX.setMode('embers'); } else openChapters(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) { if ($('#play').classList.contains('on') && G.running) pause(true); AU.suspend(); } else AU.resume(); });
  addEventListener('keydown', e => {
    if ($('#play').classList.contains('on') && G.running && !G.paused) { const k = 'abcd1234'.indexOf(e.key.toLowerCase()); if (k >= 0) { const b = $$('#answers .ans')[k % 4]; if (b && !b.disabled) b.click(); } }
    if ($('#cs').classList.contains('on') && (e.key === ' ' || e.key === 'Enter')) cs.dispatchEvent(new PointerEvent('pointerup'));
  });

  buildTitle();
  show('title');
  window.__G = { G, get SAVE() { return SAVE; }, playLevel, playBonus, startGame, openChapters, showEnd, playCutscene, openAlbum, openShop, openBoard, awardCard };
})();

</script>
</body>
</html>
