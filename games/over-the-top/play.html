<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" href="/assets/fonts.css">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Over the Top: The Great War</title>
<style>
:root{--ink:#241d12;--paper:#efe4c8;--paper2:#e0cfa3;--olive:#4b5320;--olive2:#6b7334;--khaki:#8a7d4f;--mud:#4a3a28;--mud2:#2e241a;--poppy:#c8102e;--gold:#e0b030;--steel:#2f363b;--blue:#3d5a80}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#16120c;color:var(--paper);font-family:Oswald,system-ui,sans-serif;overflow-x:hidden}
button{font-family:inherit;cursor:pointer;border:none}
.screen{display:none;min-height:100vh;width:100%}
.screen.active{display:block}
.type{font-family:'Special Elite',monospace}
/* ---------- TITLE ---------- */
#scr-title{position:relative;overflow:hidden}
#titleCanvas{position:absolute;inset:0;width:100%;height:100%}
.titleBox{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:24px}
.titleBox h1{font-size:clamp(48px,10vw,120px);font-weight:700;letter-spacing:4px;line-height:.9;color:#f4e6c2;text-shadow:0 4px 0 #000,0 0 40px rgba(200,16,46,.45)}
.titleBox h1 span{color:var(--poppy)}
.titleBox .sub{font-family:'Special Elite';font-size:clamp(16px,2.4vw,24px);margin:14px 0 30px;color:#e6d5a8;text-shadow:0 2px 4px #000}
.bigbtn{background:linear-gradient(#d4202f,#8f0b1d);color:#fff;font-size:24px;font-weight:600;letter-spacing:2px;padding:14px 44px;border-radius:6px;box-shadow:0 6px 0 #4d0610,0 10px 30px rgba(0,0,0,.6);text-transform:uppercase;transition:transform .1s}
.bigbtn:hover{transform:translateY(-2px)}
.bigbtn:active{transform:translateY(3px);box-shadow:0 2px 0 #4d0610}
.ghost{background:rgba(20,16,10,.7);color:var(--paper);border:2px solid #b9a36d;padding:10px 22px;border-radius:6px;font-size:17px;letter-spacing:1px;text-transform:uppercase}
.ghost:hover{background:rgba(60,48,28,.9)}
.titleRow{display:flex;gap:12px;margin-top:16px;flex-wrap:wrap;justify-content:center}
.rankTag{margin-top:22px;font-family:'Special Elite';color:#d9c58f;font-size:16px;text-shadow:0 1px 3px #000}
/* ---------- PAPER PANELS ---------- */
.paperBg{background:#1b1610 radial-gradient(ellipse at center,#2b2216 0%,#120e09 80%)}
.wrap{max-width:1180px;margin:0 auto;padding:18px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.topbar h2{font-size:30px;letter-spacing:2px;text-transform:uppercase}
.paper{background:var(--paper);color:var(--ink);border-radius:4px;box-shadow:0 8px 30px rgba(0,0,0,.5),inset 0 0 60px rgba(120,90,40,.35);position:relative}
.paper::before{content:"";position:absolute;inset:0;border-radius:4px;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 28px,rgba(120,90,40,.07) 28px 29px)}
/* ---------- MAP ---------- */
.mapGrid{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}
@media(max-width:860px){.mapGrid{grid-template-columns:1fr}}
#mapSvg{width:100%;height:auto;display:block;border-radius:4px}
.blist{display:flex;flex-direction:column;gap:8px}
.bitem{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:4px;background:rgba(36,29,18,.08);border:2px solid transparent;cursor:pointer;color:var(--ink);text-align:left;width:100%}
.bitem:hover:not(.locked){border-color:var(--poppy);background:rgba(200,16,46,.08)}
.bitem.locked{opacity:.45;cursor:not-allowed}
.bitem .num{width:34px;height:34px;border-radius:50%;background:var(--olive);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.bitem.locked .num{background:#777}
.bitem .bt{flex:1}
.bitem .bt b{display:block;font-size:17px;line-height:1.1}
.bitem .bt small{font-family:'Special Elite';font-size:13px;opacity:.8}
.stars{color:#b08a1a;letter-spacing:2px;font-size:18px;white-space:nowrap}
.stars i{font-style:normal;color:#c9bb94}
.teacher{font-size:13px;opacity:.7;margin-top:8px;color:var(--ink);display:flex;gap:6px;align-items:center;font-family:'Special Elite'}
/* ---------- BRIEF ---------- */
.brief{padding:26px 30px;max-width:900px;margin:10px auto}
.stamp{position:absolute;top:18px;right:22px;border:3px solid var(--poppy);color:var(--poppy);padding:4px 12px;font-weight:700;transform:rotate(6deg);letter-spacing:2px;opacity:.85;font-size:18px}
.brief h3{font-size:34px;line-height:1.05;text-transform:uppercase;letter-spacing:1px;max-width:80%}
.brief .meta{font-family:'Special Elite';margin:6px 0 14px;font-size:16px;color:#5a4a2c}
.brief p{font-family:'Special Elite';font-size:17px;line-height:1.55;margin-bottom:12px}
.heroBox{display:flex;gap:16px;align-items:flex-start;background:rgba(75,83,32,.12);border-left:6px solid var(--olive);padding:14px;margin:14px 0;border-radius:3px}
.heroBox canvas{flex:none;border-radius:4px;background:#2c2416}
.heroBox h4{font-size:20px;text-transform:uppercase;letter-spacing:1px}
.heroBox .ab{display:inline-block;margin-top:6px;background:var(--olive);color:#fff;padding:3px 10px;border-radius:3px;font-size:14px;letter-spacing:.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 16px}
.chip{background:var(--ink);color:var(--paper);padding:3px 9px;border-radius:12px;font-size:13px;letter-spacing:.3px}
.newMech{background:#fff3cf;border:2px dashed #b08a1a;padding:10px 14px;border-radius:4px;font-family:'Special Elite';font-size:15px;margin-bottom:16px}
.briefBtns{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}
.ghostDark{background:transparent;color:var(--ink);border:2px solid var(--ink);padding:10px 20px;border-radius:6px;font-size:16px;text-transform:uppercase}
/* ---------- BATTLE ---------- */
#scr-battle{background:#120e09}
.bgrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;grid-template-rows:auto auto auto;gap:8px;padding:8px;max-width:1500px;margin:0 auto}
.hud{grid-column:1/3;display:flex;align-items:center;gap:12px;background:linear-gradient(#2c2416,#1d170f);border:1px solid #4a3d25;border-radius:6px;padding:6px 12px;flex-wrap:wrap}
.hud .bname{font-size:16px;text-transform:uppercase;letter-spacing:1px;color:#e8d7a6;line-height:1.1}
.hud .bname small{display:block;font-family:'Special Elite';font-size:12px;color:#b9a675;text-transform:none;letter-spacing:0}
.tug{flex:1;min-width:220px;display:flex;align-items:center;gap:8px}
.tug .lab{font-size:12px;letter-spacing:1px;text-transform:uppercase;white-space:nowrap}
.bar{flex:1;height:16px;background:#0b0906;border:1px solid #5a4a2c;border-radius:9px;overflow:hidden;position:relative}
.bar>div{height:100%;transition:width .3s}
#barP{background:linear-gradient(90deg,#3d5a80,#6f9ad0)}
#barE{background:linear-gradient(90deg,#8a8f7c,#5d6152);margin-left:auto}
.bar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;text-shadow:0 1px 2px #000}
.timer{font-size:22px;font-weight:600;min-width:62px;text-align:center;color:#f1e3b8}
.supply{display:flex;align-items:center;gap:6px;background:#0b0906;border:1px solid #6b5a33;border-radius:16px;padding:2px 12px 2px 6px;font-size:22px;font-weight:700;color:var(--gold)}
.supply .ic{width:22px;height:22px}
.hbtn{background:#3a3020;color:#f1e3b8;width:36px;height:36px;border-radius:6px;font-size:18px}
.fieldwrap{position:relative;grid-column:1;border-radius:6px;overflow:hidden;border:2px solid #3b301f;background:#3e3122;touch-action:manipulation}
#field{display:block;width:100%;aspect-ratio:1000/520;cursor:crosshair}
#coach{position:absolute;left:50%;top:10px;transform:translateX(-50%);max-width:88%;background:rgba(239,228,200,.96);color:var(--ink);font-family:'Special Elite';font-size:15px;padding:8px 14px;border-radius:4px;border-left:6px solid var(--poppy);box-shadow:0 4px 16px rgba(0,0,0,.5);display:none;pointer-events:none;text-align:left;line-height:1.35}
#banner{position:absolute;left:0;right:0;top:42%;text-align:center;pointer-events:none;font-size:clamp(20px,3.4vw,40px);font-weight:700;letter-spacing:3px;text-transform:uppercase;color:#fff;text-shadow:0 3px 0 #000,0 0 20px rgba(200,16,46,.8);opacity:0;transition:opacity .3s}
.cmd{grid-column:1;display:grid;grid-template-columns:auto auto 1fr auto;gap:8px;align-items:stretch}
.panel{background:linear-gradient(#2a2216,#1c160e);border:1px solid #4a3d25;border-radius:6px;padding:8px 10px}
.panel h5{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#b9a675;margin-bottom:6px;font-weight:500}
.sectors{display:flex;gap:4px}
.sectors button{width:38px;height:38px;border-radius:5px;background:#3a3020;color:#e8d7a6;font-size:17px;font-weight:600;border:2px solid transparent}
.sectors button.on{background:var(--gold);color:#241d12;border-color:#fff3c2}
.otop{display:flex;gap:6px;align-items:center}
.whistle{background:linear-gradient(#d4202f,#8f0b1d);color:#fff;font-weight:700;font-size:17px;letter-spacing:1px;padding:0 14px;height:42px;border-radius:6px;box-shadow:0 3px 0 #4d0610;text-transform:uppercase}
.whistle:disabled{filter:grayscale(1) brightness(.6);cursor:not-allowed}
.small{background:#3a3020;color:#e8d7a6;height:42px;padding:0 10px;border-radius:6px;font-size:13px;text-transform:uppercase}
.reserve{font-size:13px;color:#e8d7a6;line-height:1.1;text-align:center;min-width:54px}
.reserve b{font-size:22px;display:block;color:#fff}
.arty{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.arty .stat{font-size:13px;color:#e8d7a6;text-align:center;line-height:1.1}
.arty .stat b{font-size:20px;display:block;color:#fff}
.arty input[type=range]{flex:1;min-width:110px;accent-color:var(--poppy)}
.tog{background:#3a3020;color:#e8d7a6;height:38px;padding:0 12px;border-radius:6px;font-weight:600;font-size:14px;letter-spacing:1px;text-transform:uppercase;border:2px solid transparent}
.tog.on{background:var(--poppy);color:#fff;border-color:#ffb3bd;animation:pulse 1s infinite}
.tog.creep.on{background:#c77d12;border-color:#ffd38a}
@keyframes pulse{50%{box-shadow:0 0 14px rgba(255,80,80,.8)}}
.presets{display:flex;gap:4px}
.presets button{background:#2a2216;border:1px solid #5a4a2c;color:#cbb886;font-size:11px;padding:4px 6px;border-radius:4px;text-transform:uppercase}
.heroBtn{position:relative;overflow:hidden;width:120px;border-radius:6px;background:#2a2216;color:#e8d7a6;border:2px solid #5a4a2c;font-size:12px;text-transform:uppercase;letter-spacing:1px;padding:4px}
.heroBtn .fill{position:absolute;left:0;bottom:0;width:100%;background:linear-gradient(#e0b030,#9c7414);opacity:.35;transition:height .3s}
.heroBtn span{position:relative;display:block;line-height:1.15}
.heroBtn b{display:block;font-size:14px;color:#fff}
.heroBtn.ready{border-color:var(--gold);animation:glow 1s infinite}
.heroBtn.ready .fill{opacity:.85}
.heroBtn.ready span,.heroBtn.ready b{color:#241d12}
@keyframes glow{50%{box-shadow:0 0 18px rgba(224,176,48,.9)}}
.side{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;gap:8px}
.qcard{background:var(--paper);color:var(--ink);border-radius:6px;padding:12px;box-shadow:inset 0 0 40px rgba(120,90,40,.3);position:relative}
.qhead{display:flex;justify-content:space-between;align-items:center;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:#6a5630;margin-bottom:6px}
.streak{font-weight:700;color:var(--poppy);font-size:14px}
.qtext{font-size:21px;font-weight:600;line-height:1.15;min-height:52px;margin-bottom:8px}
.qtext small{display:block;font-size:12px;letter-spacing:1px;color:#7a6438;font-weight:500;text-transform:uppercase;margin-bottom:2px}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{background:#fffaf0;color:var(--ink);text-align:left;padding:9px 10px;border-radius:5px;border:2px solid #c9b78a;font-size:15px;line-height:1.2;font-family:Oswald;transition:background .1s}
.opt:hover:not(:disabled){border-color:var(--olive);background:#f4f0d8}
.opt kbd{display:inline-block;width:20px;height:20px;line-height:18px;text-align:center;border-radius:3px;background:var(--ink);color:var(--paper);font-size:12px;margin-right:8px;font-family:Oswald}
.opt.right{background:#c9e6b3;border-color:#4e8a2a}
.opt.wrong{background:#f3c0c0;border-color:#b02020}
.opt:disabled{cursor:default}
.qfb{height:20px;margin-top:6px;font-size:14px;font-weight:600;text-align:center}
.lock{position:absolute;inset:0;background:rgba(36,29,18,.0);pointer-events:none}
.shop{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.sbtn{display:flex;align-items:center;gap:7px;background:linear-gradient(#3a3020,#2a2216);color:#efe0b4;border:2px solid #5a4a2c;border-radius:6px;padding:6px;text-align:left;font-size:13px;line-height:1.1}
.sbtn svg{width:30px;height:30px;flex:none}
.sbtn b{display:block;font-size:14px}
.sbtn .c{color:var(--gold);font-weight:700}
.sbtn:disabled{opacity:.4;cursor:not-allowed}
.sbtn.sel{border-color:var(--gold);background:#5a4a20}
.sbtn.flash{animation:fl .4s}
@keyframes fl{50%{background:#7a6a20}}
.overlay{position:fixed;inset:0;background:rgba(10,8,5,.82);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.overlay.on{display:flex}
.modal{max-width:520px;width:100%;padding:24px;text-align:center}
.modal h3{font-size:30px;text-transform:uppercase;margin-bottom:10px}
.modal .btns{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
@media(max-width:980px){
 .bgrid{grid-template-columns:1fr}
 .hud{grid-column:1;order:0}
 .fieldwrap{order:1}
 .side{display:contents}
 .qcard{order:2}
 .cmd{order:3}
 .shop{order:4}
 .cmd{grid-template-columns:1fr 1fr}
 .cmd .artyP{grid-column:1/3}
}
@media(max-width:520px){
 .qtext{font-size:18px}
 .cmd{grid-template-columns:1fr}
 .cmd .artyP{grid-column:1}
 .hud .bname{display:none}
}
/* ---------- RESULT ---------- */
.result{max-width:880px;margin:10px auto;padding:26px 30px}
.result h3{font-size:56px;text-align:center;letter-spacing:4px;line-height:1}
.result .rsub{text-align:center;font-family:'Special Elite';font-size:18px;margin:6px 0 10px}
.bigstars{text-align:center;font-size:52px;letter-spacing:8px;color:#b08a1a}
.bigstars i{font-style:normal;color:#cbbd96}
.rgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0}
@media(max-width:600px){.rgrid{grid-template-columns:repeat(2,1fr)}}
.rstat{background:rgba(36,29,18,.08);border-radius:4px;padding:10px;text-align:center}
.rstat b{display:block;font-size:28px}
.rstat small{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:#6a5630}
.histnote{font-family:'Special Elite';font-size:16px;line-height:1.5;background:rgba(75,83,32,.12);border-left:6px solid var(--olive);padding:12px 14px;margin:12px 0}
.review{margin:12px 0}
.review h4{text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.review li{list-style:none;padding:6px 0;border-bottom:1px dashed #b9a675;font-size:15px}
.review li b{color:#8f0b1d}
.honor{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
.honor input{font-family:Oswald;font-size:18px;padding:6px 10px;border:2px solid var(--ink);border-radius:4px;width:150px;text-transform:uppercase;background:#fffaf0}
.board{width:100%;border-collapse:collapse;margin-top:6px;font-size:15px}
.board td{padding:4px 6px;border-bottom:1px solid #cdbd92}
.board tr.me td{background:#f7e3a0;font-weight:700}
/* ---------- MANUAL ---------- */
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tabs button{background:#3a3020;color:#e8d7a6;padding:8px 16px;border-radius:5px;text-transform:uppercase;letter-spacing:1px}
.tabs button.on{background:var(--paper);color:var(--ink)}
.manualBody{padding:20px 24px}
.manualBody h4{font-size:20px;text-transform:uppercase;letter-spacing:1px;margin:14px 0 6px;border-bottom:2px solid var(--ink)}
.term{display:grid;grid-template-columns:200px 1fr 60px;gap:10px;padding:5px 0;border-bottom:1px dashed #c4b183;font-size:15px}
.term b{font-size:16px}
.term .m{color:#b08a1a;text-align:right}
@media(max-width:600px){.term{grid-template-columns:1fr 50px}.term span{grid-column:1/3;grid-row:2}}
.hcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.hcard{background:rgba(36,29,18,.07);border-radius:4px;padding:12px;border:2px solid #c4b183}
.hcard.locked{opacity:.5}
.hcard h5{font-size:18px;text-transform:uppercase}
.hcard .ht{font-family:'Special Elite';font-size:13px;color:#6a5630;margin-bottom:6px}
.hcard p{font-family:'Special Elite';font-size:14px;line-height:1.45}
.howto{font-family:'Special Elite';font-size:16px;line-height:1.55}
.howto li{margin:6px 0 6px 20px}
</style>
</head>
<body>

<!-- =============== TITLE =============== -->
<section id="scr-title" class="screen active">
  <canvas id="titleCanvas"></canvas>
  <div class="titleBox">
    <h1>OVER<br>THE <span>TOP</span></h1>
    <div class="sub">A Great War Trench Strategy Game &middot; 1914&ndash;1918</div>
    <button class="bigbtn" id="btnPlay">Enlist</button>
    <div class="titleRow">
      <button class="ghost" data-go="manual" data-tab="howto">How to Play</button>
      <button class="ghost" data-go="manual" data-tab="terms">Field Manual</button>
      <button class="ghost" data-go="manual" data-tab="heroes">Hall of Heroes</button>
    </div>
    <div class="rankTag" id="rankTag"></div>
  </div>
</section>

<!-- =============== CAMPAIGN MAP =============== -->
<section id="scr-map" class="screen paperBg">
  <div class="wrap">
    <div class="topbar">
      <h2>The Campaign</h2>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="ghost" data-go="manual" data-tab="terms">Field Manual</button>
        <button class="ghost" data-go="manual" data-tab="heroes">Heroes</button>
        <button class="ghost" data-go="title">Menu</button>
      </div>
    </div>
    <div class="mapGrid">
      <div class="paper" style="padding:10px"><div id="mapHolder"></div></div>
      <div class="paper" style="padding:14px">
        <div style="font-size:14px;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px;color:#5a4a2c">Choose your battle</div>
        <div class="blist" id="blist"></div>
        <label class="teacher"><input type="checkbox" id="teacherChk"> Teacher mode: unlock every battle</label>
      </div>
    </div>
  </div>
</section>

<!-- =============== BRIEFING =============== -->
<section id="scr-brief" class="screen paperBg">
  <div class="wrap"><div class="paper brief" id="briefBox"></div></div>
</section>

<!-- =============== BATTLE =============== -->
<section id="scr-battle" class="screen">
  <div class="bgrid">
    <div class="hud">
      <div class="bname" id="hudName"></div>
      <div class="tug">
        <span class="lab" style="color:#8fb3e6">Your line</span>
        <div class="bar"><div id="barP" style="width:100%"></div><span id="barPt">100</span></div>
        <div class="bar"><div id="barE" style="width:100%"></div><span id="barEt">100</span></div>
        <span class="lab" style="color:#b9bca8">Enemy line</span>
      </div>
      <div class="timer" id="hudTime">4:00</div>
      <div class="supply" title="Supply: earn it by answering questions"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="1.5" fill="#8a6a2a" stroke="#e0b030" stroke-width="1.5"/><path d="M3 11h18M12 7v13" stroke="#e0b030" stroke-width="1.5"/><path d="M8 7l4-4 4 4" fill="none" stroke="#e0b030" stroke-width="1.5"/></svg><span id="hudSupply">0</span></div>
      <button class="hbtn" id="btnMute" title="Sound">🔊</button>
      <button class="hbtn" id="btnPause" title="Pause">❚❚</button>
    </div>

    <div class="fieldwrap">
      <canvas id="field" width="1000" height="520"></canvas>
      <div id="coach"></div>
      <div id="banner"></div>
    </div>

    <div class="cmd">
      <div class="panel">
        <h5>Sector</h5>
        <div class="sectors" id="sectors"></div>
      </div>
      <div class="panel">
        <h5>Infantry</h5>
        <div class="otop">
          <div class="reserve"><b id="resN">0</b>squads</div>
          <button class="whistle" id="btnTop">Over the Top!</button>
          <button class="small" id="btnAll" title="Send every squad in reserve">All</button>
        </div>
      </div>
      <div class="panel artyP">

function getNoise(){const a=ac();if(!a)return null;if(!noiseBuf){noiseBuf=a.createBuffer(1,a.sampleRate*1.5,a.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}return noiseBuf}
function noise(dur,freq,vol,type='lowpass'){if(muted)return;const a=ac();if(!a)return;const b=getNoise();const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type=type;f.frequency.value=freq;const g=a.createGain();const t=a.currentTime;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(f);f.connect(g);g.connect(a.destination);s.start(t,Math.random()*.5);s.stop(t+dur+.05)}
function tone(fr,dur,vol=.15,type='sine',to){if(muted)return;const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain(),t=a.currentTime;o.type=type;o.frequency.setValueAtTime(fr,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.02)}
const sfx={
 boom(near){const n=performance.now();if(n-lastBoom<70)return;lastBoom=n;noise(near?.9:.6,near?500:300,near?.55:.3);tone(70,.4,near?.3:.15,'sine',35)},
 mg(){const n=performance.now();if(n-lastMg<110)return;lastMg=n;noise(.035,2400,.06,'bandpass')},
 whistle(){if(muted)return;const a=ac();if(!a)return;const o=a.createOscillator(),l=a.createOscillator(),lg=a.createGain(),g=a.createGain(),t=a.currentTime;o.frequency.value=2300;l.frequency.value=32;lg.gain.value=90;l.connect(lg);lg.connect(o.frequency);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.12,t+.03);g.gain.setValueAtTime(.12,t+.7);g.gain.exponentialRampToValueAtTime(.001,t+.9);o.connect(g);g.connect(a.destination);o.start(t);l.start(t);o.stop(t+.95);l.stop(t+.95)},
 good(){tone(660,.12,.14,'triangle');setTimeout(()=>tone(990,.2,.14,'triangle'),90)},
 streak(){[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.15,.12,'triangle'),i*70))},
 bad(){tone(160,.3,.14,'sawtooth',90)},
 buy(){tone(420,.06,.1,'square');setTimeout(()=>tone(640,.06,.08,'square'),50)},
 hero(){[392,523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.25,.12,'square'),i*90))},
 incoming(){tone(1400,.9,.035,'sine',500)},
 alarm(){[0,1,2].forEach(i=>setTimeout(()=>tone(880,.12,.1,'square'),i*160))}
};

 c.fillStyle='rgba(255,190,120,.15)';c.beginPath();c.arc(w*.72,h*.66,h*.2,0,7);c.fill();
 // flares
 for(let i=0;i<3;i++){const fx=w*(.2+i*.3),fy=h*(.25+.05*Math.sin(t*.7+i));const a=.5+.5*Math.sin(t*2+i*2);c.fillStyle=`rgba(255,245,200,${.4*a})`;c.beginPath();c.arc(fx,fy,6*devicePixelRatio,0,7);c.fill()}

 c.fillStyle='#2b1d14';c.beginPath();c.moveTo(0,h*.7);for(let x=0;x<=w;x+=w/40)c.lineTo(x,h*.7-Math.sin(x/w*9)*h*.02-Math.sin(x/w*23)*h*.01);c.lineTo(w,h);c.lineTo(0,h);c.fill();
 // stumps
 c.strokeStyle='#1a120c';c.lineWidth=5*devicePixelRatio;[.15,.38,.61,.88].forEach((x,i)=>{c.beginPath();c.moveTo(w*x,h*.72);c.lineTo(w*x+5,h*(.55-i%2*.05));c.lineTo(w*x+20,h*.5);c.stroke()});

 // wire
 c.strokeStyle='rgba(20,14,10,.9)';c.lineWidth=1.5*devicePixelRatio;for(let k=0;k<2;k++){c.beginPath();for(let x=0;x<w;x+=6)c.lineTo(x,h*(.745+k*.02)+Math.sin(x*.08+k)*6);c.stroke()}

 // climbers silhouettes
 const S=devicePixelRatio;
 climbers.forEach(cl=>{const ph=((t*.25+cl.d/4)%1);const x=w*cl.x+ph*w*.05,y=h*.79-Math.min(ph*3,1)*h*.04;const s=cl.s*S*1.4;c.save();c.translate(x,y);c.scale(s,s);c.fillStyle='#0d0805';
  c.beginPath();c.ellipse(0,-30,9,3,0,0,7);c.fill();c.beginPath();c.arc(0,-27,4.5,0,7);c.fill();c.fillRect(-5,-24,10,15);
  const k=Math.sin(t*8+cl.d)*5;c.lineWidth=3.5;c.strokeStyle='#0d0805';c.beginPath();c.moveTo(-2,-9);c.lineTo(-4-k,2);c.moveTo(2,-9);c.lineTo(4+k,2);c.stroke();
  c.lineWidth=2;c.beginPath();c.moveTo(-6,-20);c.lineTo(18,-34);c.stroke();c.restore()});
 // poppies
 poppies.forEach(p=>{const x=p.x*w+Math.sin(t+p.p)*3,y=p.y*h;c.strokeStyle='#1e2a12';c.lineWidth=1.5*S;c.beginPath();c.moveTo(x,y);c.lineTo(x+Math.sin(t+p.p)*2,y+p.s*3*S);c.stroke();c.fillStyle='#c8102e';for(let i=0;i<4;i++){c.beginPath();c.ellipse(x+Math.cos(i*1.57)*p.s*.5*S,y+Math.sin(i*1.57)*p.s*.5*S,p.s*.65*S,p.s*.5*S,i*1.57,0,7);c.fill()}c.fillStyle='#120a0a';c.beginPath();c.arc(x,y,p.s*.28*S,0,7);c.fill()});
 c.restore();
}

function genGround(){
 const b=G.b,o=b.ground;ground=document.createElement('canvas');ground.width=W*2;ground.height=H*2;gx=ground.getContext('2d');gx.scale(2,2);
 gx.fillStyle=o.base;gx.fillRect(0,0,W,H);
 for(let k=0;k<5000;k++){const v=Math.random();gx.fillStyle=v<.5?`rgba(0,0,0,${rand(.03,.12)})`:`rgba(255,240,200,${rand(.02,.07)})`;gx.fillRect(rand(0,W),rand(0,H),rand(1,4),rand(1,3))}
 if(o.green>0){for(let k=0;k<180*o.green;k++){const x=rand(0,W),y=rand(0,H);const gr=gx.createRadialGradient(x,y,0,x,y,rand(15,45));gr.addColorStop(0,`rgba(90,120,50,${.35*o.green})`);gr.addColorStop(1,'rgba(90,120,50,0)');gx.fillStyle=gr;gx.fillRect(x-50,y-50,100,100)}}
 if(o.winter){for(let k=0;k<60;k++){const x=rand(0,W),y=rand(0,H);const gr=gx.createRadialGradient(x,y,0,x,y,rand(10,40));gr.addColorStop(0,'rgba(230,230,235,.25)');gr.addColorStop(1,'rgba(230,230,235,0)');gx.fillStyle=gr;gx.fillRect(x-45,y-45,90,90)}}
 for(let k=0;k<o.craters;k++)crater(rand(150,850),rand(10,H-10),rand(8,22),true);
 // stumps / trees
 const ntree=o.forest?26:8;for(let k=0;k<ntree;k++){const x=rand(160,840),y=rand(15,H-15);gx.fillStyle='rgba(0,0,0,.25)';gx.beginPath();gx.ellipse(x+6,y+3,8,3,0,0,7);gx.fill();gx.strokeStyle='#2b1f14';gx.lineWidth=o.forest?4:3;gx.beginPath();gx.moveTo(x,y);gx.lineTo(x+rand(-3,3),y-rand(10,22));gx.stroke();if(o.forest&&Math.random()<.6){gx.fillStyle='rgba(40,55,25,.8)';gx.beginPath();gx.arc(x,y-22,rand(8,13),0,7);gx.fill()}}
 // lane separators (faint)
 drawTrench(MGX[0],1);drawTrench(MGX[1],-1);
 // rear area
 [[0,52],[948,52]].forEach(([x,w])=>{gx.fillStyle='rgba(0,0,0,.18)';gx.fillRect(x,0,w,H)});
}
function crater(x,y,r,init){
 const g=gx;const gr=g.createRadialGradient(x,y,r*.1,x,y,r);gr.addColorStop(0,'rgba(25,18,10,.75)');gr.addColorStop(.7,'rgba(45,33,20,.55)');gr.addColorStop(.85,'rgba(150,125,85,.35)');gr.addColorStop(1,'rgba(150,125,85,0)');
 g.fillStyle=gr;g.beginPath();g.ellipse(x,y,r*1.15,r*.85,rand(0,3),0,7);g.fill();
 if((G.b.ground.winter||Math.random()<.3)&&r>12){g.fillStyle='rgba(90,110,120,.35)';g.beginPath();g.ellipse(x,y,r*.4,r*.28,0,0,7);g.fill()}
}
function drawTrench(x0,dir){
 const g=gx;const path=[];for(let y=-10;y<=H+20;y+=28){const k=Math.floor(y/28)%2;path.push([x0+(k?8*dir:-6*dir),y]);path.push([x0+(k?8*dir:-6*dir),y+18])}
 const stroke=(w,c)=>{g.strokeStyle=c;g.lineWidth=w;g.lineJoin='miter';g.beginPath();path.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));g.stroke()};
 stroke(30,'rgba(0,0,0,.35)');stroke(24,'#2a1f13');stroke(15,'#3d2d1c');
 // duckboards
 g.strokeStyle='rgba(150,120,80,.5)';g.lineWidth=1;for(let i=0;i<path.length-1;i++){const[a,b]=path[i],[c,d]=path[i+1];const n=Math.hypot(c-a,d-b)/5;for(let k=0;k<n;k++){const t=k/n,x=a+(c-a)*t,y=b+(d-b)*t;g.beginPath();g.moveTo(x-4,y);g.lineTo(x+4,y);g.stroke()}}
 // sandbag parapet (enemy-facing side)
 for(let i=0;i<path.length-1;i++){const[a,b]=path[i],[c,d]=path[i+1];const n=Math.max(1,Math.hypot(c-a,d-b)/7);for(let k=0;k<n;k++){const t=k/n,x=a+(c-a)*t+15*dir,y=b+(d-b)*t;g.fillStyle=Math.random()<.5?'#a8946a':'#9a8660';g.strokeStyle='#5c4b30';g.lineWidth=.8;g.beginPath();g.ellipse(x,y,4.5,3.2,0,0,7);g.fill();g.stroke()}}
 // communication trenches to rear
 for(let l=0;l<LANES;l+=2){const y=laneY(l);g.strokeStyle='#2a1f13';g.lineWidth=7;g.beginPath();g.moveTo(x0,y);g.lineTo(x0-40*dir,y+12);g.lineTo(x0-80*dir,y+4);g.stroke()}
}

function tryPlace(kind,x,lane){

 else{let best=null,bd=1e9;SLOTS[0].forEach(sx=>{const d=Math.abs(sx-x);if(d<bd){bd=d;best=sx}});
  if(bd>60){flashCoach('Place wire and mines in YOUR half of no-man’s-land.');return}
  if(G.wires.some(w=>w.side===0&&w.lane===lane&&w.x===best&&w.hp>0)||G.mines.some(m=>m.side===0&&m.lane===lane&&m.x===best)){flashCoach('That spot is taken.');return}
  if(!spend(COST[kind]))return;
  if(kind==='wire')G.wires.push({side:0,lane,x:best,hp:100});else G.mines.push({side:0,lane,x:best});
  puff(best,laneY(lane),'#b0a080');
 }
 sfx.buy();setSector(lane);
 if(!e_shift)G.build=null;renderShop();
}

/* ---------------- QUESTIONS ---------------- */
function mastery(id){return save.mastery[id]||0}
function buildDeck(){
 const cur=G.b.items.slice();
 const prev=ALL_ITEMS.filter(it=>it.b<G.i).sort((a,b)=>mastery(a.id)-mastery(b.id)+rand(-1,1));
 const rev=prev.slice(0,Math.min(8,prev.length));
 G.deck=shuffle(cur.concat(rev));G.reviewIds=new Set(rev.map(r=>r.id));
}
function nextQuestion(){
 if(!G.deck.length)buildDeck();
 let it=G.deck.shift();if(G.qi&&it.id===G.qi.item.id&&G.deck.length){G.deck.push(it);it=G.deck.shift()}
 G.qi=makeQ(it);G.qStart=G.t;renderQ();
}
function makeQ(it){
 if(it.q)return{item:it,prompt:it.q,label:G.reviewIds&&G.reviewIds.has(it.id)?'Review':'',answer:it.a,opts:shuffle([it.a,...it.w])};
 const reverse=Math.random()<.35;
 const same=ALL_ITEMS.filter(o=>!o.q&&o.c===it.c&&o!==it);
 const near=shuffle(same.filter(o=>o.b===it.b)),far=shuffle(same.filter(o=>o.b!==it.b));
 const pool=near.concat(far).slice(0,3);
 const lbl=G.reviewIds&&G.reviewIds.has(it.id)?'Review':'';
 if(reverse)return{item:it,prompt:it.d,label:(lbl?lbl+' · ':'')+(it.c==='figure'?'Who?':'Which term?'),answer:it.t,opts:shuffle([it.t,...pool.map(o=>o.t)])};
 return{item:it,prompt:it.t+'?',label:lbl,answer:it.d,opts:shuffle([it.d,...pool.map(o=>o.d)])};
}
function renderQ(){
 const q=G.qi;$('#qtext').innerHTML=(q.label?`<small>${q.label}</small>`:'')+q.prompt;
 const o=$('#opts');o.innerHTML='';
 q.opts.forEach((t,i)=>{const b=document.createElement('button');b.className='opt';b.innerHTML=`<kbd>${i+1}</kbd>${t}`;b.onclick=()=>answer(t,b);o.appendChild(b)});
 $('#qfb').textContent='';
 const s=G.streak;$('#streak').textContent=s>=2?`🔥 ${s} streak`:'';
}
function answer(t,btn){
 if(!G||G.over||G.lock>0)return;ac();
 const q=G.qi,ok=t===q.answer;const btns=$$('#opts .opt');btns.forEach(b=>b.disabled=true);
 const id=q.item.id;
 if(ok){
  G.streak++;G.stats.correct++;G.stats.bestStreak=Math.max(G.stats.bestStreak,G.streak);
  const fast=(G.t-G.qStart)<5;const gain=25+Math.min(G.streak-1,5)*5+(fast?10:0);
  G.supply+=gain;G.score+=50+Math.min(G.streak,10)*10;G.hero=Math.min(100,G.hero+25);
  btn.classList.add('right');$('#qfb').innerHTML=`<span style="color:#3d6e1e">+${gain} supply${fast?' · quick!':''}${G.streak>=3?' · streak ×'+G.streak:''}</span>`;
  save.mastery[id]=Math.min(5,mastery(id)+1);
  if(G.streak%5===0){sfx.streak();floatText(500,60,`${G.streak} IN A ROW!`,'#e0b030',22)}else sfx.good();
  setTimeout(()=>{if(G&&!G.over)nextQuestion()},420);
  coachEvent('correct');
 }else{
  G.streak=0;G.stats.wrong++;G.hero=Math.max(0,G.hero-15);G.stats.missed[id]=q.item;
  btn.classList.add('wrong');btns.forEach(b=>{if(b.textContent.slice(1)===q.answer)b.classList.add('right')});
  $('#qfb').innerHTML='<span style="color:#9b1b1b">Study the right answer…</span>';
  save.mastery[id]=Math.max(0,mastery(id)-1);
  sfx.bad();G.lock=2.4;
  // spaced re-try: put it back a few cards later
  G.deck.splice(Math.min(3,G.deck.length),0,q.item);
  setTimeout(()=>{if(G&&!G.over)nextQuestion()},2400);
 }
 persist();updHUD();
}

function useHero(){
 if(!G||G.over||G.hero<100)return;ac();G.hero=0;sfx.hero();
 const k=G.b.hero.ability.key,l=G.sector;banner(G.b.hero.ability.name.toUpperCase()+'!',1.6);
 if(k==='taxis'){G.squads+=3;for(let i=0;i<3;i++)setTimeout(()=>puff(rand(20,60),laneY(Math.floor(rand(0,5))),'#d0c090'),i*150)}
 else if(k==='hold')G.buffs.mg=12;
 else if(k==='simpson'){G.squads+=2;G.mg[0].forEach(m=>{if(m)m.hp=100})}
 else if(k==='sacred'){G.supply+=150;G.shells+=15;G.mg[0].forEach(m=>{if(m)m.hp=100})}

 // MGs

  let tgt=null,bd=1e9;for(const t of G.troops){if(t.side===side||t.lane!==m.lane||t.hp<=0||t.delay>0)continue;const d=Math.abs(t.x-m.x);if(d<540&&d<bd){bd=d;tgt=t}}

  if(hit){if(tgt.tank){tgt.hp-=.06;if(Math.random()<.2)G.parts.push({k:'spark',x:tgt.x,y:tgt.y-8,t:0,life:.15})}else{tgt.hp-=1;if(tgt.hp<=0)tgt.killedBy='mg'}}

 }));
 // troops

function laneThreat(l){ // how well player defends lane l (higher = stronger)
 const m=G.mg[0][l];return (m?m.hp/100*3:0)+G.wires.filter(w=>w.side===0&&w.lane===l).length*.8+G.mines.filter(x=>x.side===0&&x.lane===l).length*.6;
}
function aiTick(){
 const A=G.ai,E=G.E;const ramp=1+G.t/300;
 A.supply+=E.income*ramp*(G.t<15?.4:1);
 const empty=[0,1,2,3,4].filter(l=>!G.mg[1][l]);const mgCount=5-empty.length;
 if(empty.length&&mgCount<E.maxMG&&A.supply>=90&&Math.random()<.55){const l=pick(empty);addMG(1,l);A.supply-=90;puff(MGX[1],laneY(l),'#aaa')}
 if(G.batt[1]<E.maxBatt&&A.supply>=120&&Math.random()<.12&&G.t>30){G.batt[1]++;A.supply-=120}
 const ew=G.wires.filter(w=>w.side===1).length;
 if(ew<E.maxWire&&A.supply>=30&&Math.random()<.2){const free=SLOTS[1].flatMap(x=>[0,1,2,3,4].map(l=>({x,l}))).filter(s=>!G.wires.some(w=>w.side===1&&w.x===s.x&&w.lane===s.l)&&!G.mines.some(m=>m.side===1&&m.x===s.x&&m.lane===s.l));if(free.length){const s=pick(free);G.wires.push({side:1,lane:s.l,x:s.x,hp:100});A.supply-=30}}
 const em=G.mines.filter(m=>m.side===1).length;
 if(em<E.mines&&A.supply>=25&&Math.random()<.1){const free=SLOTS[1].flatMap(x=>[0,1,2,3,4].map(l=>({x,l}))).filter(s=>!G.wires.some(w=>w.side===1&&w.x===s.x&&w.lane===s.l)&&!G.mines.some(m=>m.side===1&&m.x===s.x&&m.lane===s.l));if(free.length){const s=pick(free);G.mines.push({side:1,lane:s.l,x:s.x});A.supply-=25}}
 if(A.supply>=40&&A.squads<E.squads+2&&Math.random()<.45){A.squads++;A.supply-=40}
 // gas
 if(E.gas&&G.b.gas){A.gasT-=1;if(A.gasT<=0){A.gasT=E.gas*rand(.8,1.2);const ls=shuffle([0,1,2,3,4]).slice(0,2);ls.forEach(l=>{for(let k=0;k<4;k++)G.gas.push({lane:l,x:880+k*24,y:laneY(l)+rand(-25,25),r:rand(28,40),t:0,ph:Math.random()*6})});banner('GAS! GAS! GAS!',1.6);sfx.alarm();if(!G.masks)flashCoach('Poison gas is drifting toward your trench! Gas masks keep your machine gunners fighting.',4)}}
 // attack planning
 A.next-=1;
 if(!A.attack&&A.next<=0&&A.squads>=Math.min(E.squads,2)){
  const scores=[0,1,2,3,4].map(l=>({l,s:laneThreat(l)+rand(0,1.6)})).sort((a,b)=>a.s-b.s);
  const l=scores[0].l;A.attack={lane:l,phase:'bomb',t:G.batt[1]>0?rand(5,7):1,lift:rand(260,360)};
  banner(`Enemy shelling Sector ${l+1}!`,1.6);
 }
 // harassment fire on player wire when idle

function aiUpdate(dt){

 if(A.attack){
  const at=A.attack;at.t-=dt;

   if(at.t<=0){at.phase='go';at.t=40;const n=Math.min(A.squads,E.squads+Math.floor(G.t/120));A.squads-=n;for(let s=0;s<n;s++)for(let i=0;i<6;i++)spawnSoldier(1,at.lane,-s*26-rand(0,14));banner(`Enemy raid! Sector ${at.lane+1}`,1.5);sfx.whistle();sfx.alarm()}}

 }
 if(tgt){const n=G.batt[1];for(let i=0;i<n;i++){A.cd[i]-=dt;if(A.cd[i]<=0){A.cd[i]=A.attack?rand(2.6,3.3):rand(3.6,4.6);spawnShell(1,tgt.x+rand(-30,30),laneY(tgt.lane)+rand(-LH*.42,LH*.42));G.batFlash1=.15}}}

  <h4>Knowledge is power</h4><ul><li>Answer the questions on the right to earn <b>supply</b>. You get <b>no supply any other way</b>.</li><li>Streaks and quick answers earn bonus supply. A wrong answer locks you out for a moment and breaks your streak &mdash; read the correct answer!</li><li>Questions you miss come back again soon. Earlier battles' terms come back for review.</li><li>Correct answers also charge your <b>Hero power</b>. Four correct answers fill it.</li></ul>
  <h4>Defend your trench</h4><ul><li><b>Machine guns</b> guard one sector each. Tap the shop button, then a sector of your trench.</li><li><b>Barbed wire</b> stops attackers while they cut through it &mdash; right in front of your guns.</li><li><b>Landmines</b> are hidden and explode when enemy soldiers step on them.</li><li>Enemy shells can damage your wire and suppress your guns, so keep rebuilding.</li></ul>
  <h4>Attack: sync your artillery and infantry</h4><ul><li>Tap the battlefield to aim your guns. Press <b>FIRE</b>. Shells that land near a machine gun <b>suppress</b> it for a few seconds.</li><li>Pick a <b>sector</b>, then press <b>OVER THE TOP</b> to send a squad. A suppressed gun can't shoot your men.</li><li><b>CREEP</b> makes the barrage walk forward at infantry pace, like the creeping barrage at Vimy Ridge.</li><li>Your shells hurt <i>everyone</i> they land on. <b>Lift fire</b> before your men reach the target!</li><li>Tanks (from the Somme on) ignore bullets and crush wire, but they're slow.</li></ul>
  <h4>Keyboard</h4><p>1&ndash;4 answer &middot; Space: over the top &middot; F: fire &middot; C: creep &middot; H: hero power &middot; &uarr;&darr;: sector &middot; Esc: pause &middot; hold Shift to place many wires or mines</p>
  <h4>Saving</h4><p>Progress, stars, and the Honor Roll save in this browser on this device.</p></div>`}
 else if(tab==='terms'){$('#manTitle').textContent='Field Manual';body.innerHTML=BATTLES.map(b=>`<h4>${b.idx+1}. ${b.name} <small style="font-size:13px;font-family:Special Elite;text-transform:none">${b.year}</small></h4>`+b.items.map(it=>{const m=mastery(it.id);return `<div class="term"><b>${it.t||it.q}</b><span>${it.t?it.d:it.a}</span><div class="m" title="Mastery">${'●'.repeat(m)}${'○'.repeat(5-m)}</div></div>`}).join('')).join('')}
 else{$('#manTitle').textContent='Hall of Heroes';const cards=[];BATTLES.forEach(b=>{const un=save.heroes.includes(b.id);cards.push({un,name:b.hero.name,title:b.hero.title+' · '+b.short,story:b.hero.story,how:'Win '+b.short});EXTRA_HEROES.filter(e=>e.b===b.idx).forEach(e=>cards.push({un,name:e.name,title:e.title,story:e.story,how:'Win '+b.short}))});
  body.innerHTML=`<p class="type" style="margin-bottom:12px">Win battles to unlock the true stories of Allied heroes of the Great War.</p><div class="hcards">${cards.map(c=>`<div class="hcard ${c.un?'':'locked'}"><h5>${c.un?c.name:'??????'}</h5><div class="ht">${c.un?c.title:'Locked &mdash; '+c.how}</div><p>${c.un?c.story:'Fight on to discover this story.'}</p></div>`).join('')}</div>`}
}

startTitle();
