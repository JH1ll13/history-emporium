<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Kaiju Rampage</title>
<link rel="stylesheet" href="/assets/fonts.css">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0b0f1a;color:#fff;font-family:'Nunito',sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.ov{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,rgba(60,20,20,.9),rgba(8,6,12,.96));padding:12px;box-sizing:border-box;overflow:auto}
.hidden{display:none!important}
.box{text-align:center;width:100%;max-width:600px}
h1{font-family:'Bangers',cursive;font-weight:400;font-size:clamp(54px,15vw,110px);margin:0;line-height:.9;letter-spacing:3px;color:#7dff4f;text-shadow:0 5px 0 #1f6b0f,0 10px 0 #0a2a04,0 0 40px #7dff4f88;transform:rotate(-3deg)}
h2{font-family:'Bangers';font-weight:400;font-size:34px;letter-spacing:2px;margin:4px 0 10px;color:#ffd23f}
.btn{font-family:'Bangers',cursive;font-size:28px;letter-spacing:2px;color:#fff;border:none;border-radius:14px;padding:10px 30px;margin:6px;cursor:pointer;background:linear-gradient(#ff6a3a,#c0260a);box-shadow:0 6px 0 #6a1004;text-shadow:0 2px 0 #6a1004}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #6a1004}
.btn.g{background:linear-gradient(#8dff6a,#2fae2a);box-shadow:0 6px 0 #1a6b16;text-shadow:0 2px 0 #1a6b16}
.btn.b{background:linear-gradient(#6ab8ff,#2e6fe0);box-shadow:0 6px 0 #1a3f8a;text-shadow:0 2px 0 #1a3f8a}
.stat{display:inline-block;background:rgba(0,0,0,.4);border-radius:12px;padding:6px 14px;margin:4px;font-family:'Bangers';letter-spacing:1px;font-size:22px}
.small{font-size:13px;opacity:.85;margin-top:12px;line-height:1.6}
.city{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.07);border:3px solid #444;border-radius:14px;padding:10px 12px;margin:8px 0;cursor:pointer;text-align:left}
.city.sel{border-color:#ffd23f;box-shadow:0 0 16px #ffd23f88}
.city.lock{opacity:.4;cursor:default}
.city .sw{width:56px;height:56px;border-radius:10px;flex:0 0 56px}
.city b{font-family:'Bangers';font-weight:400;font-size:24px;letter-spacing:1px}
.row{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.07);border-radius:12px;padding:8px 10px;margin:6px 0;text-align:left}
.row .ic{font-size:28px}.row .tx{flex:1;font-size:14px}.row .tx b{font-family:'Bangers';font-weight:400;font-size:20px;letter-spacing:1px}
.row button{font-family:'Bangers';font-size:18px;letter-spacing:1px;border:none;border-radius:10px;padding:8px 10px;min-width:86px;color:#fff;background:linear-gradient(#ffd35a,#e07a10);cursor:pointer}
.row button.off{filter:grayscale(1) brightness(.6)}
.pips{color:#7dff4f;letter-spacing:2px}
.cb{position:fixed;z-index:3;border-radius:50%;border:4px solid rgba(255,255,255,.5);background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font-family:'Bangers';letter-spacing:1px;color:#fff;font-size:18px}
.cb.on{background:rgba(255,255,255,.35)}
#bStomp{right:16px;bottom:calc(24px + env(safe-area-inset-bottom));width:96px;height:96px;border-color:rgba(255,120,60,.8);background:rgba(255,120,60,.2)}
#bBreath{right:124px;bottom:calc(40px + env(safe-area-inset-bottom));width:84px;height:84px;border-color:rgba(95,247,255,.8);background:rgba(95,247,255,.2)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="cb hidden" id="bBreath">BREATH</div><div class="cb hidden" id="bStomp">STOMP</div>
<div class="ov" id="home"><div class="box">
  <h1>KAIJU<br>RAMPAGE</h1>
  <div style="margin:16px 0 6px"><span class="stat">🧬 <span id="hDna">0</span> DNA</span><span class="stat">⭐ <span id="hStars">0</span></span></div>
  <div id="cities"></div>
  <button class="btn" id="goB">🦖 RAMPAGE!</button><br>
  <button class="btn g" id="upgB">🧬 EVOLVE</button>
  <div class="small" id="hHelp"></div>
</div></div>
<div class="ov hidden" id="upg"><div class="box">
  <h2>EVOLVE YOUR MONSTER</h2>
  <div class="stat">🧬 <span id="uDna">0</span> DNA</div>
  <div id="upList"></div>
  <h2 style="font-size:26px;margin-top:14px">MONSTER SKINS</h2>
  <div id="skinList"></div>
  <button class="btn b" id="upBack">◀ BACK</button>
</div></div>
<div class="ov hidden" id="res" style="background:radial-gradient(circle at 50% 30%,rgba(60,20,20,.75),rgba(8,6,12,.9))"><div class="box">
  <h1 id="rT" style="font-size:clamp(44px,12vw,84px)">RAMPAGE OVER</h1>
  <div id="rStars" style="font-size:52px;letter-spacing:8px;color:#ffd23f;margin:8px 0;filter:drop-shadow(0 0 10px #ffd23f)"></div>
  <div id="rS" class="small" style="font-size:17px"></div>
  <button class="btn" id="rAgain">↻ AGAIN</button><button class="btn g" id="rHome">🧬 EVOLVE & CITIES</button>
</div></div>
<script>
(()=>{
if(!CanvasRenderingContext2D.prototype.roundRect)CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){r=Math.min(r,Math.abs(w)/2,Math.abs(h)/2);this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath()};
const cv=document.getElementById('c'),ctx=cv.getContext('2d');const $=id=>document.getElementById(id);
const isTouch=('ontouchstart' in window)||navigator.maxTouchPoints>0;
$('hHelp').innerHTML=isTouch?'Drag on the left to stomp around · STOMP smashes · hold BREATH for atomic breath<br>Eat cars, tanks and people to GROW. Bigger monsters crush bigger buildings!':'WASD / arrows to move · SPACE to stomp · hold SHIFT or E for atomic breath<br>Eat cars, tanks and people to GROW. Bigger monsters crush bigger buildings!';
const MAP=2400,BLOCK=240,ROAD=64,ROUND=150;
const CITIES=[
 {n:'Neon Bay',d:'A glittering city at night.',need:0,ground:'#1a1f2e',road:'#2a2f3e',line:'#ffd23f',walls:['#2a3a6a','#3a2a6a','#2a5a6a','#5a2a5a','#33405a'],roof:['#4a5a9a','#5a4a9a','#3a7a8a','#8a4a8a','#55607a'],win:'#ffe98a',night:1,alert:0,grass:'#16261a'},
 {n:'Sunset Desert',d:'Hot sun. Faster tanks.',need:3,ground:'#c9a26a',road:'#8a7050',line:'#fff2c0',walls:['#d8b080','#c89060','#e0c090','#b87850','#d0a070'],roof:['#f0d0a0','#e0b080','#f8e0b0','#d09070','#e8c090'],win:'#5a7aa0',night:0,alert:1,grass:'#a8884a'},
 {n:'Frost City',d:'Frozen streets. Jets everywhere!',need:7,ground:'#dfe8f2',road:'#9aa8ba',line:'#ffffff',walls:['#8aa0c0','#a0b0d0','#7090b0','#b0c0d8','#90a8c8'],roof:['#ffffff','#f0f6ff','#e8f0fa','#ffffff','#eef4ff'],win:'#ffe98a',night:0,alert:2,grass:'#cfdbe8'}
];
const SKINS=[{n:'Green Lizard',body:'#4caf50',dark:'#1f6b24',belly:'#c8e6a0',spike:'#7dff4f',breath:'#5ff7ff',cost:0},{n:'Lava Beast',body:'#a8301a',dark:'#4a0e04',belly:'#ff9a3c',spike:'#ffd23f',breath:'#ff8a1a',cost:150},{n:'Ice Titan',body:'#7fc8f0',dark:'#2a6a9a',belly:'#e8f8ff',spike:'#ffffff',breath:'#c8f4ff',cost:300},{n:'Robo-Kaiju',body:'#8a909c',dark:'#3a3f4a',belly:'#c0c6d0',spike:'#ff3b5c',breath:'#ff3b5c',cost:600}];
const UPS=[{k:'pow',ic:'💪',n:'Monster Muscle',d:'+15% stomp and breath damage',max:5},{k:'hide',ic:'🛡️',n:'Thick Hide',d:'+20% max health',max:5},{k:'breath',ic:'🔥',n:'Atomic Lungs',d:'Breath recharges 20% faster',max:5},{k:'spd',ic:'💨',n:'Long Legs',d:'+8% walking speed',max:3},{k:'grow',ic:'🧬',n:'Mega Growth',d:'+20% growth from everything',max:3}];
const upCost=lv=>Math.round(40*Math.pow(lv+1,1.6));
let sv={dna:0,stars:[0,0,0],up:{pow:0,hide:0,breath:0,spd:0,grow:0},skins:[0],skin:0,city:0,best:[0,0,0]};
try{const d=JSON.parse(localStorage.getItem('kaiju_v1')||'null');if(d){sv=Object.assign(sv,d);sv.up=Object.assign({pow:0,hide:0,breath:0,spd:0,grow:0},d.up||{})}}catch(e){}
function persist(){try{localStorage.setItem('kaiju_v1',JSON.stringify(sv))}catch(e){}}
const totalStars=()=>sv.stars.reduce((a,b)=>a+b,0);
let AC=null;function snd(f,d=0.1,type='square',v=0.05,f2,noise){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const n=AC.currentTime,g=AC.createGain();g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(0.0008,n+d);
 if(noise){const len=Math.floor(AC.sampleRate*d),b=AC.createBuffer(1,len,AC.sampleRate),dd=b.getChannelData(0);for(let i=0;i<len;i++)dd[i]=(Math.random()*2-1)*(1-i/len);const s=AC.createBufferSource();s.buffer=b;const fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.value=f;s.connect(fl).connect(g).connect(AC.destination);s.start(n);return}
 const o=AC.createOscillator();o.type=type;o.frequency.setValueAtTime(f,n);if(f2)o.frequency.exponentialRampToValueAtTime(f2,n+d);o.connect(g).connect(AC.destination);o.start(n);o.stop(n+d+0.03)}catch(e){}}
let breathNode=null;function breathSound(on){try{if(on&&!breathNode&&AC){const len=AC.sampleRate*2,b=AC.createBuffer(1,len,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;const s=AC.createBufferSource();s.buffer=b;s.loop=true;const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=700;const g=AC.createGain();g.gain.value=0.05;s.connect(f).connect(g).connect(AC.destination);s.start();breathNode={s,g}}if(!on&&breathNode){breathNode.s.stop();breathNode=null}}catch(e){}}
function roar(){snd(90,0.9,'sawtooth',0.1,45);snd(140,0.7,'sawtooth',0.06,70);snd(600,0.6,'square',0.04,0,true)}

// ================== STATE ==================
let W,H,DPR,zoom=1,camX=0,camY=0,state='home',city=CITIES[0],skin=SKINS[0];
let destroyedBld=0,M=null,blds=[],units=[],shots=[],parts=[],texts=[],debris=[],strikes=[],timeLeft=ROUND,totalVal=0,destroyedVal=0,alert=0,spawnT=0,shake=0,time=0,endT=0,banner=null,bossSpawned=false,traffic=[];
function layout(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR}
addEventListener('resize',layout);
const TIERS=[null,{h:28,hp:30,val:0.4,w:[34,50]},{h:48,hp:80,val:1.2,w:[44,70]},{h:90,hp:240,val:4,w:[50,80]},{h:150,hp:650,val:12,w:[60,90]},{h:250,hp:1700,val:35,w:[70,100]}];
function genCity(){
 blds=[];totalVal=0;let sd=Math.floor(Math.random()*1e6);const r=()=>{sd=(sd*9301+49297)%233280;return sd/233280};
 const N=MAP/BLOCK;
 for(let by=0;by<N;by++)for(let bx=0;bx<N;bx++){
  const x0=bx*BLOCK+ROAD/2,y0=by*BLOCK+ROAD/2,s=BLOCK-ROAD;
  const dc=Math.hypot(bx-N/2+0.5,by-N/2+0.5)/(N/2);
  if(dc<0.2&&bx===N/2&&by===N/2){continue}
  if(r()<0.08){blds.push({park:1,x:x0,y:y0,w:s,d:s});continue}
  // subdivide
  const cells=r()<0.35?[[0,0,1,1]]:r()<0.6?[[0,0,0.5,1],[0.5,0,0.5,1]]:[[0,0,0.5,0.5],[0.5,0,0.5,0.5],[0,0.5,0.5,0.5],[0.5,0.5,0.5,0.5]];
  for(const [cx,cy,cw,ch] of cells){let tier;const q=r()+(1-dc)*0.6;tier=q>1.35?5:q>1.1?4:q>0.85?3:q>0.55?2:1;if(cells.length===4)tier=Math.min(tier,3);
   const T=TIERS[tier];const w=Math.min(s*cw-10,T.w[0]+r()*(T.w[1]-T.w[0])),d=Math.min(s*ch-10,T.w[0]+r()*(T.w[1]-T.w[0]));
   const x=x0+cx*s+(s*cw-w)/2,y=y0+cy*s+(s*ch-d)/2;const h=T.h*(0.85+r()*0.3);const ci=Math.floor(r()*5);
   const b={x,y,w,d,h,tier,hp:T.hp,maxHp:T.hp,val:T.val*(0.8+r()*0.4),wall:city.walls[ci],roof:city.roof[ci],col:0,dead:false,seed:r()*1000,wins:[]};
   for(let i=0;i<20;i++)b.wins.push(r()<0.6);blds.push(b);totalVal+=b.val}}
 traffic=[];for(let i=0;i<40;i++)traffic.push(newCar());
}
function newCar(){const N=MAP/BLOCK;const horiz=Math.random()<0.5;const line=Math.floor(Math.random()*(N+1))*BLOCK;const pos=Math.random()*MAP;const dir=Math.random()<0.5?1:-1;return{kind:'car',x:horiz?pos:line+(dir>0?-14:14),y:horiz?line+(dir>0?14:-14):pos,vx:horiz?dir*90:0,vy:horiz?0:dir*90,col:['#ff4a4a','#4a8cff','#ffd23f','#ffffff','#5aff8a'][Math.floor(Math.random()*5)],hp:8,tier:1,r:8,xp:4}}
function lvlR(L){return 40*(1+0.27*(L-1))}
const xpNeed=L=>Math.round(50*Math.pow(1.75,L-1));
function startRound(){
 city=CITIES[sv.city];skin=SKINS[sv.skin];genCity();
 const hpMax=260*(1+0.2*sv.up.hide);
 M={x:MAP/2,y:MAP/2,L:1,r:lvlR(1),xp:0,hp:hpMax,maxHp:hpMax,en:100,face:0,walk:0,stompCd:0,breathing:false,hurt:0,vx:0,vy:0,stompAnim:0};
 units=[];shots=[];parts=[];texts=[];debris=[];strikes=[];timeLeft=ROUND;destroyedVal=0;destroyedBld=0;alert=city.alert*0;spawnT=2;endT=0;bossSpawned=false;
 camX=M.x;camY=M.y;zoom=targetZoom();state='play';show(null);if(isTouch){$('bStomp').classList.remove('hidden');$('bBreath').classList.remove('hidden')}
 banner={t:city.n.toUpperCase(),s:'Smash it all in '+ROUND+' seconds!',life:0};roar();
}
function targetZoom(){return Math.min(W,H)/(620+M.L*150)}
const pct=()=>totalVal?Math.min(1,destroyedBld/totalVal):0;
const STARS=[0.25,0.5,0.8];

// ================== INPUT ==================
const keys={};let joy=null,tStomp=false,tBreath=false;
addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space'){stomp();e.preventDefault()}if(e.code==='Enter'&&state==='home')startRound()});
addEventListener('keyup',e=>{keys[e.code]=false});addEventListener('blur',()=>{for(const k in keys)keys[k]=false;joy=null;tBreath=false});
cv.addEventListener('pointerdown',e=>{if(state!=='play')return;joy={id:e.pointerId,sx:e.clientX,sy:e.clientY,x:e.clientX,y:e.clientY};cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(joy&&e.pointerId===joy.id){joy.x=e.clientX;joy.y=e.clientY;const dx=joy.x-joy.sx,dy=joy.y-joy.sy,d=Math.hypot(dx,dy);if(d>55){joy.sx=joy.x-dx/d*55;joy.sy=joy.y-dy/d*55}}});
const endJ=e=>{if(joy&&e.pointerId===joy.id)joy=null};cv.addEventListener('pointerup',endJ);cv.addEventListener('pointercancel',endJ);
$('bStomp').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();$('bStomp').classList.add('on');stomp()});$('bStomp').addEventListener('pointerup',()=>$('bStomp').classList.remove('on'));
const bb=$('bBreath');bb.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();tBreath=true;bb.classList.add('on');bb.setPointerCapture(e.pointerId)});const bOff=()=>{tBreath=false;bb.classList.remove('on')};bb.addEventListener('pointerup',bOff);bb.addEventListener('pointercancel',bOff);bb.addEventListener('lostpointercapture',bOff);

// ================== COMBAT ==================
const dmgMul=()=>(1+0.35*(M.L-1))*(1+0.15*sv.up.pow);
const bMul=b=>Math.max(0.15,Math.min(3,1+(M.L-b.tier)*0.5));
function rectHit(b,x,y,r){const cx=Math.max(b.x,Math.min(x,b.x+b.w)),cy=Math.max(b.y,Math.min(y,b.y+b.d));return Math.hypot(x-cx,y-cy)<r}
function hurtB(b,d){if(b.dead||b.park)return;b.hp-=d*bMul(b);b.flash=0.08;if(b.hp<=0)collapse(b)}
function collapse(b){b.dead=true;b.col=1;destroyedVal+=b.val;destroyedBld+=b.val;gainXp(b.tier*b.tier*3);
 const cx=b.x+b.w/2,cy=b.y+b.d/2;for(let i=0;i<10+b.tier*8;i++){const a=Math.random()*6.283,v=40+Math.random()*120*b.tier/2;debris.push({x:cx+(Math.random()-0.5)*b.w,y:cy+(Math.random()-0.5)*b.d,z:Math.random()*b.h,vx:Math.cos(a)*v,vy:Math.sin(a)*v,vz:60+Math.random()*120,col:Math.random()<0.5?b.wall:b.roof,s:3+Math.random()*4*b.tier/2,life:0})}
 for(let i=0;i<6+b.tier*3;i++)parts.push({x:cx+(Math.random()-0.5)*b.w,y:cy+(Math.random()-0.5)*b.d,vx:(Math.random()-0.5)*40,vy:(Math.random()-0.5)*40,life:0,max:1.4+Math.random(),col:'rgba(150,140,130,.55)',r:12+b.tier*6,smoke:1});
 texts.push({x:cx,y:cy-b.h*0.6,t:'+$'+(b.val).toFixed(1)+'M',col:'#7dff4f',life:0,size:14+b.tier*3});
 // civilians flee
 for(let i=0;i<b.tier;i++)units.push({kind:'person',x:cx+(Math.random()-0.5)*b.w,y:cy+b.d/2+5,vx:0,vy:0,hp:1,tier:1,r:4,xp:2,col:['#ffd0a8','#c88a5a','#8a5a3a'][i%3],t:Math.random()*5});
 shake=Math.max(shake,3+b.tier*2);snd(80+Math.random()*40,0.3+b.tier*0.1,'square',0.05+b.tier*0.01,0,true);
 if(alert<5&&pct()>[0.03,0.1,0.2,0.32,0.45][alert]){alert++;banner={t:'⚠ ALERT LEVEL '+alert+' ⚠',s:['Police are coming!','Tanks deployed!','Helicopters incoming!','Fighter jets launched!','MEGA DEFENDER activated!'][alert-1],life:0,red:1};snd(600,0.4,'square',0.05,300)}
}
function gainXp(x){M.xp+=x*(1+0.2*sv.up.grow);while(M.L<8&&M.xp>=xpNeed(M.L)){M.xp-=xpNeed(M.L);M.L++;M.r=lvlR(M.L);const nm=M.maxHp*1.15;M.hp=Math.min(nm,M.hp+nm*0.35);M.maxHp=nm;banner={t:'SIZE UP! LEVEL '+M.L,s:M.L<=6?`Now crush ${['','houses','shops','apartments','towers','skyscrapers'][M.L-1]} just by walking!`:'UNSTOPPABLE!',life:0,green:1};roar();shake=12;for(let i=0;i<40;i++){const a=Math.random()*6.283;parts.push({x:M.x,y:M.y,vx:Math.cos(a)*200,vy:Math.sin(a)*200,life:0,max:0.7,col:skin.spike,r:5})}}}
function stomp(){if(state!=='play'||!M||M.stompCd>0)return;M.stompCd=0.55;M.stompAnim=1;const R=M.r*1.9,d=26*dmgMul();
 for(const b of blds)if(!b.dead&&!b.park&&rectHit(b,M.x,M.y,R))hurtB(b,d);
 for(const u of units){if(u.fly||u.dead)continue;if(Math.hypot(u.x-M.x,u.y-M.y)<R+u.r)hurtU(u,d)}
 for(const c of traffic)if(Math.hypot(c.x-M.x,c.y-M.y)<R){c.dead=1;gainXp(2);destroyedVal+=0.05;burst(c.x,c.y,c.col,6)}
 parts.push({x:M.x,y:M.y,vx:0,vy:0,life:0,max:0.35,col:'rgba(255,240,200,.9)',ring:R});for(let i=0;i<16;i++){const a=Math.random()*6.283;parts.push({x:M.x+Math.cos(a)*M.r,y:M.y+Math.sin(a)*M.r,vx:Math.cos(a)*160,vy:Math.sin(a)*160,life:0,max:0.5,col:'rgba(170,150,120,.6)',r:10,smoke:1})}
 shake=Math.max(shake,6);snd(60,0.3,'square',0.08,30);snd(300,0.2,'square',0.05,0,true)}
function hurtU(u,d){u.hp-=d;u.flash=0.1;if(u.hp<=0&&!u.dead){u.dead=true;gainXp(u.xp);destroyedVal+=u.val||0.1;burst(u.x,u.y,u.kind==='boss'?'#ffd23f':'#ff9a3c',u.kind==='boss'?60:14);if(u.kind!=='person')snd(120,0.25,'square',0.05,0,true);
