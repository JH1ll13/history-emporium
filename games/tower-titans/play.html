<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Tower Titans</title>
<link rel="stylesheet" href="/assets/fonts.css">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#1d3a1a;color:#fff;font-family:'Nunito',sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#top{position:fixed;top:0;left:0;right:0;display:flex;gap:6px;align-items:center;padding:8px;z-index:2;flex-wrap:nowrap}
.chip{background:rgba(20,12,4,.7);border:2px solid rgba(255,220,140,.35);border-radius:12px;padding:5px 10px;font-family:'Bangers',cursive;font-size:20px;letter-spacing:1px;white-space:nowrap}
.tbtn{cursor:pointer;font-family:'Bangers',cursive;font-size:20px;letter-spacing:1px;border:none;border-radius:12px;padding:6px 12px;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.35)}
#spd{background:linear-gradient(#7fb6ff,#3b6fd8)}
#go{background:linear-gradient(#8dff6a,#2fae2a);margin-left:auto;animation:pulse 1s ease-in-out infinite alternate}
#go.off{animation:none;filter:grayscale(.8) brightness(.7)}
@keyframes pulse{to{transform:scale(1.06)}}
@media(max-width:560px){.chip{font-size:15px;padding:4px 7px}.tbtn{font-size:15px;padding:5px 8px}#top{gap:4px;padding:6px}.wl{display:none}}
#bar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:6px;justify-content:center;padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:2;background:linear-gradient(transparent,rgba(0,0,0,.45))}
.card{flex:1;max-width:120px;background:linear-gradient(#5a3a1c,#3a2410);border:3px solid #c99a4a;border-radius:14px;padding:5px 4px;text-align:center;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.4);position:relative}
.card canvas{position:static;width:48px;height:48px;display:block;margin:0 auto}
.card b{display:block;font-family:'Bangers',cursive;font-weight:400;font-size:16px;letter-spacing:1px}
.card span{font-size:12px;color:#ffd23f;font-weight:900}
.card.sel{border-color:#fff;box-shadow:0 0 16px #fff,0 4px 0 rgba(0,0,0,.4);transform:translateY(-4px)}
.card.off{filter:grayscale(.85) brightness(.7)}
#info{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom));z-index:3;background:linear-gradient(#4a2e14,#2a1808);border:3px solid #c99a4a;border-radius:16px;padding:10px 14px;width:min(92vw,340px);box-shadow:0 8px 30px rgba(0,0,0,.5)}
#info h3{margin:0;font-family:'Bangers',cursive;font-weight:400;font-size:24px;letter-spacing:1px}
#info .row{display:flex;gap:8px;margin-top:8px}
#info button{flex:1;font-family:'Bangers',cursive;font-size:17px;letter-spacing:1px;border:none;border-radius:10px;padding:8px;color:#fff;cursor:pointer}
#evB{background:linear-gradient(#ffd35a,#e07a10)}#sellB{background:linear-gradient(#ff7a7a,#c0263a)}#closeI{background:#666;flex:0 0 40px}
.xp{height:10px;background:#0006;border-radius:6px;overflow:hidden;margin:6px 0 2px}.xp i{display:block;height:100%;background:linear-gradient(90deg,#7ff7ff,#b46bff)}
#info small{font-size:12px;opacity:.85}
.ov{position:fixed;inset:0;z-index:5;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;overscroll-behavior:contain;background:radial-gradient(circle,rgba(30,50,20,.85),rgba(5,10,3,.95));padding:14px;box-sizing:border-box;text-align:center}
.ov>div{margin:auto 0}
.hidden{display:none!important}
h1{font-family:'Bangers',cursive;font-weight:400;font-size:clamp(46px,13vw,96px);margin:0;letter-spacing:3px;line-height:.95;color:#ffd23f;text-shadow:0 5px 0 #b3400f,0 10px 0 #4a1206,0 0 30px #ff8a3c88;transform:rotate(-3deg)}
.sub{font-size:15px;margin:14px 0 20px;opacity:.9}
.btn{font-family:'Bangers',cursive;font-size:26px;letter-spacing:2px;color:#fff;border:none;border-radius:16px;padding:12px 30px;margin:6px;cursor:pointer;background:linear-gradient(#8dff6a,#2fae2a);box-shadow:0 6px 0 #1a6b16}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #1a6b16}
.small{font-size:12px;opacity:.75;margin-top:14px;line-height:1.7}
#homeB{background:linear-gradient(#c9a0ff,#7a4ad8)}
.lvgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;width:min(900px,94vw);margin:14px auto 8px}
.lv{background:linear-gradient(#5a3a1c,#3a2410);border:3px solid #c99a4a;border-radius:14px;overflow:hidden;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.4);position:relative;text-align:left;transition:transform .12s}
.lv:hover{transform:translateY(-3px)}
.lv canvas{position:static;width:100%;height:auto;aspect-ratio:16/9;display:block;border-bottom:3px solid #c99a4a}
.lv b{display:block;font-family:'Bangers',cursive;font-weight:400;font-size:20px;letter-spacing:1px;padding:4px 9px 0}
.lv span{display:block;font-size:12px;color:#ffd23f;font-weight:900;padding:0 9px 7px}
.lv .n{position:absolute;top:6px;left:6px;width:30px;height:30px;border-radius:50%;background:#ffd23f;color:#5a2a00;font-family:'Bangers',cursive;font-size:20px;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 #a06a00}
.lv.locked{cursor:default;filter:grayscale(.9) brightness(.55)}.lv.locked:hover{transform:none}
.lv .lk{position:absolute;inset:0 0 auto 0;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;font-size:40px}
@media(max-width:600px){.lvgrid{grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.lv b{font-size:16px;padding:3px 7px 0}.lv span{font-size:10.5px;padding:0 7px 6px}.lv .n{width:24px;height:24px;font-size:16px;top:4px;left:4px}.lv .lk{font-size:28px}}
.btn.alt{background:linear-gradient(#7fb6ff,#3b6fd8);box-shadow:0 6px 0 #1f3f8a}.btn.gry{background:linear-gradient(#aaa,#666);box-shadow:0 6px 0 #333}.btn.sm{font-size:19px;padding:9px 18px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="top" class="hidden">
  <div class="chip">❤️ <span id="lives">20</span></div>
  <div class="chip">🪙 <span id="gold">0</span></div>
  <div class="chip"><span class="wl">WAVE </span>🌊<span id="wave">0</span>/25</div>
  <button class="tbtn" id="homeB">☰</button>
  <button class="tbtn" id="spd">1x</button>
  <button class="tbtn" id="go">▶ START</button>
</div>
<div id="bar" class="hidden"></div>
<div id="info" class="hidden">
  <h3 id="iName">Ember Pup</h3>
  <small id="iStats"></small>
  <div class="xp"><i id="iXp"></i></div>
  <small id="iXpT"></small>
  <div class="row"><button id="evB">EVOLVE</button><button id="sellB">SELL</button><button id="closeI">✕</button></div>
</div>
<div class="ov" id="title"><div>
  <h1>TOWER<br>TITANS</h1>
  <div class="sub">Place creatures. They level up as they fight and <b>EVOLVE</b> into Titans.<br>Survive 25 waves and the Gigaclops King on all 8 levels!</div>
  <button class="btn" id="playB">▶ PLAY</button>
  <div class="small" id="tBest"></div>
</div></div>
<div class="ov hidden" id="levels"><div>
  <h1 style="font-size:clamp(40px,9vw,70px)">PICK A LEVEL</h1>
  <div class="lvgrid" id="lvGrid"></div>
  <button class="btn gry sm" id="lvBack">◀ BACK</button>
</div></div>
<div class="ov hidden" id="endO"><div>
  <h1 id="eT">VICTORY!</h1>
  <div class="sub" id="eS"></div>
  <button class="btn" id="nextB">NEXT LEVEL ▶</button>
  <div><button class="btn alt sm" id="againB">↻ PLAY AGAIN</button><button class="btn gry sm" id="lvlB">LEVELS</button></div>
</div></div>
<script>
(()=>{
const cv=document.getElementById('c'),ctx=cv.getContext('2d');const $=id=>document.getElementById(id);
const LEVELS=[
 {n:'Green Meadow',path:[[-1,1.5],[3.5,1.5],[3.5,6.5],[7.5,6.5],[7.5,2.5],[11.5,2.5],[11.5,6.5],[14.5,6.5],[14.5,3.5],[17,3.5]]},
 {n:'Twisty Trail',path:[[-1,4.5],[2.5,4.5],[2.5,1.5],[6.5,1.5],[6.5,7.5],[10,7.5],[10,1.5],[13.5,1.5],[13.5,5.5],[17,5.5]]},
 {n:'The Long Loop',path:[[-1,6.5],[3,6.5],[3,2],[6.5,2],[6.5,7],[9.5,7],[9.5,4],[13,4],[13,8],[17,8]]},
 {n:'Zigzag Hills',path:[[-1,1.5],[2.5,7.5],[6,1.5],[9.5,7.5],[13,1.5],[17,7.5]]},
 {n:'Snake Valley',path:[[-1,7.5],[3,7.5],[3,1.5],[7,1.5],[7,7.5],[11,7.5],[11,1.5],[15,1.5],[15,4.5],[17,4.5]]},
 {n:'Spiral Woods',path:[[-1,1.5],[13.5,1.5],[13.5,7.5],[2.5,7.5],[2.5,4.5],[9.5,4.5]]},
 {n:'Mountain Pass',path:[[-1,4.5],[3,4.5],[3,1],[8,1],[8,8],[12.5,8],[12.5,1.5],[15,1.5],[15,4.5],[17,4.5]]},
 {n:'Gigaclops Gauntlet',path:[[-1,6.5],[4,6.5],[4,2],[8,2],[8,5],[11,5],[11,2],[15,2],[15,7],[17,7]]}
];
let LI=0,PORTAL=[0.3,1.5],CRYS=[15.6,3.5];
const TYPES={
 ember:{n:['Ember Pup','Blaze Hound','Inferno Titan'],cost:50,dmg:[5,12,30],rate:[1.5,1.8,2.2],range:[2.4,2.7,3.1],c:['#ff7a2a','#ff3b1a','#ffcc33'],d:'Fast fire bolts. Evolved forms burn.'},
 frost:{n:['Frost Sprite','Glacier Fox','Blizzard Titan'],cost:70,dmg:[2,5,12],rate:[1.0,1.2,1.4],range:[2.2,2.5,2.9],slow:[0.35,0.5,0.65],c:['#7fe8ff','#3fb6ff','#e8fbff'],d:'Ice shards slow enemies down.'},
 rock:{n:['Pebble Golem','Boulder Brute','Mountain Titan'],cost:90,dmg:[10,26,70],rate:[0.55,0.62,0.7],range:[2.6,2.9,3.4],splash:[0.9,1.15,1.5],c:['#b08a5a','#8a6a44','#d6c2a0'],d:'Hurls boulders that smash groups.'},
 spark:{n:['Spark Bug','Volt Beetle','Storm Titan'],cost:110,dmg:[6,14,34],rate:[0.9,1.0,1.2],range:[2.5,2.8,3.2],chain:[2,4,7],c:['#ffe94a','#ffd000','#fff9c0'],d:'Lightning chains between enemies.'}
};
const ORDER=['ember','frost','rock','spark'];
const ETYPES={gloop:{hp:18,spd:1.1,b:4,r:0.28,c:'#6be05a',d:'#2a7a1f'},zip:{hp:11,spd:2.0,b:4,r:0.22,c:'#ffe14a',d:'#a68a00'},brick:{hp:60,spd:0.65,armor:3,b:8,r:0.36,c:'#8aa0c8',d:'#3a4a6a'},boss:{hp:380,spd:0.45,armor:4,b:60,r:0.55,c:'#b46bff',d:'#4a1a8a'}};
let sv={best:0,wins:0,cleared:0,lv:{}};try{const d=JSON.parse(localStorage.getItem('towertitans_v1')||'null');if(d)sv=Object.assign(sv,d)}catch(e){}
if(!sv.lv)sv.lv={};if(sv.wins>0&&!sv.cleared)sv.cleared=1;if(sv.best&&!sv.lv[0])sv.lv[0]={best:sv.best,stars:0};
function persist(){try{localStorage.setItem('towertitans_v1',JSON.stringify(sv))}catch(e){}}
let AC=null;function snd(f,d=0.1,type='square',v=0.05,f2,noise){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const n=AC.currentTime,g=AC.createGain();g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(0.0008,n+d);
 if(noise){const len=Math.floor(AC.sampleRate*d),b=AC.createBuffer(1,len,AC.sampleRate),dd=b.getChannelData(0);for(let i=0;i<len;i++)dd[i]=(Math.random()*2-1)*(1-i/len);const s=AC.createBufferSource();s.buffer=b;const fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.value=f;s.connect(fl).connect(g).connect(AC.destination);s.start(n);return}
 const o=AC.createOscillator();o.type=type;o.frequency.setValueAtTime(f,n);if(f2)o.frequency.exponentialRampToValueAtTime(f2,n+d);o.connect(g).connect(AC.destination);o.start(n);o.stop(n+d+0.03)}catch(e){}}

let W,H,DPR,T=40,OX=0,OY=0,COLS=16,ROWS=9,portrait=false,PATH=[],segs=[],plen=0,deco=[],bgCv=null;
let state='title',gold=0,lives=20,wave=0,towers=[],enemies=[],projs=[],parts=[],texts=[],bolts=[],spawnQ=[],spawnT=0,waveActive=false,speed=1,sel=null,selTower=null,hover=null,time=0,shake=0;
function layout(){
 DPR=Math.min(2,devicePixelRatio||1);W=Math.max(1,innerWidth);H=Math.max(1,innerHeight);cv.width=Math.max(1,Math.round(W*DPR));cv.height=Math.max(1,Math.round(H*DPR));
 portrait=H>W*1.1;COLS=portrait?9:16;ROWS=portrait?16:9;
 PATH=LEVELS[LI].path.map(([x,y])=>portrait?[y,x]:[x,y]);
 segs=[];plen=0;for(let i=1;i<PATH.length;i++){const [x1,y1]=PATH[i-1],[x2,y2]=PATH[i],l=Math.hypot(x2-x1,y2-y1);segs.push({x1,y1,x2,y2,l,s:plen});plen+=l}
 const topH=52,botH=92;T=Math.max(4,Math.min(W/COLS,(H-topH-botH)/ROWS));OX=(W-T*COLS)/2;OY=topH+(H-topH-botH-T*ROWS)/2;
 const inm=(x,y)=>x>0.3&&y>0.3&&x<COLS-0.3&&y<ROWS-0.3;PORTAL=PATH[0];CRYS=PATH[PATH.length-1];for(let s=0;s<plen;s+=0.05){const q=posAt(s);if(inm(q[0],q[1])){PORTAL=q;break}}for(let s=plen;s>0;s-=0.05){const q=posAt(s);if(inm(q[0],q[1])){CRYS=q;break}}
 // keep towers in place if orientation changed: re-map
 makeDeco();renderBg();
}
addEventListener('resize',()=>{const was=portrait;layout();if(was!==portrait){for(const t of towers){[t.x,t.y]=[t.y,t.x]}}});
function posAt(s){if(s<=0)return[PATH[0][0],PATH[0][1]];for(const g of segs){if(s<=g.s+g.l){const k=(s-g.s)/g.l;return[g.x1+(g.x2-g.x1)*k,g.y1+(g.y2-g.y1)*k]}}const e=PATH[PATH.length-1];return[e[0],e[1]]}
function distToPath(x,y){let m=1e9;for(const g of segs){const dx=g.x2-g.x1,dy=g.y2-g.y1,l2=dx*dx+dy*dy;let k=((x-g.x1)*dx+(y-g.y1)*dy)/l2;k=Math.max(0,Math.min(1,k));m=Math.min(m,Math.hypot(x-g.x1-dx*k,y-g.y1-dy*k))}return m}
function makeDeco(){let sd=7+LI*97;const r=()=>{sd=(sd*9301+49297)%233280;return sd/233280};deco=[];for(let i=0;i<70;i++){const x=r()*COLS,y=r()*ROWS;if(distToPath(x,y)<0.9)continue;deco.push({x,y,k:r()<0.45?'tree':r()<0.6?'rock':'flower',s:0.6+r()*0.6,c:r()})}deco.sort((a,b)=>a.y-b.y)}
function renderBg(){
 bgCv=document.createElement('canvas');bgCv.width=Math.max(1,Math.ceil(COLS*T*DPR));bgCv.height=Math.max(1,Math.ceil(ROWS*T*DPR));const g=bgCv.getContext('2d');g.scale(DPR*T,DPR*T);
 for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){g.fillStyle=(x+y)%2?'#4f9a3a':'#57a440';g.fillRect(x,y,1,1)}
 let sd=3+LI*53;const r=()=>{sd=(sd*9301+49297)%233280;return sd/233280};
 for(let i=0;i<400;i++){g.fillStyle=r()<0.5?'rgba(30,80,20,.35)':'rgba(140,210,90,.35)';g.fillRect(r()*COLS,r()*ROWS,0.04,0.12)}
 g.lineCap='round';g.lineJoin='round';
 g.strokeStyle='rgba(0,0,0,.25)';g.lineWidth=1.08;g.beginPath();PATH.forEach(([x,y],i)=>i?g.lineTo(x,y+0.06):g.moveTo(x,y+0.06));g.stroke();
 g.strokeStyle='#8a6a3a';g.lineWidth=1.0;g.beginPath();PATH.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));g.stroke();
 g.strokeStyle='#d8b878';g.lineWidth=0.84;g.stroke();
 g.strokeStyle='#e6c98e';g.lineWidth=0.5;g.stroke();
 for(let i=0;i<260;i++){const s=r()*plen;const [x,y]=posAt(s);g.fillStyle=r()<0.5?'rgba(120,90,50,.35)':'rgba(255,240,200,.3)';g.beginPath();g.arc(x+(r()-0.5)*0.7,y+(r()-0.5)*0.7,0.03+r()*0.04,0,6.283);g.fill()}
 for(const d of deco){const s=d.s;if(d.k==='tree'){g.fillStyle='rgba(0,0,0,.25)';g.beginPath();g.ellipse(d.x,d.y+0.18*s,0.32*s,0.12*s,0,0,6.283);g.fill();g.fillStyle='#6b4423';g.fillRect(d.x-0.05*s,d.y-0.05*s,0.1*s,0.25*s);for(const [ox,oy,rr,c] of[[0,-0.25,0.3,'#2f7a2a'],[-0.14,-0.12,0.22,'#3a8f30'],[0.14,-0.12,0.22,'#3a8f30'],[0,-0.32,0.18,'#55b04a']]){g.fillStyle=c;g.beginPath();g.arc(d.x+ox*s,d.y+oy*s,rr*s,0,6.283);g.fill()}}
  else if(d.k==='rock'){g.fillStyle='#7a7a88';g.beginPath();g.ellipse(d.x,d.y,0.2*s,0.14*s,0,0,6.283);g.fill();g.fillStyle='#a0a0b0';g.beginPath();g.ellipse(d.x-0.04*s,d.y-0.04*s,0.1*s,0.06*s,0,0,6.283);g.fill()}
  else{for(let k=0;k<3;k++){g.fillStyle=['#ff7ad9','#ffe14a','#ffffff'][Math.floor(d.c*3)];g.beginPath();g.arc(d.x+(k-1)*0.1*s,d.y+(k%2)*0.06*s,0.045*s,0,6.283);g.fill()}}}
}

// ---------- creature drawing ----------
function drawCreature(g,type,st,x,y,R,t,ang=0,opt={}){
 const ty=TYPES[type],c=ty.c[st],bob=Math.sin(t*4+x*3)*R*0.05;
 g.save();g.translate(x,y+bob);
 if(!opt.noBase){g.fillStyle='rgba(0,0,0,.3)';g.beginPath();g.ellipse(0,R*0.75-bob,R*0.95,R*0.32,0,0,6.283);g.fill();
  g.fillStyle='#8f8f9f';g.beginPath();g.ellipse(0,R*0.62-bob,R*0.95,R*0.32,0,0,6.283);g.fill();g.strokeStyle=['#c9c9d6','#7ff7ff','#ffd23f'][st];g.lineWidth=R*0.08;g.stroke()}
 if(st===2){g.save();g.globalCompositeOperation='lighter';const a=g.createRadialGradient(0,-R*0.1,R*0.2,0,-R*0.1,R*1.5);a.addColorStop(0,c+'66');a.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=a;g.beginPath();g.arc(0,-R*0.1,R*1.5,0,6.283);g.fill();g.restore()}
 const s=[0.78,0.92,1.05][st];g.scale(s,s);
 // element extras behind
 if(type==='ember'){for(let i=0;i<3+st;i++){const a=-Math.PI/2+(i-(2+st)/2)*0.45;const fl=Math.sin(t*14+i)*R*0.06;g.fillStyle=['#ff3b1a','#ff9a1a','#ffe14a'][i%3];g.beginPath();g.moveTo(Math.cos(a-0.2)*R*0.6,Math.sin(a-0.2)*R*0.6-R*0.1);g.quadraticCurveTo(Math.cos(a)*R*(1.2+st*0.15)+fl,Math.sin(a)*R*(1.2+st*0.15),Math.cos(a+0.2)*R*0.6,Math.sin(a+0.2)*R*0.6-R*0.1);g.fill()}}
 if(type==='spark'){g.save();g.globalAlpha=0.55;g.fillStyle='#e8fbff';const fl=Math.sin(t*40)*0.25;for(const sg of[-1,1]){g.save();g.rotate(sg*(0.5+fl));g.beginPath();g.ellipse(sg*R*0.7,-R*0.3,R*0.55,R*0.25,sg*0.4,0,6.283);g.fill();g.restore()}g.restore()}
 if(type==='frost'){g.fillStyle='#e8fbff';g.strokeStyle='#5ab8e8';g.lineWidth=R*0.05;for(const sg of[-1,1]){g.beginPath();g.moveTo(sg*R*0.3,-R*0.6);g.lineTo(sg*R*(0.55+st*0.12),-R*(1.15+st*0.2));g.lineTo(sg*R*0.55,-R*0.55);g.closePath();g.fill();g.stroke()}}
 // body
 const bg=g.createRadialGradient(-R*0.3,-R*0.4,R*0.1,0,0,R*1.1);

 for(const e of enemies){if(e.dead)continue;e.flash-=dt;let sp=e.spd;if(e.slowT>0){e.slowT-=dt;sp*=1-e.slowF}
  if(e.burnT>0){e.burnT-=dt;e.burnAcc=(e.burnAcc||0)+e.burnD*dt;if(e.burnAcc>=1){hurt(e,e.burnAcc,e.burnSrc,true);e.burnAcc=0}}

  if(e.s>=plen){e.dead=true;e.leaked=true;const dmg=e.type==='boss'?(e.king?10:5):1;lives-=dmg;shake=8;hurtFlash=0.4;snd(100,0.3,'sawtooth',0.07,50);ui();if(lives<=0){lose();return}}}

 // towers
