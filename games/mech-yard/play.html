<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mech Yard</title>
<link rel="stylesheet" href="/assets/fonts.css">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#140c08;color:#fff;font-family:'Rajdhani',sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.ov{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,rgba(40,22,10,.95),rgba(15,10,8,.97));padding:12px;box-sizing:border-box;overflow:auto}
.hidden{display:none!important}
h1{font-family:'Black Ops One',cursive;font-weight:400;font-size:clamp(44px,12vw,90px);margin:0;line-height:.95;color:#ffb020;text-shadow:0 4px 0 #6b3a00,0 0 30px #ff8a0066;letter-spacing:2px}
h2{font-family:'Black Ops One';font-weight:400;margin:0 0 6px;font-size:26px;color:#ffb020;letter-spacing:1px}
.btn{font-family:'Black Ops One';font-size:20px;letter-spacing:1px;color:#1a0f00;background:linear-gradient(#ffd060,#ff9a10);border:none;border-radius:8px;padding:12px 26px;margin:6px;cursor:pointer;box-shadow:0 5px 0 #7a4a00;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.btn:active{transform:translateY(3px)}
.btn.alt{background:linear-gradient(#9ab0d0,#5a7090);color:#fff}
.btn.off{filter:grayscale(1) brightness(.6)}
.sub{font-size:17px;opacity:.85;margin:12px 0 20px}
#garage{align-items:flex-start}
.gwrap{display:flex;gap:16px;max-width:980px;width:100%;flex-wrap:wrap;justify-content:center}
.panel{background:rgba(255,180,60,.06);border:2px solid rgba(255,176,32,.35);border-radius:10px;padding:12px;box-sizing:border-box}
#prev{width:300px;height:280px;display:block;background:radial-gradient(circle at 50% 70%,#3a2a1a,#140c08)}
.left{display:flex;flex-direction:column;align-items:center;gap:8px}
.stats{font-size:15px;line-height:1.5;width:300px}
.stats b{color:#ffb020}
.right{flex:1;min-width:300px;max-width:560px}
.tabs{display:flex;gap:4px;margin-bottom:8px;flex-wrap:wrap}
.tab{flex:1;font-family:'Black Ops One';font-size:14px;padding:8px 4px;background:#2a1c10;border:2px solid #5a3a1a;color:#caa;cursor:pointer;text-align:center;border-radius:6px}
.tab.on{background:#ffb020;color:#1a0f00;border-color:#ffd060}
.part{display:flex;align-items:center;gap:10px;padding:8px;margin:6px 0;background:rgba(0,0,0,.3);border:2px solid #3a2a1a;border-radius:8px;cursor:pointer}
.part.eq{border-color:#5ff7ff;box-shadow:0 0 12px #5ff7ff55}
.part canvas{width:64px;height:64px;flex:0 0 64px;background:#0006;border-radius:6px}
.part .tx{flex:1;font-size:14px;line-height:1.3}.part .tx b{font-size:17px;color:#fff}
.part .pr{font-family:'Black Ops One';font-size:14px;color:#ffb020;white-space:nowrap}
.boss{display:flex;align-items:center;gap:8px;padding:7px 10px;margin:5px 0;background:rgba(0,0,0,.3);border:2px solid #3a2a1a;border-radius:8px;cursor:pointer;font-size:15px}
.boss.sel{border-color:#ff3b5c;box-shadow:0 0 12px #ff3b5c66}
.boss.lock{opacity:.4;cursor:default}
.boss b{font-family:'Black Ops One';font-weight:400;flex:1;letter-spacing:1px}
.scrap{font-family:'Black Ops One';font-size:22px;color:#ffb020}
.cb{position:fixed;z-index:3;border-radius:14px;border:3px solid rgba(255,176,32,.6);background:rgba(255,176,32,.14);display:flex;align-items:center;justify-content:center;font-family:'Black Ops One';color:#fff;font-size:22px}
.cb.on{background:rgba(255,176,32,.45)}
#bL{left:12px;bottom:calc(16px + env(safe-area-inset-bottom));width:78px;height:78px}
#bR{left:100px;bottom:calc(16px + env(safe-area-inset-bottom));width:78px;height:78px}
#bJ{right:12px;bottom:calc(16px + env(safe-area-inset-bottom));width:96px;height:96px;border-radius:50%;font-size:16px}
#bS{right:118px;bottom:calc(30px + env(safe-area-inset-bottom));width:74px;height:74px;border-radius:50%;font-size:12px;border-color:rgba(95,247,255,.7);background:rgba(95,247,255,.14)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="cb hidden" id="bL">◀</div><div class="cb hidden" id="bR">▶</div><div class="cb hidden" id="bJ">JUMP</div><div class="cb hidden" id="bS">SPECIAL</div>
<div class="ov" id="title"><div style="text-align:center">
  <h1>MECH<br>YARD</h1>
  <div class="sub">Build a battle mech from scrap. Smash giant bosses. Earn more scrap.</div>
  <button class="btn" id="startB">▶ ENTER THE YARD</button>
  <div class="sub" style="font-size:13px" id="tHelp"></div>
</div></div>
<div class="ov hidden" id="garage"><div style="width:100%;max-width:980px">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px"><h2 style="margin:0">GARAGE</h2><div class="scrap">⚙ <span id="scrapV">0</span></div></div>
  <div class="gwrap">
    <div class="left panel"><canvas id="prev" width="600" height="560"></canvas><div class="stats" id="statsV"></div></div>
    <div class="right panel">
      <div class="tabs" id="tabs"></div>
      <div id="parts"></div>
      <h2 style="font-size:20px;margin-top:12px">CHOOSE YOUR OPPONENT</h2>
      <div id="bosses"></div>
      <div style="text-align:center"><button class="btn" id="fightB">⚔ FIGHT!</button></div>
    </div>
  </div>
</div></div>
<div class="ov hidden" id="resO" style="background:rgba(10,6,4,.85)"><div style="text-align:center">
  <h1 id="rT" style="font-size:clamp(34px,9vw,64px)">BOSS DESTROYED</h1>
  <div class="sub" id="rS"></div>
  <button class="btn" id="rG">⚙ GARAGE</button><button class="btn alt" id="rA">↻ REMATCH</button>
</div></div>
<script>
(()=>{
const cv=document.getElementById('c'),ctx=cv.getContext('2d');const $=id=>document.getElementById(id);
const isTouch=('ontouchstart' in window)||navigator.maxTouchPoints>0;
$('tHelp').textContent=isTouch?'◀ ▶ move · JUMP to dodge · SPECIAL for your core power · Weapons fire automatically':'A/D or ←/→ move · W, ↑ or SPACE jump · E or SHIFT special · Weapons fire automatically';
const GW=1000,GH=560,GY=470,GRAV=1900;
const LEGS={walker:{n:'Walker Legs',cost:0,spd:240,jump:700,hp:0,armor:0,d:'Balanced. Good jump.'},treads:{n:'Tank Treads',cost:300,spd:170,jump:520,hp:60,armor:0.25,d:'Slow but tough. +60 HP, -25% damage taken.'},hover:{n:'Hover Jets',cost:600,spd:300,jump:620,hp:-10,armor:0,dbl:1,d:'Fastest. Double jump in mid-air.'}};
const WEAPONS={blaster:{n:'Blaster',cost:0,d:'Rapid energy bolts. 6 shots/sec.'},rockets:{n:'Rocket Pod',cost:250,d:'Homing rockets that explode.'},saw:{n:'Buzz Saw',cost:350,d:'Huge melee damage up close.'},laser:{n:'Laser Lance',cost:500,d:'Charges, then melts with a long beam.'},rail:{n:'Railgun',cost:900,d:'Massive piercing shot every 2 seconds.'}};
const CORES={basic:{n:'Basic Core',cost:0,hp:100,cd:14,col:'#5ff7ff',d:'SPECIAL: Repair +35 HP.'},shield:{n:'Shield Core',cost:400,hp:110,cd:10,col:'#4a8cff',d:'SPECIAL: Energy shield blocks everything for 3s.'},over:{n:'Overdrive Core',cost:700,hp:90,cd:12,col:'#ff3b5c',d:'SPECIAL: Weapons fire twice as fast for 4s.'}};
const BOSSES=[{n:'SCRAP CRAB',hp:700,reward:200,col:'#e0603a'},{n:'DRILL WORM',hp:1100,reward:320,col:'#c9a227'},{n:'SKY HORNET',hp:1400,reward:450,col:'#ffd23f'},{n:'IRON GOLEM',hp:2300,reward:650,col:'#8aa0c8'},{n:'OMEGA TITAN',hp:3600,reward:1000,col:'#ff3b5c'}];
let sv={scrap:0,owned:['walker','blaster','basic'],eq:{legs:'walker',wl:'blaster',wr:'blaster',core:'basic'},beaten:-1,sel:0};
try{const d=JSON.parse(localStorage.getItem('mechyard_v1')||'null');if(d)sv=Object.assign(sv,d)}catch(e){}
function persist(){try{localStorage.setItem('mechyard_v1',JSON.stringify(sv))}catch(e){}}
let AC=null;function snd(f,d=0.1,type='square',v=0.05,f2,noise){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const n=AC.currentTime,g=AC.createGain();g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(0.0008,n+d);
 if(noise){const len=Math.floor(AC.sampleRate*d),b=AC.createBuffer(1,len,AC.sampleRate),dd=b.getChannelData(0);for(let i=0;i<len;i++)dd[i]=(Math.random()*2-1)*(1-i/len);const s=AC.createBufferSource();s.buffer=b;const fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.value=f;s.connect(fl).connect(g).connect(AC.destination);s.start(n);return}
 const o=AC.createOscillator();o.type=type;o.frequency.setValueAtTime(f,n);if(f2)o.frequency.exponentialRampToValueAtTime(f2,n+d);o.connect(g).connect(AC.destination);o.start(n);o.stop(n+d+0.03)}catch(e){}}

// ================= ART HELPERS =================
if(!CanvasRenderingContext2D.prototype.roundRect)CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){r=Math.min(r,Math.abs(w)/2,Math.abs(h)/2);this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath()};
const SHC={};function shade(hex,k){const key=hex+k;if(SHC[key])return SHC[key];const n=[1,3,5].map(i=>parseInt(hex.substr(i,2),16));return SHC[key]='#'+n.map(v=>Math.max(0,Math.min(255,Math.round(k>0?v+(255-v)*k:v*(1+k))))).map(v=>v.toString(16).padStart(2,'0')).join('')}
const GLS={};function glowSpr(col){if(GLS[col])return GLS[col];const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d');const rg=g.createRadialGradient(32,32,0,32,32,32);rg.addColorStop(0,col);rg.addColorStop(0.3,col);rg.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=rg;g.fillRect(0,0,64,64);return GLS[col]=c}
function glow(g,col,x,y,r,a=1){const o=g.globalCompositeOperation,oa=g.globalAlpha;g.globalCompositeOperation='lighter';g.globalAlpha=a*oa;g.drawImage(glowSpr(col),x-r,y-r,r*2,r*2);g.globalAlpha=oa;g.globalCompositeOperation=o}
const SOFTS=(()=>{const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d');const rg=g.createRadialGradient(32,32,0,32,32,32);rg.addColorStop(0,'rgba(0,0,0,.6)');rg.addColorStop(0.6,'rgba(0,0,0,.3)');rg.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=rg;g.fillRect(0,0,64,64);return c})();
const hsh=(a,b)=>{const v=Math.sin(a*127.1+b*311.7)*43758.5453;return v-Math.floor(v)};
function metal(g,c,x0,y0,x1,y1){const gr=g.createLinearGradient(x0,y0,x1,y1);gr.addColorStop(0,shade(c,0.35));gr.addColorStop(0.5,c);gr.addColorStop(1,shade(c,-0.35));return gr}
function rad(g,c,x,y,r){const gr=g.createRadialGradient(x-r*0.35,y-r*0.4,r*0.05,x,y,r*1.1);gr.addColorStop(0,shade(c,0.45));gr.addColorStop(0.5,c);gr.addColorStop(1,shade(c,-0.4));return gr}
// ---- scrapyard backdrop (world coords) ----
let YD=null;function yardDeco(){if(YD)return YD;let sd=23;const r=()=>{sd=(sd*9301+49297)%233280;return sd/233280};const piles=[],items=[],clouds=[];
 for(let i=0;i<8;i++)piles.push({x:-180+i*190+r()*60,w:170+r()*120,h:50+r()*60,s:r()*100});
 for(let i=0;i<9;i++)items.push({x:-60+i*135+r()*50,k:['tire','barrel','car','crate','tire','barrel'][Math.floor(r()*6)],s:0.7+r()*0.4,rot:(r()-0.5)*0.25,c:['#6a3a2a','#3a5a6a','#7a6a3a','#5a4a6a'][Math.floor(r()*4)]});
 for(let i=0;i<6;i++)clouds.push({x:r()*1400-200,y:40+r()*160,w:120+r()*160,v:6+r()*8});
 return YD={piles,items,clouds}}
function drawYard(g,off,t){const D=yardDeco();
 // sun + halo
 glow(g,'#ffb060',760-off*0.02,210,260,0.55);const sg=g.createRadialGradient(745-off*0.02,195,5,760-off*0.02,210,62);sg.addColorStop(0,'#fffbe8');sg.addColorStop(0.7,'#ffe0a0');sg.addColorStop(1,'#ffb060');g.fillStyle=sg;g.beginPath();g.arc(760-off*0.02,210,60,0,6.283);g.fill();
 g.fillStyle='rgba(255,140,80,.35)';for(let i=0;i<4;i++)g.fillRect(690-off*0.02,200+i*16,140,4+i);
 // clouds
 for(const c of D.clouds){const x=((c.x+t*c.v-off*0.04)%1500+1500)%1500-250;g.fillStyle='rgba(90,40,70,.55)';g.beginPath();g.ellipse(x,c.y,c.w,c.w*0.16,0,0,6.283);g.fill();g.fillStyle='rgba(255,150,100,.35)';g.beginPath();g.ellipse(x+c.w*0.1,c.y+c.w*0.06,c.w*0.8,c.w*0.07,0,0,6.283);g.fill()}
 // mountain / scrap layers
 const cols=[['#6a3046','#4a2034'],['#4a2234','#2e1622'],['#2e1620','#1a0c14']];
 bgLayers.forEach((pts,l)=>{const o2=P?(P.x-500)*(0.05+l*0.05):0;const lg=g.createLinearGradient(0,GY-260+l*40,0,GY);lg.addColorStop(0,cols[l][0]);lg.addColorStop(1,cols[l][1]);g.fillStyle=lg;g.beginPath();g.moveTo(-200,GY);for(const [x,y] of pts)g.lineTo(x-o2,y);g.lineTo(GW+300,GY);g.closePath();g.fill();
  g.strokeStyle=l===0?'rgba(255,150,110,.35)':'rgba(255,120,90,.18)';g.lineWidth=2;g.beginPath();pts.forEach(([x,y],i)=>i?g.lineTo(x-o2,y):g.moveTo(x-o2,y));g.stroke();
  if(l===1){const cx=150-o2;g.strokeStyle='#2e1622';g.lineWidth=8;g.beginPath();g.moveTo(cx,GY);g.lineTo(cx,GY-260);g.lineTo(cx+190,GY-260);g.stroke();g.lineWidth=2;for(let k=0;k<9;k++){g.beginPath();g.moveTo(cx-6,GY-k*28);g.lineTo(cx+6,GY-k*28-28);g.moveTo(cx+6,GY-k*28);g.lineTo(cx-6,GY-k*28-28);g.stroke()}for(let k=0;k<6;k++){g.beginPath();g.moveTo(cx+k*30,GY-266);g.lineTo(cx+k*30+15,GY-254);g.lineTo(cx+k*30+30,GY-266);g.stroke()}
   g.beginPath();g.moveTo(cx+170,GY-260);g.lineTo(cx+170,GY-195+Math.sin(t*0.8)*6);g.stroke();g.fillStyle='#2e1622';g.fillRect(cx+150,GY-196+Math.sin(t*0.8)*6,40,22);const on=Math.sin(t*2.5)>0;g.fillStyle=on?'#ff3b3b':'#5a1020';g.beginPath();g.arc(cx+190,GY-266,4,0,6.283);g.fill();if(on)glow(g,'#ff3b3b',cx+190,GY-266,18,0.8)}
  if(l===2){for(const pl of D.piles){const x=pl.x-o2;g.fillStyle='#1e0e16';g.beginPath();g.moveTo(x,GY);g.quadraticCurveTo(x+pl.w*0.2,GY-pl.h*1.1,x+pl.w*0.5,GY-pl.h);g.quadraticCurveTo(x+pl.w*0.8,GY-pl.h*0.9,x+pl.w,GY);g.fill();g.strokeStyle='rgba(255,120,80,.15)';g.lineWidth=2;for(let k=0;k<4;k++){const px=x+pl.w*(0.2+hsh(pl.s,k)*0.6),py=GY-pl.h*(0.3+hsh(k,pl.s)*0.5);g.strokeRect(px,py,14+hsh(k,k)*14,8)}}}});
 // junk on the ground line
 for(const it of D.items){const x=it.x-(P?(P.x-500)*0.2:0);g.save();g.translate(x,GY);g.rotate(it.rot);g.scale(it.s,it.s);g.globalAlpha=0.9;
  if(it.k==='tire'){g.fillStyle='#141016';g.beginPath();g.ellipse(0,-16,22,16,0,0,6.283);g.fill();g.fillStyle='#2a2028';g.beginPath();g.ellipse(0,-16,9,7,0,0,6.283);g.fill()}
  else if(it.k==='barrel'){const bg=metal(g,it.c,-12,0,12,0);g.fillStyle=bg;g.fillRect(-12,-36,24,36);g.fillStyle='rgba(0,0,0,.35)';g.fillRect(-12,-26,24,3);g.fillRect(-12,-12,24,3);g.fillStyle='#ffb020';g.fillRect(-12,-34,24,3)}
  else if(it.k==='car'){g.fillStyle=shade(it.c,-0.3);g.beginPath();g.roundRect(-46,-26,92,22,6);g.fill();g.beginPath();g.roundRect(-26,-42,48,18,6);g.fill();g.fillStyle='rgba(255,170,120,.18)';g.fillRect(-22,-39,18,10);g.fillRect(2,-39,16,10);g.fillStyle='#141016';g.beginPath();g.arc(-28,-4,9,0,6.283);g.arc(28,-4,9,0,6.283);g.fill()}
  else{g.fillStyle=shade('#7a5a3a',-0.25);g.fillRect(-18,-32,36,32);g.strokeStyle='rgba(0,0,0,.4)';g.lineWidth=2;g.strokeRect(-18,-32,36,32);g.beginPath();g.moveTo(-18,-32);g.lineTo(18,0);g.stroke()}
  g.globalAlpha=1;g.restore()}
 // ground: rusty plates
 const gg=g.createLinearGradient(0,GY,0,GY+120);gg.addColorStop(0,'#4a3424');gg.addColorStop(0.15,'#33231a');gg.addColorStop(1,'#1a110c');g.fillStyle=gg;g.fillRect(-500,GY,GW+1000,3000);
 for(let x=-480;x<GW+500;x+=80){const k=hsh(x,3);g.fillStyle=`rgba(${k<0.5?'150,80,40':'0,0,0'},${(0.08+k*0.08).toFixed(2)})`;g.fillRect(x,GY+8,80,200);g.strokeStyle='#120c08';g.lineWidth=2;g.beginPath();g.moveTo(x,GY+8);g.lineTo(x,GH+2000);g.stroke();g.strokeStyle='rgba(255,180,120,.08)';g.beginPath();g.moveTo(x+2,GY+8);g.lineTo(x+2,GH+2000);g.stroke();
  for(const [rx,ry] of[[8,20],[72,20],[8,70],[72,70]]){g.fillStyle='#120c08';g.beginPath();g.arc(x+rx+1,GY+ry+1,3,0,6.283);g.fill();g.fillStyle='#7a5a44';g.beginPath();g.arc(x+rx,GY+ry,2.6,0,6.283);g.fill()}}
 g.fillStyle='#6a4a34';g.fillRect(-500,GY,GW+1000,4);for(let x=-500;x<GW+500;x+=40){g.fillStyle=(x/40)%2?'#ffb020':'#1a1410';g.beginPath();g.moveTo(x,GY+4);g.lineTo(x+20,GY+4);g.lineTo(x+12,GY+10);g.lineTo(x-8,GY+10);g.fill()}
 for(const px of[180,520,840]){const pg=g.createLinearGradient(0,GY+18,0,GY+34);pg.addColorStop(0,'rgba(255,160,110,.4)');pg.addColorStop(1,'rgba(90,40,70,.3)');g.fillStyle=pg;g.beginPath();g.ellipse(px,GY+26,70,7,0,0,6.283);g.fill();g.fillStyle='rgba(255,230,190,.3)';g.fillRect(px-30,GY+24,40,2)}
 // drifting embers
 for(let i=0;i<26;i++){const sp=0.5+hsh(i,9);const x=((hsh(i,1)*GW+t*18*sp)%(GW+200))-100,y=GY-((t*28*sp+hsh(2,i)*GY)%GY);glow(g,'#ff9a4a',x,y,5+hsh(i,4)*4,0.6)}}
// ================= MECH DRAWING =================
function drawWeapon(g,type,t,opt={}){
 // drawn pointing +x from shoulder pivot at 0,0
 g.lineJoin='round';
 g.fillStyle=metal(g,'#5a5f6a',0,-9,0,9);g.strokeStyle='#1a1410';g.lineWidth=3;
 g.beginPath();g.roundRect?g.roundRect(-8,-9,30,18,5):g.rect(-8,-9,30,18);g.fill();g.stroke();g.fillStyle='rgba(255,255,255,.2)';g.fillRect(-4,-7,24,3);

 if(state==='battle'){
  let mv=0;if(keys.KeyA||keys.ArrowLeft||tb.L)mv-=1;if(keys.KeyD||keys.ArrowRight||tb.R)mv+=1;

 // player projectiles

 for(const side of['L','R']){const w=P.w[side];if(w.type==='laser'&&w.ph!=='idle'&&w.tip&&w.beamTo&&state==='battle'){const [x1,y1]=w.tip,[x2,y2]=w.beamTo;if(w.ph==='charge'){ctx.strokeStyle='rgba(255,92,240,.4)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}else{ctx.strokeStyle='rgba(255,92,240,.6)';ctx.lineWidth=18+Math.random()*6;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.strokeStyle='#fff';ctx.lineWidth=5;ctx.stroke();parts.push({x:x2+(Math.random()-0.5)*30,y:y2+(Math.random()-0.5)*30,vx:(Math.random()-0.5)*200,vy:-Math.random()*200,life:0,max:0.3,col:'#ff5cf0',r:3,g:400})}}}
 for(const b of beams){if(b.rail){const a=1-b.t/0.35;ctx.strokeStyle=`rgba(95,247,255,${a})`;ctx.lineWidth=20*a+2;ctx.beginPath();ctx.moveTo(b.x1,b.y1);ctx.lineTo(b.x2,b.y2);ctx.stroke();ctx.strokeStyle=`rgba(255,255,255,${a})`;ctx.lineWidth=4;ctx.stroke()}else if(b.t>=b.warn){const a=1-(b.t-b.warn)/b.dur;ctx.fillStyle=`rgba(255,60,60,${0.5*a+0.3})`;ctx.fillRect(0,b.y-b.h/2,GW,b.h);ctx.fillStyle=`rgba(255,240,200,${a})`;ctx.fillRect(0,b.y-b.h/5,GW,b.h/2.5)}}
 for(const p of pb){if(p.k==='bolt')glow(ctx,'#5ff7ff',p.x,p.y,18,0.8);else glow(ctx,'#ffb020',p.x,p.y,22,0.9);
  if(p.k==='bolt'){ctx.strokeStyle='#5ff7ff';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.vx*0.025,p.y-p.vy*0.025);ctx.stroke();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke()}else{ctx.fillStyle='#ffb020';ctx.beginPath();ctx.arc(p.x,p.y,6,0,6.283);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(p.x,p.y,3,0,6.283);ctx.fill()}}
 for(const e of eb){if(e.k==='shot'||e.k==='lob'){glow(ctx,e.col.length===7?e.col:'#ff6a3a',e.x,e.y,e.r*4,0.7);ctx.fillStyle=e.col;ctx.globalAlpha=0.4;ctx.beginPath();ctx.arc(e.x,e.y,e.r*1.8,0,6.283);ctx.fill();ctx.globalAlpha=1;ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,6.283);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(e.x,e.y,e.r*0.4,0,6.283);ctx.fill()}
  else if(e.k==='wave'){const g2=ctx.createLinearGradient(0,GY-e.h,0,GY);g2.addColorStop(0,'rgba(255,176,32,0)');g2.addColorStop(1,'rgba(255,176,32,.9)');ctx.fillStyle=g2;ctx.beginPath();ctx.moveTo(e.x-40,GY);ctx.quadraticCurveTo(e.x,GY-e.h*2,e.x+40,GY);ctx.fill()}
  else if(e.k==='col'&&e.t>=e.warn){const a=Math.max(0,1-(e.t-e.warn)/0.5);ctx.fillStyle=`rgba(255,120,60,${a*0.8})`;ctx.fillRect(e.x-e.w/2,0,e.w,GY);ctx.fillStyle=`rgba(255,255,220,${a})`;ctx.fillRect(e.x-e.w/6,0,e.w/3,GY)}}
 ctx.globalCompositeOperation='source-over';
 for(const p of parts){const a=1-p.life/p.max;ctx.globalAlpha=p.smoke?a*0.7:a;if(!p.smoke&&!p.ring&&p.col[0]==='#'&&p.col.length===7)glow(ctx,p.col,p.x,p.y,p.r*3.2,a*0.6);if(p.ring){ctx.strokeStyle=p.col;ctx.lineWidth=5*a;ctx.beginPath();ctx.arc(p.x,p.y,p.ring*(1.4-a),0,6.283);ctx.stroke()}else{ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.smoke?p.r*(1.6-a):p.r*a+0.5,0,6.283);ctx.fill()}}

 const pw=Math.min(240,W*0.38);hb(14,14,pw,12,Math.max(0,P.hp/P.maxHp),P.hp/P.maxHp>0.3?'#5fff8a':'#ff3b3b','#0a3a1a');ctx.textAlign='left';ctx.font="12px 'Black Ops One'";ctx.fillStyle='#fff';ctx.fillText('MECH '+Math.ceil(P.hp)+'/'+P.maxHp,14,46);

function drawTitle(){ctx.setTransform(DPR,0,0,DPR,0,0);const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#170a2e');sky.addColorStop(0.35,'#4a1a4a');sky.addColorStop(0.65,'#c2502a');sky.addColorStop(1,'#ffb060');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);ctx.setTransform(S*DPR,0,0,S*DPR,OX*DPR,OY*DPR);drawYard(ctx,Math.sin(time*0.2)*80,time);ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle='rgba(10,4,16,.35)';ctx.fillRect(0,0,W,H)}

const OVS=['title','garage','resO'];function show(id){for(const o of OVS)$(o).classList.toggle('hidden',o!==id);if(id)state=id==='garage'?'garage':id==='title'?'title':state}

let last=performance.now();
function frame(now){const dt=Math.min(0.033,(now-last)/1000);last=now;time+=dt;
