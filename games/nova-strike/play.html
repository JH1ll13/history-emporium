<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Nova Strike</title>
<link rel="stylesheet" href="/assets/fonts.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#02030a;color:#e8f4ff;font-family:'Exo 2',system-ui,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#ov{pointer-events:none}
.hidden{display:none!important}
#flash{position:fixed;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,rgba(255,60,40,0) 35%,rgba(255,40,30,.75) 100%)}
#flash2{position:fixed;inset:0;pointer-events:none;opacity:0;background:#fff}
.O{font-family:'Orbitron',sans-serif;font-weight:900;letter-spacing:.06em}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;padding:max(12px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
#hTL{position:absolute;left:max(14px,env(safe-area-inset-left));top:max(12px,env(safe-area-inset-top))}
#hScore{font-family:'Orbitron';font-weight:900;font-size:30px;text-shadow:0 0 14px rgba(63,247,255,.7);line-height:1}
#hMultW{display:flex;align-items:center;gap:8px;margin-top:6px}
#hMult{font-family:'Orbitron';font-weight:900;font-size:22px;color:#ffd23f;text-shadow:0 0 12px #ffb000}
.cbar{width:90px;height:6px;background:rgba(255,255,255,.12);border-radius:3px;overflow:hidden}
#hComboBar{height:100%;width:0;background:linear-gradient(90deg,#ffb000,#ffd23f);transition:width .1s}
#hTC{position:absolute;left:50%;top:max(12px,env(safe-area-inset-top));transform:translateX(-50%);text-align:center;width:min(440px,52vw)}
#hSec{font-family:'Orbitron';font-weight:700;font-size:11px;letter-spacing:.22em;color:#9ad8ff;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbar{height:4px;margin-top:6px;background:rgba(255,255,255,.12);border-radius:2px;overflow:hidden}
#hProg{height:100%;width:0;background:linear-gradient(90deg,#3ff7ff,#a06aff)}
#hBoss{margin-top:12px}
#hBossN{font-family:'Orbitron';font-weight:900;font-size:14px;letter-spacing:.2em;color:#ff5a6a;text-shadow:0 0 12px #ff2a3a}
.bbar{height:12px;margin-top:5px;border:1px solid rgba(255,90,106,.7);border-radius:3px;background:rgba(40,0,8,.6);overflow:hidden;box-shadow:0 0 14px rgba(255,40,60,.4)}
#hBossBar{height:100%;width:100%;background:linear-gradient(90deg,#ff2a3a,#ff8a4a);transition:width .15s}
#hBL{position:absolute;left:max(14px,env(safe-area-inset-left));bottom:max(14px,env(safe-area-inset-bottom));width:min(260px,40vw)}
.lab{font-family:'Orbitron';font-weight:700;font-size:10px;letter-spacing:.25em;color:#9ad8ff;display:flex;justify-content:space-between}
.sbar{height:12px;margin-top:5px;border:1px solid rgba(63,247,255,.55);border-radius:3px;background:rgba(0,20,30,.55);overflow:hidden;transform:skewX(-18deg)}
#hShieldBar{height:100%;width:100%;transition:width .12s}
#hWeap{margin-top:8px;font-family:'Orbitron';font-size:10px;letter-spacing:.15em;color:#cfe8ff}
#hWeap b{color:#ffd23f}
#pauseB{position:absolute;right:max(14px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));pointer-events:auto;width:44px;height:44px;border-radius:12px;border:1px solid rgba(154,216,255,.4);background:rgba(10,20,40,.5);color:#cfe8ff;font-size:18px;cursor:pointer;backdrop-filter:blur(6px)}
#banner{position:fixed;left:0;right:0;top:24%;text-align:center;pointer-events:none;opacity:0;transform:scale(1.4)}
#banner.show{animation:bn 0.35s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes bn{from{opacity:0;transform:scale(1.5)}to{opacity:1;transform:scale(1)}}
.bt{font-family:'Orbitron';font-weight:900;font-size:clamp(30px,7vw,64px);letter-spacing:.1em}
.bt.sm{font-size:clamp(18px,4vw,30px)}
.bt.warn{animation:wb .45s steps(2) infinite}
@keyframes wb{50%{opacity:.25}}
.bs{margin-top:8px;font-weight:600;font-size:clamp(13px,2.6vw,18px);letter-spacing:.08em;color:#dbeaff;text-shadow:0 2px 8px #000}
#toast{position:fixed;left:50%;bottom:12%;transform:translateX(-50%);padding:10px 18px;border-radius:10px;background:rgba(255,59,92,.9);font-weight:800;opacity:0;pointer-events:none}
#toast.show{animation:ts 1.6s forwards}
@keyframes ts{0%{opacity:0}10%,75%{opacity:1}100%{opacity:0}}
/* touch */
#touch{position:fixed;right:max(18px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:14px}
.tb{border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Orbitron';font-weight:900;letter-spacing:.08em;color:#fff;touch-action:none}
#rollB{width:66px;height:66px;font-size:11px;background:rgba(63,247,255,.16);border:2px solid rgba(63,247,255,.7);box-shadow:0 0 18px rgba(63,247,255,.35)}
#lockB{width:96px;height:96px;font-size:14px;background:rgba(255,59,92,.18);border:3px solid rgba(255,59,92,.85);box-shadow:0 0 24px rgba(255,59,92,.45)}
#lockB.on{background:rgba(255,59,92,.55);transform:scale(.94)}
/* screens */
.scr{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;overflow:auto}
.dim{background:radial-gradient(ellipse at center,rgba(2,4,14,.35),rgba(2,4,14,.82))}
#logo{font-family:'Orbitron';font-weight:900;font-size:clamp(46px,11vw,120px);line-height:.9;letter-spacing:.06em;text-align:center;background:linear-gradient(180deg,#fff 10%,#7af3ff 45%,#2a7aff 70%,#a040ff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 22px rgba(63,180,255,.65))}
#tag{margin-top:10px;font-family:'Orbitron';font-weight:700;letter-spacing:.5em;font-size:clamp(10px,2vw,14px);color:#9ad8ff;text-align:center}
#title{justify-content:space-between;padding-top:max(8vh,30px);padding-bottom:max(6vh,24px)}
.menu{display:flex;flex-direction:column;gap:12px;width:min(340px,86vw)}
.btn{font-family:'Orbitron';font-weight:900;font-size:17px;letter-spacing:.14em;padding:15px 18px;border-radius:14px;border:1px solid rgba(122,243,255,.55);color:#fff;background:linear-gradient(180deg,rgba(40,90,160,.55),rgba(10,24,60,.7));box-shadow:0 0 20px rgba(63,180,255,.25),inset 0 1px 0 rgba(255,255,255,.25);cursor:pointer;backdrop-filter:blur(8px);transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translateY(-2px) scale(1.02);box-shadow:0 0 30px rgba(63,220,255,.55),inset 0 1px 0 rgba(255,255,255,.35)}
.btn.pri{background:linear-gradient(180deg,#ff6a3a,#d8204a);border-color:#ffb08a;box-shadow:0 0 28px rgba(255,80,60,.55),inset 0 1px 0 rgba(255,255,255,.4);font-size:21px;padding:18px}
.btn.locked{opacity:.45}
.btn.sm{font-size:13px;padding:11px 14px}
.cred{font-family:'Orbitron';font-weight:700;color:#ffd23f;letter-spacing:.12em;font-size:14px;text-align:center;text-shadow:0 0 10px rgba(255,200,40,.5)}
.foot{margin-top:6px;font-size:12px;color:#8aa4c8;text-align:center;line-height:1.5}
.panel{width:min(760px,96vw);background:linear-gradient(180deg,rgba(14,26,56,.82),rgba(6,10,26,.9));border:1px solid rgba(122,243,255,.3);border-radius:20px;padding:22px;box-shadow:0 0 50px rgba(30,120,255,.25);backdrop-filter:blur(10px)}
.ph{font-family:'Orbitron';font-weight:900;font-size:24px;letter-spacing:.14em;text-align:center;margin-bottom:16px;color:#bff6ff;text-shadow:0 0 14px rgba(63,247,255,.6)}
#secList{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.sec{position:relative;border-radius:14px;padding:16px 14px;min-height:130px;cursor:pointer;border:1px solid rgba(255,255,255,.25);overflow:hidden;transition:transform .15s;display:flex;flex-direction:column;justify-content:flex-end;box-shadow:inset 0 -60px 60px rgba(0,0,0,.5)}
.sec:hover{transform:scale(1.04)}
.sec.locked{filter:grayscale(.85) brightness(.55);cursor:default}
.sn{font-family:'Orbitron';font-size:11px;letter-spacing:.25em;opacity:.85}
.st{font-family:'Orbitron';font-weight:900;font-size:17px;margin:4px 0 6px;text-shadow:0 2px 8px #000}
.sb{font-size:12px;font-weight:600;opacity:.95}
.row2{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.rk{font-family:'Orbitron';font-weight:900}
.rkS{color:#ffd23f;text-shadow:0 0 14px #ffb000}.rkA{color:#3aff9a;text-shadow:0 0 12px #0f8}.rkB{color:#3ff7ff}.rkC{color:#c0a0ff}.rkD{color:#999}
/* hangar */
#hangar{align-items:flex-end;justify-content:center;padding-right:max(3vw,16px)}
#hgPanel{width:min(470px,96vw);max-height:92vh;overflow:auto}
#shipList{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.shp{border-radius:12px;padding:10px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);cursor:pointer;transition:transform .12s}
.shp:hover{transform:translateY(-2px)}
.shp.sel{border-color:#3ff7ff;background:rgba(63,247,255,.12);box-shadow:0 0 16px rgba(63,247,255,.3)}
.shp.locked{opacity:.5}
.shn{font-family:'Orbitron';font-weight:900;font-size:14px;letter-spacing:.1em}
.shd{font-size:11px;color:#b8c8e0;margin:3px 0 6px;min-height:28px}
.stats{display:grid;grid-template-columns:34px 1fr;gap:3px 6px;align-items:center;font-family:'Orbitron';font-size:8px;color:#8aa4c8}
.stats div{height:5px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden}
.stats i{display:block;height:100%;background:linear-gradient(90deg,#3ff7ff,#a06aff)}
.shb{margin-top:8px;font-family:'Orbitron';font-weight:700;font-size:11px;color:#ffd23f;letter-spacing:.08em}
.sub{font-family:'Orbitron';font-weight:700;letter-spacing:.2em;font-size:12px;color:#9ad8ff;margin:16px 0 8px}
.upg{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 10px;padding:9px 10px;border-radius:10px;background:rgba(255,255,255,.04);margin-bottom:7px}
.un{font-family:'Orbitron';font-weight:700;font-size:12px;letter-spacing:.06em;display:flex;gap:8px;align-items:center}
.un span{color:#3ff7ff;letter-spacing:0}
.ud{font-size:11px;color:#a8b8d0;grid-column:1}
.ub{grid-row:1/3;grid-column:2;font-family:'Orbitron';font-weight:900;font-size:12px;padding:9px 12px;border-radius:10px;border:1px solid #ffd23f;background:rgba(255,200,40,.15);color:#ffe27a;cursor:pointer;min-width:84px}
.ub.off{opacity:.45;border-color:#777;color:#bbb;background:none}
/* results */
#rTitle{font-family:'Orbitron';font-weight:900;font-size:clamp(22px,5vw,34px);letter-spacing:.1em;text-align:center;color:#bff6ff;text-shadow:0 0 16px rgba(63,247,255,.6)}
#rRank{font-size:110px;line-height:1.05;text-align:center;display:block}
#rScore{font-family:'Orbitron';font-weight:900;font-size:40px;text-align:center;margin:6px 0 12px}
.row{display:flex;justify-content:space-between;padding:6px 4px;border-bottom:1px solid rgba(255,255,255,.08);font-size:14px}
.row b{font-family:'Orbitron'}
.unl{margin-top:10px;padding:10px;border-radius:10px;background:rgba(255,210,63,.13);border:1px solid rgba(255,210,63,.5);color:#ffe27a;font-weight:800;text-align:center}
#rCredits{margin-top:14px}
#results .panel,#pause .panel,#sectors .panel{max-width:560px}
#sectors .panel{max-width:760px}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#02030a;font-family:'Orbitron';letter-spacing:.3em;color:#7af3ff}
.touch .dk{display:none}
body:not(.touch) .tk{display:none}
@media (max-width:640px){#hScore{font-size:22px}#hMult{font-size:17px}#hTC{top:64px;width:70vw}#hangar{align-items:center;justify-content:flex-end;padding:12px}#hgPanel{max-height:58vh}.ph{font-size:19px}}
@media (max-height:500px){#rRank{font-size:60px}#rScore{font-size:28px}#title{padding-top:12px}}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="ov"></canvas>
<div id="flash"></div><div id="flash2"></div>
<div id="banner"></div>
<div id="hud" class="hidden">
  <div id="hTL"><div id="hScore">0</div><div id="hMultW"><div id="hMult">×1</div><div class="cbar"><div id="hComboBar"></div></div></div></div>
  <div id="hTC"><div id="hSec">SECTOR 1</div><div class="pbar"><div id="hProg"></div></div>
    <div id="hBoss" class="hidden"><div id="hBossN">BOSS</div><div class="bbar"><div id="hBossBar"></div></div></div></div>
  <button id="pauseB">❚❚</button>
  <div id="hBL"><div class="lab"><span>SHIELD</span><span id="hShieldT">100</span></div><div class="sbar"><div id="hShieldBar"></div></div><div id="hWeap"></div></div>
</div>
<div id="touch" class="hidden"><div id="rollB" class="tb">ROLL</div><div id="lockB" class="tb">LOCK</div></div>

<div id="title" class="scr hidden">
  <div><div id="logo">NOVA<br>STRIKE</div><div id="tag">STARFIGHTER ASSAULT</div></div>
  <div class="menu">
    <div class="cred">◈ <span id="tCredits">0</span> CREDITS</div>
    <button class="btn pri" id="playB">▶ PLAY</button>
    <button class="btn" id="hangarB">HANGAR</button>
    <button class="btn" id="endlessB">ENDLESS MODE</button>
    <div class="foot dk">Mouse to fly · Hold click to lock on · Shift to roll</div>
    <div class="foot tk">Drag to fly · Hold LOCK · Tap ROLL</div>
  </div>
</div>
<div id="sectors" class="scr dim hidden"><div class="panel"><div class="ph">SELECT SECTOR</div><div id="secList"></div><div class="row2"><button class="btn sm" id="secBack">◀ BACK</button></div></div></div>
<div id="hangar" class="scr hidden"><div class="panel" id="hgPanel"><div class="ph">HANGAR</div><div class="cred">◈ <span id="hgCredits">0</span> CREDITS</div>
  <div class="sub">STARFIGHTERS</div><div id="shipList"></div><div class="sub">UPGRADES</div><div id="upList"></div>
  <div class="row2"><button class="btn sm" id="hgBack">◀ BACK</button><button class="btn sm pri" id="hgPlay">LAUNCH ▶</button></div></div></div>
<div id="results" class="scr dim hidden"><div class="panel"><div id="rTitle">SECTOR CLEAR</div><span id="rRank"></span><div id="rScore">0</div><div id="rRows"></div><div class="cred" id="rCredits"></div>
  <div class="row2"><button class="btn sm pri" id="rNext">NEXT SECTOR ▶</button><button class="btn sm" id="rRetry">↻ RETRY</button><button class="btn sm" id="rHangar">HANGAR</button><button class="btn sm" id="rMenu">MENU</button></div></div></div>
<div id="pause" class="scr dim hidden"><div class="panel"><div class="ph">PAUSED</div><div class="menu" style="margin:0 auto">
  <button class="btn pri" id="resumeB">▶ RESUME</button><button class="btn sm" id="restartB">↻ RESTART SECTOR</button><button class="btn sm" id="musB">MUSIC: ON</button><button class="btn sm" id="sfxB">SOUND: ON</button><button class="btn sm" id="qB">GRAPHICS: AUTO</button><button class="btn sm" id="quitB">QUIT TO MENU</button></div></div></div>
<div id="toast"></div>
<div id="loading">LOADING…</div>
