<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Siege Smash</title>
<link rel="stylesheet" href="/assets/fonts.css">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#8fd0ff;color:#fff;font-family:'Nunito',sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.ov{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 35%,rgba(90,60,30,.85),rgba(30,18,8,.94));padding:12px;box-sizing:border-box;overflow:auto}
.hidden{display:none!important}
.box{text-align:center;width:100%;max-width:620px}
h1{font-family:'Lilita One',sans-serif;font-weight:400;font-size:clamp(48px,13vw,96px);margin:0;line-height:.95;color:#ffd23f;text-shadow:0 5px 0 #a3530a,0 10px 0 #3a1a04;transform:rotate(-2deg)}
.btn{font-family:'Lilita One';font-size:24px;color:#fff;border:none;border-radius:16px;padding:12px 30px;margin:6px;cursor:pointer;background:linear-gradient(#ff8a3a,#d8460a);box-shadow:0 6px 0 #7a2604;text-shadow:0 2px 0 #7a2604}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #7a2604}
.btn.g{background:linear-gradient(#8dff6a,#2fae2a);box-shadow:0 6px 0 #1a6b16;text-shadow:0 2px 0 #1a6b16}
#grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}
.lv{background:linear-gradient(#a07040,#6a4220);border:3px solid #e0b070;border-radius:14px;padding:10px 4px;cursor:pointer;font-family:'Lilita One';font-size:24px}
.lv small{display:block;font-family:'Nunito';font-size:10px;opacity:.85}
.lv .st{font-size:14px;color:#ffd23f;letter-spacing:1px}
.lv.lock{filter:grayscale(1) brightness(.5);cursor:default}
.small{font-size:13px;opacity:.85;margin-top:12px;line-height:1.7}
#hud{position:fixed;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;z-index:2;pointer-events:none}
.chip{background:rgba(40,24,10,.7);border:2px solid #e0b070;border-radius:12px;padding:5px 12px;font-family:'Lilita One';font-size:18px;pointer-events:auto}
.chip.b{cursor:pointer}
</style>
<script src="/assets/vendor/matter.min.js"></script>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud" class="hidden"><div class="chip b" id="menuB">☰ LEVELS</div><div class="chip" id="lvlC">LEVEL 1</div><div class="chip b" id="resetB">↺ RETRY</div></div>
<div class="ov" id="home"><div class="box">
  <h1>SIEGE<br>SMASH</h1>
  <div class="small" style="font-size:15px">Pull back to aim, let go to fire. Knock out every goblin to win!<br>Tap while a bomb or triple-shot is flying to use its power.</div>
  <div id="grid"></div>
  <div class="small" id="tot"></div>
</div></div>
<div class="ov hidden" id="res" style="background:radial-gradient(circle at 50% 35%,rgba(90,60,30,.75),rgba(30,18,8,.85))"><div class="box">
  <h1 id="rT" style="font-size:clamp(40px,11vw,76px)">CASTLE CRUSHED!</h1>
  <div id="rStars" style="font-size:60px;letter-spacing:8px;color:#ffd23f;filter:drop-shadow(0 0 10px #ffd23f)">★★★</div>
  <div class="small" id="rS" style="font-size:16px"></div>
  <button class="btn g" id="nextB">NEXT ▶</button><button class="btn" id="retryB">↺ RETRY</button><button class="btn" id="lvlB">LEVELS</button>
</div></div>
<script>
(()=>{
const {Engine,Bodies,Composite,Body,Events}=Matter;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');const $=id=>document.getElementById(id);
const WW=1600,WH=900,GY=840,PIV={x:190,y:690};
const MAT={wood:{d:0.0016,hp:70,c:'#c08040',c2:'#8a5424'},stone:{d:0.0032,hp:190,c:'#9aa0ac',c2:'#6a707c'},ice:{d:0.0012,hp:28,c:'rgba(170,230,255,.75)',c2:'#6ac8f0'},tnt:{d:0.0015,hp:18,c:'#e0302a',c2:'#7a1010'}};
const AMMO={boulder:{n:'Boulder',r:24,d:0.012,ic:'🪨'},bomb:{n:'Bomb',r:20,d:0.009,ic:'💣'},triple:{n:'Triple',r:17,d:0.01,ic:'🔱'},mega:{n:'Mega Rock',r:38,d:0.014,ic:'🌑'}};
// level helpers
function tower(L,x,floors,w,mat,opts={}){let y=GY-(opts.base||0);for(let f=0;f<floors;f++){const ph=opts.ph||90;L.push({t:'b',x:x-w/2+10,y:y-ph/2,w:20,h:ph,m:mat});L.push({t:'b',x:x+w/2-10,y:y-ph/2,w:20,h:ph,m:mat});if(opts.mid)L.push({t:'b',x,y:y-ph/2,w:20,h:ph,m:mat});
  if(!opts.noEnemy||f>0)L.push({t:'e',x:x+(opts.mid?w/4:0),y:y-24,r:22});if(opts.mid)L.push({t:'e',x:x-w/4,y:y-24,r:22});y-=ph;L.push({t:'b',x,y:y-10,w:w+20,h:20,m:opts.beam||mat});y-=20}
 if(opts.top)L.push({t:'e',x,y:y-26,r:opts.king?32:22,king:opts.king});return y}
const LEVELS=[
 {n:'First Castle',ammo:['boulder','boulder','boulder'],build:L=>{tower(L,1150,1,120,'wood',{top:1})}},
 {n:'Twin Towers',ammo:['boulder','boulder','boulder'],build:L=>{tower(L,1050,1,110,'wood');tower(L,1300,2,110,'wood')}},
 {n:'Stack Attack',ammo:['boulder','boulder','boulder','boulder'],build:L=>{tower(L,1200,3,130,'wood',{top:1})}},
 {n:'Rock Solid',ammo:['boulder','bomb','boulder'],build:L=>{tower(L,1150,2,140,'stone',{beam:'wood'});tower(L,1380,1,100,'ice',{top:1})}},
 {n:'Boom Box',ammo:['boulder','boulder'],build:L=>{tower(L,1150,2,160,'wood',{mid:1});L.push({t:'b',x:1150,y:GY-25,w:50,h:50,m:'tnt'});L.push({t:'b',x:1320,y:GY-25,w:50,h:50,m:'tnt'});L.push({t:'e',x:1400,y:GY-24,r:22})}},
 {n:'The Wide Wall',ammo:['boulder','bomb','boulder'],build:L=>{tower(L,1150,2,260,'wood',{mid:1,beam:'stone'});tower(L,1150,1,120,'ice',{base:220,top:1})}},
 {n:'Skyscraper',ammo:['triple','boulder','triple'],build:L=>{tower(L,1250,4,110,'stone',{beam:'wood',top:1,ph:80})}},
 {n:'Hilltop Fort',ammo:['boulder','bomb','triple'],build:L=>{L.push({t:'s',x:1250,y:GY-60,w:420,h:120});tower(L,1170,2,120,'wood',{base:120});tower(L,1340,2,120,'stone',{base:120,top:1})}},
 {n:'Ice Palace',ammo:['boulder','triple','boulder'],build:L=>{tower(L,1080,2,120,'ice');tower(L,1250,3,120,'ice',{top:1});tower(L,1420,2,120,'ice')}},
 {n:'Powder Keg',ammo:['bomb','boulder','boulder'],build:L=>{tower(L,1050,2,120,'stone');tower(L,1370,2,120,'stone');L.push({t:'b',x:1210,y:GY-240,w:420,h:20,m:'wood'});for(let i=0;i<3;i++)L.push({t:'b',x:1150+i*60,y:GY-25,w:46,h:46,m:'tnt'});L.push({t:'e',x:1210,y:GY-276,r:22})}},
 {n:'Stone Pyramid',ammo:['mega','bomb','boulder'],build:L=>{for(let row=0;row<4;row++){const n=4-row;for(let i=0;i<n;i++){const x=1250+(i-(n-1)/2)*80;L.push({t:'b',x,y:GY-35-row*70,w:70,h:70,m:row%2?'wood':'stone'})}}L.push({t:'e',x:1250,y:GY-300,r:22});L.push({t:'e',x:1420,y:GY-24,r:22});L.push({t:'e',x:1080,y:GY-24,r:22})}},
 {n:"The King's Keep",ammo:['mega','bomb','triple','boulder'],build:L=>{L.push({t:'s',x:1300,y:GY-40,w:500,h:80});tower(L,1110,2,110,'stone',{base:80});tower(L,1300,3,160,'stone',{base:80,beam:'wood',mid:1,top:1,king:1});tower(L,1480,2,120,'wood',{base:80});L.push({t:'b',x:1220,y:GY-105,w:40,h:40,m:'tnt'})}}
];
let sv={stars:{},best:0};try{const d=JSON.parse(localStorage.getItem('siegesmash_v1')||'null');if(d)sv=Object.assign(sv,d)}catch(e){}
function persist(){try{localStorage.setItem('siegesmash_v1',JSON.stringify(sv))}catch(e){}}
let AC=null;function snd(f,d=0.1,type='square',v=0.05,f2,noise){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const n=AC.currentTime,g=AC.createGain();g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(0.0008,n+d);
 if(noise){const len=Math.floor(AC.sampleRate*d),b=AC.createBuffer(1,len,AC.sampleRate),dd=b.getChannelData(0);for(let i=0;i<len;i++)dd[i]=(Math.random()*2-1)*(1-i/len);const s=AC.createBufferSource();s.buffer=b;const fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.value=f;s.connect(fl).connect(g).connect(AC.destination);s.start(n);return}
 const o=AC.createOscillator();o.type=type;o.frequency.setValueAtTime(f,n);if(f2)o.frequency.exponentialRampToValueAtTime(f2,n+d);o.connect(g).connect(AC.destination);o.start(n);o.stop(n+d+0.03)}catch(e){}}

let runTok=0,W,H,DPR,S=1,OX=0,OY=0,engine,world,li=0,ammo=[],proj=[],parts=[],texts=[],state='home',settleT=0,grace=0,armT=0,shotT=0,score=0,time=0,shake=0,aim=null,clouds=[],winT=-1;
function layout(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;S=Math.min(W/WW,H/WH);OX=(W-WW*S)/2;OY=(H-WH*S)/2;
 clouds=[];for(let i=0;i<7;i++)clouds.push({x:Math.random()*WW,y:60+Math.random()*260,s:0.6+Math.random()*0.8,v:5+Math.random()*10})}
addEventListener('resize',layout);
function loadLevel(i){
 li=i;runTok++;const lv=LEVELS[i];engine=Engine.create({gravity:{y:1},enableSleeping:true});engine.positionIterations=10;engine.velocityIterations=8;world=engine.world;
 Composite.add(world,[Bodies.rectangle(WW/2+300,GY+60,WW*3,120,{isStatic:true,label:'ground',friction:0.9})]);
 const L=[];lv.build(L);
 for(const o of L){let b;
  if(o.t==='b'){const m=MAT[o.m];b=Bodies.rectangle(o.x,o.y,o.w,o.h,{density:m.d,friction:0.8,restitution:0.05,label:'block'});b.mat=o.m;b.hp=m.hp*(o.w*o.h)/(20*90)*0.6+m.hp*0.4;b.maxHp=b.hp;b.w=o.w;b.h=o.h}
  else if(o.t==='s'){b=Bodies.rectangle(o.x,o.y,o.w,o.h,{isStatic:true,label:'hill',friction:0.9});b.w=o.w;b.h=o.h}
  else{b=Bodies.circle(o.x,o.y,o.r,{density:0.0012,friction:0.6,restitution:0.1,label:'enemy'});b.hp=o.king?90:26;b.maxHp=b.hp;b.r=o.r;b.king=o.king}
  Composite.add(world,b)}
 Events.on(engine,'collisionStart',onCollide);
 ammo=lv.ammo.slice();proj=[];parts=[];texts=[];settleT=0;grace=1.4;armT=0.4;score=0;winT=-1;state='aim';shotT=0;
 $('lvlC').textContent='LEVEL '+(i+1)+' · '+lv.n.toUpperCase();show(null);$('hud').classList.remove('hidden');
}
function bodies(){return Composite.allBodies(world)}
function enemiesLeft(){return bodies().filter(b=>b.label==='enemy'&&!b.dead).length}
function onCollide(ev){if(grace>0)return;
 for(const p of ev.pairs){const a=p.bodyA,b=p.bodyB;const rv=Math.hypot(a.velocity.x-b.velocity.x,a.velocity.y-b.velocity.y);if(rv<2.2)continue;
  const ma=a.isStatic?50:a.mass,mb=b.isStatic?50:b.mass;
  for(const [x,o,mo] of[[a,b,mb],[b,a,ma]]){if(x.isStatic||x.dead)continue;if(x.label!=='block'&&x.label!=='enemy')continue;let d=(rv-2.2)*Math.sqrt(Math.min(mo,30))*5;if(o.label==='proj')d*=1.6;if(x.label==='enemy')d*=1.4;hurt(x,d)}
  if((a.label==='proj'||b.label==='proj')&&rv>4){const pr=a.label==='proj'?a:b;if(!pr.hitOnce){pr.hitOnce=1;if(pr.kind==='bomb')pr.fuse=1.0}snd(90+Math.random()*40,0.12,'square',Math.min(0.08,rv/200),0,true)}}}
function hurt(b,d){if(d<=0||b.dead)return;b.hp-=d;b.flash=0.1;if(b.label==='block'&&d>8&&Math.random()<0.5)splinter(b,3);
 if(b.hp<=0){b.dead=true;
  if(b.label==='enemy'){score+=b.king?3000:1000;texts.push({x:b.position.x,y:b.position.y-30,t:b.king?'+3000 KING DOWN!':'+1000',col:'#9dff3f',life:0,big:1});puff(b.position.x,b.position.y,'#7ad84a',24);snd(500,0.2,'square',0.05,150);setTimeout(()=>{if(world)Composite.remove(world,b)},10)}
  else{score+=b.mat==='stone'?300:b.mat==='tnt'?500:150;splinter(b,12);texts.push({x:b.position.x,y:b.position.y,t:'+'+(b.mat==='stone'?300:150),col:'#fff',life:0});
   if(b.mat==='tnt'){explode(b.position.x,b.position.y,170,0.9)}setTimeout(()=>{if(world)Composite.remove(world,b)},10);snd(b.mat==='ice'?1400:b.mat==='stone'?140:260,0.18,b.mat==='ice'?'triangle':'square',0.05,0,b.mat!=='ice')}}}
function explode(x,y,R,pow){shake=16;snd(60,0.7,'sawtooth',0.1,30);snd(400,0.6,'square',0.08,0,true);parts.push({x,y,vx:0,vy:0,life:0,max:0.35,col:'#fff6b0',ring:R,flash:1});
 for(let i=0;i<36;i++){const a=Math.random()*6.283,v=3+Math.random()*9;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:0,max:0.7,col:i%3?'#ff9a1a':'#ffd23f',r:5,g:0.2})}
 for(let i=0;i<8;i++)parts.push({x:x+(Math.random()-0.5)*R*0.6,y:y+(Math.random()-0.5)*R*0.6,vx:(Math.random()-0.5),vy:-1,life:0,max:1.6,col:'rgba(70,60,50,.55)',r:R*0.3,smoke:1});
 for(const b of bodies()){if(b.isStatic||b.dead)continue;const dx=b.position.x-x,dy=b.position.y-y,d=Math.hypot(dx,dy);if(d>R)continue;const k=(1-d/R);Body.setVelocity(b,{x:b.velocity.x+dx/(d||1)*k*18*pow,y:b.velocity.y+dy/(d||1)*k*18*pow-k*4});Body.setAngularVelocity(b,b.angularVelocity+(Math.random()-0.5)*0.3*k);if(b.label!=='proj')hurt(b,k*170*pow)}}
function splinter(b,n){const m=MAT[b.mat]||MAT.wood;for(let i=0;i<n;i++){const a=Math.random()*6.283,v=1+Math.random()*4;parts.push({x:b.position.x+(Math.random()-0.5)*b.w*0.6,y:b.position.y+(Math.random()-0.5)*b.h*0.6,vx:Math.cos(a)*v,vy:Math.sin(a)*v-2,life:0,max:0.8+Math.random()*0.5,col:Math.random()<0.5?m.c:m.c2,r:3+Math.random()*4,g:0.25,sq:1,rot:Math.random()*6})}}
function puff(x,y,col,n){for(let i=0;i<n;i++){const a=Math.random()*6.283,v=1+Math.random()*5;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:0,max:0.6,col:Math.random()<0.5?col:'#fff',r:4,g:0.1})}}
function launch(vx,vy){const k=ammo.shift();const A=AMMO[k];const b=Bodies.circle(PIV.x,PIV.y,A.r,{density:A.d,friction:0.5,restitution:0.25,frictionAir:0.002,label:'proj'});b.kind=k;b.r=A.r;Body.setVelocity(b,{x:vx,y:vy});Composite.add(world,b);proj.push(b);state='fly';settleT=0;armT=0.35;shotT=0;snd(180,0.3,'sawtooth',0.06,500);armAnim=1}
let armAnim=0;
function ability(){const p=proj.find(b=>!b.used&&!b.hitOnce&&(b.kind==='bomb'||b.kind==='triple')&&Composite.get(world,b.id,'body'));if(!p)return false;p.used=1;
 if(p.kind==='bomb'){explode(p.position.x,p.position.y,160,1);Composite.remove(world,p);proj=proj.filter(x=>x!==p);return true}
 for(const off of[-0.25,0.25]){const v=p.velocity,sp=Math.hypot(v.x,v.y),a=Math.atan2(v.y,v.x)+off;const b=Bodies.circle(p.position.x,p.position.y,p.r,{density:AMMO.triple.d,friction:0.5,restitution:0.25,frictionAir:0.002,label:'proj'});b.kind='rock';b.r=p.r;b.used=1;Body.setVelocity(b,{x:Math.cos(a)*sp,y:Math.sin(a)*sp});Composite.add(world,b);proj.push(b)}
 puff(p.position.x,p.position.y,'#ffd23f',12);snd(900,0.15,'square',0.05,1400);return true}
// input
function toW(cx,cy){return[(cx-OX)/S,(cy-OY)/S]}
let pd=null;
cv.addEventListener('pointerdown',e=>{if(state==='fly'){if(ability())return}if(state!=='aim'||!ammo.length||armT>0)return;pd={sx:e.clientX,sy:e.clientY};cv.setPointerCapture(e.pointerId);snd(1,0.01,'sine',0.0001)});
cv.addEventListener('pointermove',e=>{if(!pd)return;const dx=(pd.sx-e.clientX)/S,dy=(pd.sy-e.clientY)/S,l=Math.hypot(dx,dy);const pw=Math.min(1,l/260);aim=pw>0.05?{vx:dx/l*pw*30,vy:dy/l*pw*30,pw}:null});
cv.addEventListener('pointerup',()=>{if(pd&&aim&&state==='aim')launch(aim.vx,aim.vy);pd=null;aim=null});
cv.addEventListener('pointercancel',()=>{pd=null;aim=null});
addEventListener('keydown',e=>{if(e.code==='Space'&&state==='fly'){ability();e.preventDefault()}if(e.code==='KeyR'&&(state==='aim'||state==='fly'||state==='settle'))loadLevel(li)});

function step(dt){
 grace=Math.max(0,grace-dt);armT=Math.max(0,armT-dt);armAnim=Math.max(0,armAnim-dt*2.5);
 Engine.update(engine,1000/60);
 for(const b of bodies()){if(b.isStatic)continue;if(b.position.y>WH+300||b.position.x>WW+500||b.position.x<-400){if(b.label==='enemy'&&!b.dead){b.hp=0;hurt(b,1)}Composite.remove(world,b);proj=proj.filter(x=>x!==b)}}
 for(const p of proj){if(p.fuse!==undefined&&!p.used){p.fuse-=dt;if(p.fuse<=0){p.used=1;explode(p.position.x,p.position.y,160,1);Composite.remove(world,p)}}}
 if(state==='fly'||state==='settle'){shotT+=dt;const moving=bodies().some(b=>!b.isStatic&&!b.isSleeping&&Math.hypot(b.velocity.x,b.velocity.y)>0.25);if(!moving)settleT+=dt;else settleT=0;
  if((settleT>0.6||shotT>9)&&shotT>1.2){proj.forEach(p=>{if(Composite.get(world,p.id,'body'))Composite.remove(world,p)});proj=[];
   if(enemiesLeft()===0)win();else if(!ammo.length)lose();else{state='aim';armT=0.2}}}
 if(enemiesLeft()===0&&winT<0&&state!=='done'){winT=1.4}
 if(winT>0){winT-=dt;if(winT<=0&&state!=='done')win()}
}
function win(){if(state==='done')return;state='done';const bonus=ammo.length*1500;score+=bonus;const st=ammo.length>=2?3:ammo.length===1?2:1;const prev=sv.stars[li]||0;if(st>prev)sv.stars[li]=st;persist();
 $('rT').textContent='CASTLE CRUSHED!';$('rT').style.color='#ffd23f';$('rStars').textContent='★'.repeat(st)+'☆'.repeat(3-st);$('rS').innerHTML=`Score <b>${score}</b>${bonus?` (includes +${bonus} for unused shots)`:''}`;$('nextB').style.display=li<LEVELS.length-1?'inline-block':'none';
 snd(523,0.12,'square',0.06);setTimeout(()=>snd(659,0.12,'square',0.06),120);setTimeout(()=>snd(784,0.3,'square',0.06),240);const tk=runTok;setTimeout(()=>{if(tk===runTok&&state==='done')show('res')},700)}
function lose(){state='done';$('rT').textContent='OUT OF AMMO!';$('rT').style.color='#ff8a7a';$('rStars').textContent='☆☆☆';$('rS').innerHTML=`${enemiesLeft()} goblin${enemiesLeft()>1?'s':''} survived. Try a different angle!`;$('nextB').style.display='none';snd(200,0.5,'sawtooth',0.06,80);const tk=runTok;setTimeout(()=>{if(tk===runTok&&state==='done')show('res')},500)}

// render
function poly(b){ctx.beginPath();const v=b.vertices;ctx.moveTo(v[0].x,v[0].y);for(let i=1;i<v.length;i++)ctx.lineTo(v[i].x,v[i].y);ctx.closePath()}
function drawBlock(b){const m=MAT[b.mat];ctx.save();ctx.translate(b.position.x,b.position.y);ctx.rotate(b.angle);const w=b.w,h=b.h;
 ctx.fillStyle=b.flash>0?'#fff':m.c;ctx.strokeStyle='rgba(30,15,5,.75)';ctx.lineWidth=2.5;ctx.fillRect(-w/2,-h/2,w,h);ctx.strokeRect(-w/2,-h/2,w,h);
 if(b.mat==='wood'){ctx.strokeStyle='rgba(90,50,20,.45)';ctx.lineWidth=1.5;const long=w>h;for(let i=1;i<4;i++){ctx.beginPath();if(long){ctx.moveTo(-w/2+4,-h/2+i*h/4);ctx.lineTo(w/2-4,-h/2+i*h/4)}else{ctx.moveTo(-w/2+i*w/4,-h/2+4);ctx.lineTo(-w/2+i*w/4,h/2-4)}ctx.stroke()}}
 else if(b.mat==='stone'){ctx.strokeStyle='rgba(40,40,50,.35)';ctx.lineWidth=1.5;for(let y=-h/2+18;y<h/2;y+=18){ctx.beginPath();ctx.moveTo(-w/2,y);ctx.lineTo(w/2,y);ctx.stroke()}ctx.fillStyle='rgba(255,255,255,.18)';ctx.fillRect(-w/2,-h/2,w,3)}
 else if(b.mat==='ice'){ctx.fillStyle='rgba(255,255,255,.45)';ctx.beginPath();ctx.moveTo(-w/2+3,-h/2+3);ctx.lineTo(-w/2+w*0.35,-h/2+3);ctx.lineTo(-w/2+3,-h/2+h*0.35);ctx.fill()}
 else if(b.mat==='tnt'){ctx.fillStyle='#fff';ctx.font=`bold ${Math.min(w,h)*0.36}px Lilita One`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('TNT',0,1);ctx.strokeStyle='#7a1010';ctx.strokeRect(-w/2+4,-h/2+4,w-8,h-8)}
 const dmg=1-b.hp/b.maxHp;if(dmg>0.25){ctx.strokeStyle='rgba(20,10,0,.65)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-w*0.3,-h/2);ctx.lineTo(-w*0.05,-h*0.1);ctx.lineTo(-w*0.2,h*0.2);if(dmg>0.6){ctx.moveTo(w*0.35,h/2);ctx.lineTo(w*0.1,h*0.05);ctx.lineTo(w*0.25,-h*0.25)}ctx.stroke()}
 ctx.restore()}
function drawEnemy(b){const r=b.r;ctx.save();ctx.translate(b.position.x,b.position.y);ctx.rotate(b.angle);
 const g=ctx.createRadialGradient(-r*0.3,-r*0.3,r*0.1,0,0,r);g.addColorStop(0,b.flash>0?'#fff':'#b8ff8a');g.addColorStop(1,b.flash>0?'#fff':'#3a9a2a');ctx.fillStyle=g;ctx.strokeStyle='#1a3a10';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(0,0,r,0,6.283);ctx.fill();ctx.stroke();
 ctx.fillStyle='#7ad84a';for(const s of[-1,1]){ctx.beginPath();ctx.moveTo(s*r*0.7,-r*0.2);ctx.lineTo(s*r*1.35,-r*0.55);ctx.lineTo(s*r*0.85,r*0.15);ctx.fill();ctx.stroke()}
 if(b.king){ctx.fillStyle='#ffd23f';ctx.beginPath();ctx.moveTo(-r*0.6,-r*0.7);ctx.lineTo(-r*0.6,-r*1.25);ctx.lineTo(-r*0.3,-r*0.95);ctx.lineTo(0,-r*1.35);ctx.lineTo(r*0.3,-r*0.95);ctx.lineTo(r*0.6,-r*1.25);ctx.lineTo(r*0.6,-r*0.7);ctx.closePath();ctx.fill();ctx.stroke()}
 else{ctx.fillStyle='#8a909c';ctx.beginPath();ctx.arc(0,-r*0.35,r*0.75,Math.PI,0);ctx.fill();ctx.stroke()}
 const hurtLook=b.hp<b.maxHp*0.6;for(const s of[-1,1]){ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s*r*0.32,-r*0.05,r*0.22,0,6.283);ctx.fill();ctx.fillStyle='#000';if(hurtLook){ctx.strokeStyle='#000';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(s*r*0.32-4,-r*0.05-4);ctx.lineTo(s*r*0.32+4,-r*0.05+4);ctx.moveTo(s*r*0.32+4,-r*0.05-4);ctx.lineTo(s*r*0.32-4,-r*0.05+4);ctx.stroke()}else{ctx.beginPath();ctx.arc(s*r*0.32+Math.sin(time*2)*2,-r*0.05,r*0.1,0,6.283);ctx.fill()}}
 ctx.strokeStyle='#1a3a10';ctx.lineWidth=2.5;ctx.beginPath();if(hurtLook)ctx.arc(0,r*0.5,r*0.25,Math.PI*1.15,Math.PI*1.85);else ctx.arc(0,r*0.3,r*0.28,0.2,Math.PI-0.2);ctx.stroke();
 ctx.restore()}
function drawProj(b){const r=b.r;ctx.save();ctx.translate(b.position.x,b.position.y);ctx.rotate(b.angle);
 if(b.kind==='bomb'){ctx.fillStyle='#2a2a3a';ctx.beginPath();ctx.arc(0,0,r,0,6.283);ctx.fill();ctx.fillStyle='rgba(255,255,255,.25)';ctx.beginPath();ctx.arc(-r*0.3,-r*0.3,r*0.3,0,6.283);ctx.fill();ctx.fillStyle='#6a6a7a';ctx.fillRect(-4,-r-6,8,8);ctx.fillStyle=Math.sin(time*30)>0?'#ffd23f':'#ff5a1a';ctx.beginPath();ctx.arc(0,-r-9,4,0,6.283);ctx.fill()}
 else{const g=ctx.createRadialGradient(-r*0.3,-r*0.3,r*0.1,0,0,r);g.addColorStop(0,b.kind==='triple'||b.kind==='rock'?'#ffe9a0':'#c8c0b0');g.addColorStop(1,b.kind==='triple'||b.kind==='rock'?'#c08a20':'#5a5448');ctx.fillStyle=g;ctx.beginPath();for(let i=0;i<9;i++){const a=i/9*6.283,rr=r*(0.88+((i*37)%7)/50);ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}ctx.closePath();ctx.fill();ctx.strokeStyle='rgba(0,0,0,.35)';ctx.lineWidth=2;ctx.stroke()}
 ctx.restore()}
function drawCatapult(){const x=PIV.x,y=GY;ctx.save();
 ctx.fillStyle='#6a4220';ctx.strokeStyle='#2a1808';ctx.lineWidth=3;ctx.fillRect(x-70,y-36,150,22);ctx.strokeRect(x-70,y-36,150,22);
 for(const wx of[x-50,x+60]){ctx.fillStyle='#4a2e14';ctx.beginPath();ctx.arc(wx,y-12,16,0,6.283);ctx.fill();ctx.stroke();ctx.fillStyle='#8a6a40';ctx.beginPath();ctx.arc(wx,y-12,5,0,6.283);ctx.fill()}
 ctx.fillStyle='#8a5a2a';ctx.beginPath();ctx.moveTo(x-10,y-36);ctx.lineTo(x+8,y-130);ctx.lineTo(x+26,y-36);ctx.closePath();ctx.fill();ctx.stroke();
 const pull=aim?aim.pw:0;const ang=armAnim>0?-1.2+armAnim*0.9:-0.35-pull*0.9;
 ctx.translate(x+8,y-120);ctx.rotate(ang);ctx.fillStyle='#a06a34';ctx.fillRect(-90,-7,150,14);ctx.strokeRect(-90,-7,150,14);ctx.fillStyle='#5a3a1a';ctx.beginPath();ctx.ellipse(-92,-10,22,12,0,0,6.283);ctx.fill();ctx.stroke();
 ctx.restore();
 // loaded ammo
 if(state==='aim'&&ammo.length){const A=AMMO[ammo[0]];const ax=PIV.x-(aim?aim.vx/30*40:0),ay=PIV.y-(aim?aim.vy/30*40:0);drawProj({kind:ammo[0],r:A.r,position:{x:ax,y:ay},angle:0})}}
function render(){
 ctx.setTransform(DPR,0,0,DPR,0,0);const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#5ab8ff');sky.addColorStop(1,'#cdeeff');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
 if(!world)return;
 const sx=(Math.random()-0.5)*shake,sy=(Math.random()-0.5)*shake;ctx.setTransform(S*DPR,0,0,S*DPR,(OX+sx)*DPR,(OY+sy)*DPR);
 ctx.fillStyle='rgba(255,255,220,.9)';ctx.beginPath();ctx.arc(1380,140,60,0,6.283);ctx.fill();
 for(const c of clouds){c.x+=c.v*0.016;if(c.x>WW+200)c.x=-200;ctx.fillStyle='rgba(255,255,255,.85)';for(const [ox,oy,r] of[[0,0,40],[40,-10,50],[85,0,38],[40,15,40]]){ctx.beginPath();ctx.arc(c.x+ox*c.s,c.y+oy*c.s,r*c.s,0,6.283);ctx.fill()}}
 ctx.fillStyle='#7ac85a';ctx.beginPath();ctx.moveTo(-300,GY);for(let x=-300;x<=WW+300;x+=60)ctx.lineTo(x,GY-120-Math.sin(x*0.004)*60-Math.sin(x*0.011)*25);ctx.lineTo(WW+300,GY);ctx.fill();
 ctx.fillStyle='#5aa83a';ctx.beginPath();ctx.moveTo(-300,GY);for(let x=-300;x<=WW+300;x+=50)ctx.lineTo(x,GY-50-Math.sin(x*0.007+1)*30);ctx.lineTo(WW+300,GY);ctx.fill();
 ctx.fillStyle='#6a4a2a';ctx.fillRect(-400,GY,WW+800,200);ctx.fillStyle='#4caf3a';ctx.fillRect(-400,GY,WW+800,14);
 for(const b of bodies()){if(b.label==='hill'){ctx.fillStyle='#7a5a3a';poly(b);ctx.fill();ctx.fillStyle='#4caf3a';ctx.fillRect(b.position.x-b.w/2,b.position.y-b.h/2,b.w,12)}}
 drawCatapult();
 // aim preview
 if(aim){let x=PIV.x,y=PIV.y,vx=aim.vx,vy=aim.vy;ctx.fillStyle='#fff';for(let i=0;i<70;i++){vy+=0.2778*1;vx*=0.998;vy*=0.998;x+=vx;y+=vy;if(i%3===0){ctx.globalAlpha=1-i/70;ctx.beginPath();ctx.arc(x,y,5-i/20,0,6.283);ctx.fill()}if(y>GY)break}ctx.globalAlpha=1;
  ctx.font="22px Lilita One";ctx.fillStyle='#fff';ctx.textAlign='center';ctx.fillText(Math.round(aim.pw*100)+'%',PIV.x,PIV.y-60)}
 for(const b of bodies()){if(b.label==='block')drawBlock(b);else if(b.label==='enemy')drawEnemy(b);else if(b.label==='proj')drawProj(b);if(b.flash>0)b.flash-=0.016}
 for(const p of parts){const a=1-p.life/p.max;ctx.globalAlpha=Math.max(0,p.smoke?a*0.7:a);if(p.ring){ctx.strokeStyle=p.col;ctx.lineWidth=8*a;ctx.beginPath();ctx.arc(p.x,p.y,p.ring*(1.2-a*0.7),0,6.283);ctx.stroke();if(p.flash&&a>0.7){ctx.fillStyle='rgba(255,250,220,.6)';ctx.beginPath();ctx.arc(p.x,p.y,p.ring*0.6,0,6.283);ctx.fill()}}else if(p.sq){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot+p.life*8);ctx.fillStyle=p.col;ctx.fillRect(-p.r,-p.r/2,p.r*2,p.r);ctx.restore()}else{ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.smoke?p.r*(1.5-a):p.r*a+1,0,6.283);ctx.fill()}}
 ctx.globalAlpha=1;
 ctx.textAlign='center';for(const t of texts){const a=1-t.life/1.2;ctx.globalAlpha=Math.max(0,a);ctx.font=`${t.big?38:24}px Lilita One`;ctx.lineWidth=5;ctx.strokeStyle='#2a1808';ctx.strokeText(t.t,t.x,t.y-t.life*50);ctx.fillStyle=t.col;ctx.fillText(t.t,t.x,t.y-t.life*50)}ctx.globalAlpha=1;
 // ammo bar & score
 ctx.font="22px Lilita One";ctx.textAlign='left';ctx.fillStyle='#fff';ctx.strokeStyle='#2a1808';ctx.lineWidth=5;ctx.strokeText('AMMO',30,GY+50);ctx.fillText('AMMO',30,GY+50);
 ammo.forEach((k,i)=>{ctx.font='30px sans-serif';ctx.fillText(AMMO[k].ic,110+i*44,GY+54)});
 ctx.font="24px Lilita One";ctx.textAlign='right';ctx.strokeText('SCORE '+score,WW-30,GY+50);ctx.fillText('SCORE '+score,WW-30,GY+50);
 ctx.textAlign='center';ctx.font="22px Lilita One";const el=enemiesLeft();ctx.strokeText('👺 '+el+' left',WW/2,GY+50);ctx.fillText('👺 '+el+' left',WW/2,GY+50);
 if(state==='aim'&&!aim&&ammo.length){ctx.globalAlpha=0.6+0.4*Math.sin(time*4);const nm=AMMO[ammo[0]].n;ctx.font="24px Lilita One";ctx.strokeText('Pull back anywhere to aim your '+nm,WW/2,110);ctx.fillText('Pull back anywhere to aim your '+nm,WW/2,110);if(ammo[0]==='bomb'||ammo[0]==='triple'){ctx.font="18px Nunito";const t2=ammo[0]==='bomb'?'Tap while it flies to explode early!':'Tap while it flies to split into 3!';ctx.strokeText(t2,WW/2,140);ctx.fillText(t2,WW/2,140)}ctx.globalAlpha=1}
 if(H>W*1.1){ctx.setTransform(DPR,0,0,DPR,0,0);ctx.font="14px Nunito";ctx.fillStyle='#2a1808';ctx.textAlign='center';ctx.fillText('Tip: turn your device sideways for a bigger view',W/2,OY+WH*S+24)}
}
const OVS=['home','res'];function show(id){for(const o of OVS)$(o).classList.toggle('hidden',o!==id);if(id){$('hud').classList.add('hidden')}if(id==='home'){state='home';refreshHome()}}
function refreshHome(){const g=$('grid');g.innerHTML='';const unlocked=i=>i===0||(sv.stars[i-1]||0)>0;let tot=0;
 LEVELS.forEach((lv,i)=>{const st=sv.stars[i]||0;tot+=st;const d=document.createElement('div');d.className='lv'+(unlocked(i)?'':' lock');d.innerHTML=`${unlocked(i)?i+1:'🔒'}<small>${lv.n}</small><div class="st">${'★'.repeat(st)}${'☆'.repeat(3-st)}</div>`;if(unlocked(i))d.onclick=()=>loadLevel(i);g.appendChild(d)});
 $('tot').textContent=`★ ${tot} / ${LEVELS.length*3} stars`}
$('menuB').onclick=()=>{world=null;show('home')};$('resetB').onclick=()=>loadLevel(li);$('nextB').onclick=()=>loadLevel(li+1);$('retryB').onclick=()=>loadLevel(li);$('lvlB').onclick=()=>{world=null;show('home')};
refreshHome();
let last=performance.now(),acc=0;
function frame(now){const dt=Math.min(0.05,(now-last)/1000);last=now;time+=dt;
 if(world&&state!=='home'){acc+=dt;let n=0;while(acc>=1/60&&n<4){acc-=1/60;n++;if(state!=='done')step(1/60);else Engine.update(engine,1000/60)}}
 for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life+=dt;if(p.life>p.max){parts.splice(i,1);continue}p.x+=p.vx;p.y+=p.vy;if(p.g)p.vy+=p.g;p.vx*=0.98}
 for(let i=texts.length-1;i>=0;i--){texts[i].life+=dt;if(texts[i].life>1.2)texts.splice(i,1)}
 shake=Math.max(0,shake-dt*30);render();requestAnimationFrame(frame)}
layout();requestAnimationFrame(t=>{last=t;frame(t)});
})();
