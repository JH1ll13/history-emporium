<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Dungeon Dash</title>
<link rel="stylesheet" href="/assets/fonts.css">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#07040d;color:#fff;font-family:'Press Start 2P',monospace;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5;background:radial-gradient(ellipse at center,rgba(40,15,70,.82),rgba(5,2,12,.95));text-align:center;padding:16px;box-sizing:border-box;overflow:auto}
.hidden{display:none!important}
h1{font-size:clamp(26px,8vw,58px);margin:0 0 8px;line-height:1.15;color:#ffd23f;text-shadow:0 4px 0 #b3400f,0 8px 0 #4a1206,0 0 30px #ff8a3c88;letter-spacing:2px;animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.sub{font-size:10px;color:#b9a7ff;margin-bottom:22px;line-height:1.8}
.pbtn{font-family:'Press Start 2P',monospace;font-size:14px;color:#fff;background:#e0384f;border:none;padding:14px 22px;margin:6px;cursor:pointer;box-shadow:0 0 0 3px #1b1028,0 6px 0 3px #1b1028,inset 0 -5px 0 #8f1830,inset 0 3px 0 #ff8a9a;image-rendering:pixelated}
.pbtn:active{transform:translateY(4px);box-shadow:0 0 0 3px #1b1028,0 2px 0 3px #1b1028,inset 0 -3px 0 #8f1830}
.pbtn.alt{background:#5b46d9;box-shadow:0 0 0 3px #1b1028,0 6px 0 3px #1b1028,inset 0 -5px 0 #2f2190,inset 0 3px 0 #9d8bff}
.pbtn.dis{filter:grayscale(1) brightness(.6)}
.gold{color:#ffd23f}
.small{font-size:9px;line-height:1.9;color:#cfc6ff;opacity:.85;margin-top:16px}
#cards{display:flex;align-items:stretch;gap:12px;flex-wrap:wrap;justify-content:center;max-width:760px}
.card{width:200px;min-height:210px;background:#1d1433;border:4px solid #555;padding:14px 10px;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:10px;transition:transform .12s;animation:pop .35s cubic-bezier(.2,1.6,.4,1) backwards;position:relative}
.card:hover{transform:translateY(-6px) scale(1.03)}
.card .ic{font-size:40px;filter:drop-shadow(0 4px 0 #0008)}
.card .nm{font-size:12px;line-height:1.5}
.card .ds{font-size:8px;line-height:1.9;color:#ddd}
.card .rt{font-size:8px;padding:4px 6px;background:#0006}
.card .key{position:absolute;top:6px;left:8px;font-size:8px;opacity:.6}
.common{border-color:#8aa0c8}.common .rt{color:#8aa0c8}
.rare{border-color:#3ea6ff;box-shadow:0 0 18px #3ea6ff55}.rare .rt{color:#3ea6ff}
.epic{border-color:#b45cff;box-shadow:0 0 22px #b45cff77}.epic .rt{color:#d49bff}
.legendary{border-color:#ffd23f;box-shadow:0 0 30px #ffd23faa;animation:pop .35s cubic-bezier(.2,1.6,.4,1) backwards,glow 1s ease-in-out infinite alternate}.legendary .rt{color:#ffd23f}
@keyframes glow{to{box-shadow:0 0 45px #ffd23f}}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.card:nth-child(2){animation-delay:.08s}.card:nth-child(3){animation-delay:.16s}
@media(max-width:520px){#cards{flex-direction:column;align-items:center}.card{width:min(88vw,330px);min-height:0;flex-direction:row;text-align:left;gap:12px}.card .ic{font-size:34px}.card .txt{display:flex;flex-direction:column;gap:6px}.card .key{display:none}}
.shopRow{display:flex;align-items:center;justify-content:space-between;gap:10px;width:min(92vw,440px);background:#1d1433;border:3px solid #3a2a63;padding:10px;margin:5px 0;box-sizing:border-box;text-align:left}
.shopRow .ic{font-size:26px}
.shopRow .tx{flex:1;font-size:9px;line-height:1.8}
.shopRow .tx b{font-size:10px;color:#ffd23f;font-weight:normal}
.shopRow button{font-size:9px;padding:10px 8px;margin:0;min-width:84px}
.pips{color:#5ff7ff;letter-spacing:2px}
#dashB{position:fixed;right:18px;bottom:calc(22px + env(safe-area-inset-bottom));width:78px;height:78px;border-radius:50%;background:rgba(95,247,255,.18);border:3px solid rgba(95,247,255,.7);z-index:3;font-family:'Press Start 2P';font-size:9px;color:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px}
#pauseB{position:fixed;top:10px;right:10px;z-index:3;font-family:'Press Start 2P';font-size:12px;background:rgba(0,0,0,.5);border:2px solid #fff4;color:#fff;padding:8px 10px;cursor:pointer}
#ups{position:fixed;left:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:3;display:flex;flex-wrap:wrap;gap:4px;max-width:55vw;pointer-events:none}
#ups span{background:rgba(0,0,0,.55);border:2px solid #fff3;padding:3px 4px;font-size:14px;position:relative}
#ups span i{position:absolute;right:-2px;bottom:-4px;font-style:normal;font-size:7px;color:#ffd23f;text-shadow:1px 1px 0 #000}
.stat{font-size:11px;line-height:2.2}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="pauseB" class="hidden">II</button>
<div id="dashB" class="hidden"><span>DASH</span><span id="dashK" style="font-size:7px;opacity:.7"></span></div>
<div id="ups" class="hidden"></div>

<div class="ov" id="title">
  <h1>DUNGEON<br>DASH</h1>
  <div class="sub">Clear rooms · Grab power-ups · Beat the Bone King</div>
  <button class="pbtn" id="playB">▶ PLAY</button>
  <button class="pbtn alt" id="shopB">⬆ UPGRADES</button>
  <div class="small"><span class="gold" id="tGold">0</span> gold · Best: room <span id="tBest">0</span><br><span id="ctrlHint"></span></div>
</div>
<div class="ov hidden" id="shop">
  <h1 style="font-size:clamp(20px,6vw,36px)">UPGRADES</h1>
  <div class="sub">Gold: <span class="gold" id="sGold">0</span> · These last forever</div>
  <div id="shopList"></div>
  <button class="pbtn" id="shopBack">◀ BACK</button>
</div>
<div class="ov hidden" id="pick">
  <h1 style="font-size:clamp(18px,5.5vw,34px)" id="pickT">CHOOSE A POWER</h1>
  <div class="sub" id="pickS">Room cleared!</div>
  <div id="cards"></div>
</div>
<div class="ov hidden" id="over">
  <h1 style="font-size:clamp(22px,7vw,46px);color:#ff3b5c;text-shadow:0 4px 0 #6b0a1c,0 0 30px #ff3b5c88">YOU FELL</h1>
  <div class="stat" id="oStats"></div>
  <div><button class="pbtn" id="againB">↻ TRY AGAIN</button><button class="pbtn alt" id="oShopB">⬆ UPGRADES</button></div>
</div>
<div class="ov hidden" id="pauseO">
  <h1 style="font-size:clamp(22px,7vw,40px)">PAUSED</h1>
  <button class="pbtn" id="resumeB">▶ RESUME</button>
  <button class="pbtn alt" id="quitB">✖ QUIT RUN</button>
  <button class="pbtn alt" id="muteB">SOUND: ON</button>
</div>

<script>
(()=>{
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
const TILE=16;
const isTouch=('ontouchstart' in window)||navigator.maxTouchPoints>0;
$('ctrlHint').textContent=isTouch?'Drag anywhere to move · You shoot automatically · Tap DASH to dodge':'WASD / Arrows to move · Auto-aim shooting · SPACE to dash';
$('dashK').textContent=isTouch?'':'SPACE';

// ---------- sprites ----------
const PAL={k:'#1b1028',s:'#8f9cc0',l:'#e3eaff',v:'#5ff7ff',r:'#ff3b5c',b:'#6b4428',g:'#5fe36a',G:'#c7ffb0',w:'#efeadb',W:'#ffffff',p:'#7b4bd1',P:'#b48cff',y:'#ffd23f',Y:'#fff6b0',o:'#e8d9b0',h:'#3f9a3f',H:'#8be07a',e:'#ff2030',c:'#3ea6ff'};
const MAPS={
 knight:["...rr...","..rrr...",".kkkkkk.","ksllsssk","kvvvvvvk","kssssssk",".kclcck.","kcclllck",".kb..bk.",".kk..kk."],
 knight2:["...rr...","..rrr...",".kkkkkk.","ksllsssk","kvvvvvvk","kssssssk",".kclcck.","kcclllck","..kbkb..","..kkkk.."],
 slime:["...kkk....","..kGgGkk..",".kgGggggk.","kggWkgWkgk","kggkkgkkgk","kgggggggGk","kggggggggk",".kkkkkkkk."],
 bat:["k.........k","kk..kkk..kk","kpk.kPk.kpk","kppkPPPkppk",".kpeePeepk.","..kpPPPpk..","...kk.kk..."],
 bat2:[".....k.....","....kPk....","...kPPPk...","..kpeePepk.",".kppPPPppk.","kppk...kppk","kk.......kk"],
 skel:["..kkkk..",".kwwwwk.",".kwewek.",".kwwwwk.","..kwkk..",".kkwwkk.","kwkwwkwk","k.kwwk.k","..kwwk..",".kw..wk.",".kk..kk."],
 brute:["..k........k..",".kok......kok.",".kook....kook.","..kkkkkkkkkk..",".khhhhhhhhhhk.","khhHhhhhhhHhhk","khheehhhheehhk","khhhhhhhhhhhhk","khwkwkwkwkwkhk","khhhhhhhhhhhhk",".khhhhhhhhhhk.",".khhk....khhk.",".kkkk....kkkk."],
 boss:["...y..y..y...","...yyyyyyy...","..kkkkkkkkk..",".kwwwwwwwwwk.","kwwwwwwwwwwwk","kwwkkkwkkkwwk","kwwkeekweekwk","kwwkkkwkkkwwk","kwwwwwkwwwwwk",".kwwwkkkwwwk.","..kwkwkwkwk..","..kwwwwwwwk..","...kkkkkkk...",".kwk.kwk.kwk.","kwwwkwwwkwwwk",".kkk.kkk.kkk."],
 coin:[".yy.","yYyy","yyyy",".yy."],
 heart:[".kk.kk.","krrkrrk","krWrrrk","krrrrrk",".krrrk.","..krk..","...k..."],
 heartE:[".kk.kk.","kddkddk","kdddddk","kdddddk",".kdddk.","..kdk..","...k..."]
};
PAL.d='#3a2a52';
function mk(map,white){const h=map.length,w=Math.max(...map.map(r=>r.length));const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');
 for(let y=0;y<h;y++)for(let x=0;x<map[y].length;x++){const ch=map[y][x];if(ch==='.'||ch===' ')continue;g.fillStyle=white?(ch==='k'?'#ffffff':'#ffffff'):PAL[ch];g.fillRect(x,y,1,1)}return c}
const SPR={},SPRW={};for(const k in MAPS){SPR[k]=mk(MAPS[k]);SPRW[k]=mk(MAPS[k],true)}

// ---------- audio ----------
let AC=null,muted=false;try{muted=localStorage.getItem('dd_mute')==='1'}catch(e){}
function snd(f,d=0.1,type='square',v=0.05,f2,noise){
 if(muted)return;try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const n=AC.currentTime,g=AC.createGain();g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(0.0008,n+d);
 if(noise){const len=AC.sampleRate*d,buf=AC.createBuffer(1,len,AC.sampleRate),dd=buf.getChannelData(0);for(let i=0;i<len;i++)dd[i]=(Math.random()*2-1)*(1-i/len);const src=AC.createBufferSource();src.buffer=buf;const fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.value=f;src.connect(fl).connect(g).connect(AC.destination);src.start(n);return}
 const o=AC.createOscillator();o.type=type;o.frequency.setValueAtTime(f,n);if(f2)o.frequency.exponentialRampToValueAtTime(f2,n+d);o.connect(g).connect(AC.destination);o.start(n);o.stop(n+d+0.03)}catch(e){}
}
function updMute(){$('muteB').textContent='SOUND: '+(muted?'OFF':'ON')}updMute();
$('muteB').onclick=()=>{muted=!muted;updMute();try{localStorage.setItem('dd_mute',muted?'1':'0')}catch(e){}};

// ---------- meta save ----------
let meta={gold:0,best:0,vit:0,pow:0,agi:0,head:0,greed:0,runs:0};
try{const d=JSON.parse(localStorage.getItem('dungeondash_v1')||'null');if(d)Object.assign(meta,d)}catch(e){}
function saveMeta(){try{localStorage.setItem('dungeondash_v1',JSON.stringify(meta))}catch(e){}}
const SHOP=[
 {k:'vit',ic:'❤️',n:'Vitality',d:'+1 starting heart',max:3,cost:l=>[60,180,450][l]},
 {k:'pow',ic:'🗡️',n:'Power',d:'+10% damage',max:5,cost:l=>Math.round(40*Math.pow(2,l))},
 {k:'agi',ic:'👢',n:'Agility',d:'+6% move speed',max:3,cost:l=>Math.round(50*Math.pow(2,l))},
 {k:'greed',ic:'💰',n:'Greed',d:'+25% gold from runs',max:3,cost:l=>Math.round(80*Math.pow(2.5,l))},
 {k:'head',ic:'🎁',n:'Head Start',d:'Begin each run with a rare+ power',max:1,cost:()=>300}
];

// ---------- power-ups ----------
const UPS=[
 {id:'multi',ic:'🏹',n:'Multishot',d:'+1 arrow per volley',r:'rare',max:4,f:p=>p.shots++},
 {id:'dmg',ic:'🗡️',n:'Sharpened',d:'+25% damage',r:'common',max:9,f:p=>p.dmg*=1.25},
 {id:'rate',ic:'⚡',n:'Quick Hands',d:'+20% fire rate',r:'common',max:8,f:p=>p.rate*=1.2},
 {id:'speed',ic:'👢',n:'Swift Boots',d:'+12% move speed',r:'common',max:4,f:p=>p.spd*=1.12},
 {id:'heart',ic:'❤️',n:'Heart Container',d:'+1 max heart and heal 1',r:'common',max:5,f:p=>{p.maxHp++;p.hp=Math.min(p.maxHp,p.hp+1)}},
 {id:'heal',ic:'🧪',n:'Potion',d:'Heal to full hearts',r:'common',max:99,cond:p=>p.hp<p.maxHp,f:p=>p.hp=p.maxHp},
 {id:'pierce',ic:'🎯',n:'Piercing',d:'Arrows pass through +1 enemy',r:'rare',max:3,f:p=>p.pierce++},
 {id:'bounce',ic:'🔁',n:'Ricochet',d:'Arrows bounce off walls +1 time',r:'rare',max:3,f:p=>p.bounce++},
 {id:'crit',ic:'🍀',n:'Lucky Strike',d:'+12% crit chance. Crits deal 2.5x',r:'rare',max:4,f:p=>p.crit+=0.12},
 {id:'orbit',ic:'🌀',n:'Spinning Blade',d:'+1 blade circles around you',r:'epic',max:4,f:p=>p.orbit++},
 {id:'burn',ic:'🔥',n:'Fire Arrows',d:'Arrows set enemies on fire',r:'epic',max:1,f:p=>p.burn=1},
 {id:'boom',ic:'💥',n:'Explosive Tips',d:'Arrows explode on hit',r:'epic',max:1,f:p=>p.boom=1},
 {id:'rear',ic:'↩️',n:'Back Shot',d:'Also fire an arrow behind you',r:'rare',max:1,f:p=>p.rear=1},
 {id:'dash',ic:'💨',n:'Shadow Step',d:'Dash recharges 30% faster',r:'common',max:3,f:p=>p.dashMul*=0.7},
 {id:'vamp',ic:'🦇',n:'Vampire Fang',d:'Heal 1 heart every 20 kills',r:'epic',max:1,f:p=>p.vamp=1},
 {id:'giant',ic:'🔱',n:'Giant Arrows',d:'Huge arrows: +40% damage, -10% fire rate',r:'rare',max:2,f:p=>{p.giant++;p.dmg*=1.4;p.rate*=0.9}},
 {id:'storm',ic:'⛈️',n:'Arrow Storm',d:'+2 arrows per volley and +30% fire rate',r:'legendary',max:1,f:p=>{p.shots+=2;p.rate*=1.3}},
 {id:'titan',ic:'👑',n:"Titan's Heart",d:'+3 max hearts and full heal',r:'legendary',max:1,f:p=>{p.maxHp+=3;p.hp=p.maxHp}},
 {id:'gold',ic:'💰',n:'Treasure',d:'+15 coins right now',r:'common',max:999,f:()=>{run.coins+=15}},
 {id:'chain',ic:'🌩️',n:'Chain Lightning',d:'Every hit zaps a nearby enemy',r:'legendary',max:1,f:p=>p.chain=1}
];
const RW={common:50,rare:30,epic:14,legendary:6},RWB={common:0,rare:45,epic:38,legendary:17};

// ---------- state ----------
let W,H,DPR,S=2,ox=0,oy=0,HUD=54;
let state='title',P=null,run=null,room=null;
let enemies=[],bullets=[],ebul=[],coins=[],parts=[],texts=[],marks=[],ghosts=[],zaps=[];
let shake=0,hitstop=0,fade=0,fadeDir=0,fadeCb=null,banner=null,hurtFlash=0,slowmo=1,clearT=-1,deathT=0;
const keys={};let joy=null;

function layout(){
 DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;
 if(room)fitRoom();
}
function fitRoom(){
 const ww=(room.cols+2)*TILE,wh=(room.rows+2)*TILE;
 let s=Math.min((W-8)/ww,(H-HUD-(isTouch?6:8))/wh);
 S=s>=3?Math.floor(s):s;
 ox=(W-ww*S)/2;oy=HUD+(H-HUD-wh*S)/2;
}
addEventListener('resize',layout);

// ---------- run / rooms ----------
function newRun(){
 P={x:0,y:0,r:4,hp:3+meta.vit,maxHp:3+meta.vit,spd:64*(1+0.06*meta.agi),dmg:1*(1+0.1*meta.pow),rate:2.6,shots:1,pierce:0,bounce:0,crit:0.05,orbit:0,burn:0,boom:0,rear:0,dashMul:1,vamp:0,giant:0,chain:0,
  inv:0,dashT:0,dashCd:0,fireCd:0,face:1,vamK:0,ups:{},walk:0,dx:0,dy:-1,orbA:0};
 run={room:0,coins:0,kills:0,time:0};meta.runs++;saveMeta();
 renderUps();
 show(null);$('pauseB').classList.remove('hidden');$('ups').classList.remove('hidden');if(isTouch)$('dashB').classList.remove('hidden');
 state='play';enterRoom(1);
 if(meta.head){setTimeout(()=>{if(state==='play')openPick(true,'HEAD START','Pick your opening power')},700)}
}
const PRESETS=[
 c=>[],
 c=>[[2,2],[c.cols-3,2],[2,c.rows-4],[c.cols-3,c.rows-4]],
 c=>[[Math.floor(c.cols/2)-2,Math.floor(c.rows/2)-1],[Math.floor(c.cols/2)+2,Math.floor(c.rows/2)-1]],
 c=>[[Math.floor(c.cols/2),Math.floor(c.rows/2)-1],[1,Math.floor(c.rows/2)-1],[c.cols-2,Math.floor(c.rows/2)-1]],
 c=>[[3,3],[c.cols-4,3],[Math.floor(c.cols/2),Math.floor(c.rows/2)]],
];
function enterRoom(n){
 run.room=n;const portrait=H>W*1.1;const boss=n%5===0;
 room={n,boss,cols:portrait?7:15,rows:portrait?11:9,pillars:[],doorOpen:false,waves:[],torches:[],cleared:false};
 const pre=boss?PRESETS[0]:PRESETS[n===1?0:1+Math.floor(Math.random()*(PRESETS.length-1))];
 for(const [tx,ty] of pre(room)){if(tx>=0&&ty>=0&&tx<room.cols&&ty<room.rows-2)room.pillars.push({x:TILE+tx*TILE,y:TILE+ty*TILE,w:TILE,h:TILE})}
 room.doorX=TILE+room.cols*TILE/2;
 room.torches=[{x:TILE+room.cols*TILE*0.22,y:TILE*0.55},{x:TILE+room.cols*TILE*0.78,y:TILE*0.55}];
 // waves
 const mult=1+(n-1)*0.16;room.mult=mult;
 if(boss){room.waves=[['boss']];}
 else{
  const budget=Math.round(3+n*1.3),nw=n>=3?2:1;
  for(let w=0;w<nw;w++){const list=[];let b=Math.ceil(budget/nw)+(w===1?1:0);
   const opts=[['slime',1]];if(n>=2)opts.push(['bat',1]);if(n>=3)opts.push(['skel',2]);if(n>=4)opts.push(['brute',3]);
   while(b>0){const o=opts[Math.floor(Math.random()*opts.length)];if(o[1]>b&&b<3){list.push('slime');b--;continue}list.push(o[0]);b-=o[1]}
   room.waves.push(list)}
 }
 fitRoom();prerender();
 P.x=room.doorX;P.y=TILE+room.rows*TILE-14;P.inv=1;
 enemies=[];bullets=[];ebul=[];coins=[];marks=[];ghosts=[];zaps=[];clearT=-1;
 banner={t:boss?'BOSS ROOM':'ROOM '+n,s:boss?'THE BONE KING AWAKENS':(n===1?'Clear every monster to open the door':''),life:0,boss};
 if(boss){snd(80,0.8,'sawtooth',0.08,40);}
 room.startT=0.9;
}
function nextWave(){
 if(!room.waves.length)return false;
 const list=room.waves.shift();
 for(const t of list){let x,y,tries=0;do{x=TILE+12+Math.random()*(room.cols*TILE-24);y=TILE+12+Math.random()*(room.rows*TILE-24);tries++}while(tries<40&&(Math.hypot(x-P.x,y-P.y)<64||inPillar(x,y,8)));
  if(t==='boss'){x=room.doorX;y=TILE+room.rows*TILE*0.32}
  marks.push({x,y,type:t,t:0,dur:t==='boss'?1.4:0.8})}
 snd(220,0.2,'square',0.03,110);return true;
}
function inPillar(x,y,r){for(const p of room.pillars){if(x>p.x-r&&x<p.x+p.w+r&&y>p.y-r&&y<p.y+p.h+r)return true}return false}
let roomCv=null;
function rnd(a){return a[Math.floor(Math.random()*a.length)]}
function prerender(){
 const ww=(room.cols+2)*TILE,wh=(room.rows+2)*TILE;roomCv=document.createElement('canvas');roomCv.width=ww;roomCv.height=wh;const g=roomCv.getContext('2d');
 const hue=room.boss?'boss':(room.n%3);
 const floors=room.boss?['#2b1420','#2f1624','#27121d']:[['#2a2140','#2d2346','#272038'],['#1f2a3a','#22304a','#1c2634'],['#2b2433','#2f2838','#262030']][hue];
 for(let ty=1;ty<=room.rows;ty++)for(let tx=1;tx<=room.cols;tx++){const x=tx*TILE,y=ty*TILE;g.fillStyle=rnd(floors);g.fillRect(x,y,TILE,TILE);

// ---------- spawning enemies ----------
function makeEnemy(type,x,y){
 const m=room.mult;const base={type,x,y,kx:0,ky:0,t:Math.random()*3,flash:0,burn:0,burnT:0,orbCd:0,state:0,st:0};
 if(type==='slime')Object.assign(base,{r:5,hp:3*m,spd:30,spr:'slime',coins:1});
 if(type==='bat')Object.assign(base,{r:4,hp:2*m,spd:58,spr:'bat',coins:1,fly:1});
 if(type==='skel')Object.assign(base,{r:5,hp:4*m,spd:30,spr:'skel',coins:2,shoot:1.5+Math.random()});
 if(type==='brute')Object.assign(base,{r:7,hp:13*m,spd:20,spr:'brute',coins:4,heavy:1,st:2});
 if(type==='boss')Object.assign(base,{r:13,hp:110*m,spd:14,spr:'boss',coins:30,heavy:1,boss:1,ring:2.2,summon:6,spiralT:5,spiralOn:0,spiralF:0});
 base.maxHp=base.hp;return base;
}

 for(let i=0;i<n;i++)mk(a+(i-(n-1)/2)*spread);

}

function roll(boss){
 const w=boss?RWB:RW;const pool=UPS.filter(u=>(P.ups[u.id]||0)<u.max&&(!u.cond||u.cond(P))&&w[u.r]>0);
 const out=[];
 while(out.length<3&&pool.length){let tot=pool.reduce((s,u)=>s+w[u.r],0),r=Math.random()*tot,i=0;for(;i<pool.length;i++){r-=w[pool[i].r];if(r<=0)break}i=Math.min(i,pool.length-1);out.push(pool.splice(i,1)[0])}
 if(!out.length)out.push(UPS.find(u=>u.id==='gold'));
 return out;
}

  d.onclick=()=>choose(i);c.appendChild(d)});

 texts.push({x:P.x,y:P.y-14,t:u.n.toUpperCase()+'!',col:u.r==='legendary'?'#ffd23f':u.r==='epic'?'#d49bff':u.r==='rare'?'#3ea6ff':'#ffffff',life:0,max:1.4,size:9});

// ---------- physics helpers ----------
function collideRoom(o,ignorePillars){
 const minX=TILE+o.r,maxX=TILE+room.cols*TILE-o.r,minY=TILE+o.r,maxY=TILE+room.rows*TILE-o.r;
 if(o.x<minX)o.x=minX;if(o.x>maxX)o.x=maxX;if(o.y>maxY)o.y=maxY;
 if(o.y<minY){if(o===P&&room.doorOpen&&Math.abs(o.x-room.doorX)<10){if(o.y<TILE-2)leaveRoom()}else o.y=minY}
 if(ignorePillars)return;
 for(const p of room.pillars){const cx=Math.max(p.x,Math.min(o.x,p.x+p.w)),cy=Math.max(p.y,Math.min(o.y,p.y+p.h));const dx=o.x-cx,dy=o.y-cy,d=Math.hypot(dx,dy);
  if(d<o.r){if(d>0.0001){o.x=cx+dx/d*o.r;o.y=cy+dy/d*o.r}else{o.y=p.y-o.r}}}
}

// ---------- update ----------
function update(dt){
 run.time+=dt;
 // player
 let mx=0,my=0;
 if(keys.KeyA||keys.ArrowLeft)mx--;if(keys.KeyD||keys.ArrowRight)mx++;if(keys.KeyW||keys.ArrowUp)my--;if(keys.KeyS||keys.ArrowDown)my++;
 let ml=Math.hypot(mx,my);if(ml>0){mx/=ml;my/=ml}
 if(joy){const dx=joy.x-joy.sx,dy=joy.y-joy.sy,d=Math.hypot(dx,dy);if(d>6){const m=Math.min(1,d/40);mx=dx/d*m;my=dy/d*m}}
 ml=Math.hypot(mx,my);
 if(ml>0.05){P.dx=mx;P.dy=my;if(Math.abs(mx)>0.2)P.face=mx<0?-1:1}
 P.dashCd=Math.max(0,P.dashCd-dt);P.inv=Math.max(0,P.inv-dt);
 if(P.dashT>0){P.dashT-=dt;P.x+=P.ddx*P.spd*3.4*dt;P.y+=P.ddy*P.spd*3.4*dt;ghosts.push({x:P.x,y:P.y,life:0,face:P.face})}
 else{P.x+=mx*P.spd*dt;P.y+=my*P.spd*dt}
 P.walk+=ml*dt*10;
 collideRoom(P);
 // firing
 P.fireCd-=dt;if(P.fireCd<=0&&enemies.length){fire();P.fireCd=1/P.rate}
 // orbit blades
 P.orbA+=dt*4.2;
 if(P.orbit){for(let i=0;i<P.orbit;i++){const a=P.orbA+i*Math.PI*2/P.orbit,bx=P.x+Math.cos(a)*19,by=P.y-2+Math.sin(a)*19;
  for(const e of enemies){if(e.dead||e.orbCd>0)continue;if(Math.hypot(e.x-bx,e.y-by)<e.r+4){e.orbCd=0.3;damage(e,P.dmg*0.7,false,Math.cos(a+1.57),Math.sin(a+1.57))}}}}
 // marks
 for(let i=marks.length-1;i>=0;i--){const m=marks[i];m.t+=dt;if(m.t>=m.dur){marks.splice(i,1);enemies.push(makeEnemy(m.type,m.x,m.y));
  for(let k=0;k<10;k++){const a=Math.random()*6.28;parts.push({x:m.x,y:m.y,vx:Math.cos(a)*60,vy:Math.sin(a)*60,life:0,max:0.4,col:'#b48cff',r:1.5})}
  if(m.type==='boss'){shake=10;snd(50,1,'sawtooth',0.1,30)}}}
 // enemies
 for(const e of enemies){
  if(e.dead)continue;e.t+=dt;e.flash-=dt;e.orbCd-=dt;
  if(e.burn>0){e.burn-=dt;e.burnT-=dt;if(e.burnT<=0){e.burnT=0.4;damage(e,P.dmg*0.35,false,0,0,'burn');parts.push({x:e.x+(Math.random()-0.5)*6,y:e.y-2,vx:0,vy:-30,life:0,max:0.4,col:'#ff8a3c',r:1.5})}}
  if(e.dead)continue;
  const dx=P.x-e.x,dy=P.y-e.y,d=Math.hypot(dx,dy)||1,ux=dx/d,uy=dy/d;let vx=0,vy=0;
  const sp=e.spd*(1+Math.min(0.4,(room.n-1)*0.02));
  if(e.type==='slime'){const hop=Math.max(0,Math.sin(e.t*5));vx=ux*sp*hop*1.8;vy=uy*sp*hop*1.8;e.sq=hop}
  else if(e.type==='bat'){const w=Math.sin(e.t*5)*0.9;vx=(ux-uy*w)*sp;vy=(uy+ux*w)*sp}
  else if(e.type==='skel'){if(d<55){vx=-ux*sp;vy=-uy*sp}else if(d>95){vx=ux*sp;vy=uy*sp}else{vx=-uy*sp*0.6*Math.sign(Math.sin(e.t*0.7));vy=ux*sp*0.6*Math.sign(Math.sin(e.t*0.7))}
   e.shoot-=dt;if(e.shoot<=0){e.shoot=2.3;const a=Math.atan2(dy,dx);ebul.push({x:e.x,y:e.y-3,vx:Math.cos(a)*85,vy:Math.sin(a)*85,r:2,life:3,arrow:1});snd(400,0.08,'triangle',0.03,200)}}

function drawTitleBg(time){
 ctx.setTransform(DPR,0,0,DPR,0,0);const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1a0b30');g.addColorStop(1,'#07040d');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 for(const e of embers){e.y-=e.v*0.016;if(e.y<-0.05){e.y=1.05;e.x=Math.random()}ctx.fillStyle=`rgba(255,${140+Math.random()*60|0},60,${0.5+0.5*Math.sin(time*3+e.x*40)})`;ctx.fillRect(e.x*W,e.y*H,e.s,e.s)}
 ctx.imageSmoothingEnabled=false;const s=Math.max(4,Math.floor(Math.min(W,H)/90));
 ctx.drawImage(SPR.knight,W*0.5-4*s-s*14,H-12*s-20+Math.sin(time*3)*s,8*s,10*s);
 ctx.drawImage(SPR.slime,W*0.5+s*8,H-8*s-20,10*s,8*s);ctx.drawImage(SPR.bat,W*0.5+s*22,H-24*s+Math.sin(time*4)*s*2,11*s,7*s);
}

// ---------- loop ----------
let last=performance.now();
function frame(now){
 let dt=Math.min(1/30,(now-last)/1000);last=now;const time=now/1000;
 if(state==='play'||state==='dying'){
  if(hitstop>0){hitstop-=dt}
  else if(fadeDir===1&&fade>0.2){}
  else{const sdt=dt*(state==='dying'?slowmo:1);if(state==='play')update(sdt);else{deathT+=dt;if(deathT>1.6)endRun()}}
  updFx(state==='dying'?dt*slowmo:dt);
 }else if(state==='pick'||state==='over'){updFx(dt*0.0)}
 if(fadeDir!==0&&state!=='play')updFx(0);
 render(time);requestAnimationFrame(frame);
}
layout();requestAnimationFrame(t=>{last=t;frame(t)});
})();
</script>
