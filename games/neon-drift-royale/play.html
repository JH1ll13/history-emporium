<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Neon Drift Royale</title>
<link rel="stylesheet" href="/assets/fonts.css">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#07021a;color:#fff;font-family:'Audiowide',sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.ov{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,rgba(20,0,50,.9),rgba(60,0,70,.88) 60%,rgba(255,60,160,.35));padding:14px;box-sizing:border-box;overflow:auto}
.hidden{display:none!important}
.box{text-align:center;width:100%;max-width:620px}
h1{font-family:'Monoton',cursive;font-weight:400;font-size:clamp(34px,10vw,78px);margin:0;line-height:1;color:#fff;text-shadow:0 0 8px #ff3fbf,0 0 24px #ff3fbf,0 0 48px #ff3fbf}
h1 span{display:block;color:#fff;text-shadow:0 0 8px #3ff7ff,0 0 24px #3ff7ff,0 0 48px #3ff7ff}
.tag{letter-spacing:8px;color:#ffd23f;text-shadow:0 0 10px #ffd23f;margin:12px 0 22px;font-size:14px}
.btn{font-family:'Audiowide';font-size:16px;letter-spacing:2px;color:#fff;background:transparent;border:2px solid #3ff7ff;border-radius:10px;padding:13px 26px;margin:7px;cursor:pointer;box-shadow:0 0 14px #3ff7ff,inset 0 0 14px #3ff7ff66;text-shadow:0 0 8px #3ff7ff}
.btn:active{transform:scale(.96)}
.btn.pink{border-color:#ff3fbf;box-shadow:0 0 14px #ff3fbf,inset 0 0 14px #ff3fbf66;text-shadow:0 0 8px #ff3fbf}
.small{font-size:11px;opacity:.75;line-height:1.8;margin-top:16px}
.gold{color:#ffd23f;text-shadow:0 0 8px #ffd23f}
table{margin:14px auto;border-collapse:collapse;font-size:14px;min-width:280px}
td,th{padding:6px 12px;text-align:left}th{font-size:11px;opacity:.6}
tr.me td{color:#3ff7ff;text-shadow:0 0 8px #3ff7ff}
#skins{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.skin{border:2px solid #fff3;border-radius:12px;padding:8px 4px;cursor:pointer;background:rgba(0,0,0,.35)}
.skin canvas{width:100%;max-width:150px;height:auto;display:block;margin:0 auto}
.skin b{font-weight:400;font-size:12px;display:block;margin-top:4px}
.skin span{font-size:11px}
.skin.sel{border-color:#3ff7ff;box-shadow:0 0 14px #3ff7ff}
.tb{position:fixed;z-index:3;border-radius:50%;border:3px solid rgba(63,247,255,.6);background:rgba(63,247,255,.12);display:flex;align-items:center;justify-content:center;font-size:26px;color:#fff;text-shadow:0 0 8px #3ff7ff}
.tb.on{background:rgba(63,247,255,.4)}
#tL{left:14px;bottom:calc(20px + env(safe-area-inset-bottom));width:76px;height:76px}
#tR{left:104px;bottom:calc(20px + env(safe-area-inset-bottom));width:76px;height:76px}
#tD{right:16px;bottom:calc(20px + env(safe-area-inset-bottom));width:100px;height:100px;border-color:rgba(255,63,191,.8);background:rgba(255,63,191,.15);font-size:14px;letter-spacing:1px;text-shadow:0 0 8px #ff3fbf}
#tD.on{background:rgba(255,63,191,.45)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="tb hidden" id="tL">◀</div><div class="tb hidden" id="tR">▶</div><div class="tb hidden" id="tD">DRIFT</div>
<div class="ov" id="title"><div class="box">
  <h1>NEON<span>DRIFT</span></h1>
  <div class="tag">ROYALE</div>
  <button class="btn" id="playB">▶ RACE</button>
  <button class="btn pink" id="garB">GARAGE</button>
  <div class="small"><span class="gold" id="tCoins">0</span> credits · Best score <span id="tBest">0</span><br><span id="tHelp"></span></div>
</div></div>
<div class="ov hidden" id="gar"><div class="box">
  <h1 style="font-size:clamp(26px,7vw,48px)">GARAGE</h1>
  <div class="small" style="margin-top:6px">Credits: <span class="gold" id="gCoins">0</span></div>
  <div id="skins"></div>
  <button class="btn" id="garBack">◀ BACK</button>
</div></div>
<div class="ov hidden" id="end"><div class="box">
  <h1 style="font-size:clamp(26px,8vw,52px)" id="eT">1ST PLACE</h1>
  <table id="eTab"></table>
  <div id="eC" style="font-size:15px"></div>
  <div style="margin-top:10px"><button class="btn" id="againB">↻ RACE AGAIN</button><button class="btn pink" id="eGarB">GARAGE</button></div>
</div></div>
<script>
(()=>{
const cv=document.getElementById('c'),ctx=cv.getContext('2d');const $=id=>document.getElementById(id);
const isTouch=('ontouchstart' in window)||navigator.maxTouchPoints>0;
$('tHelp').textContent=isTouch?'◀ ▶ to steer · Hold DRIFT while turning to charge boost · Let go to BOOST and wreck rivals':'A/D or ←/→ to steer · Hold SPACE while turning to drift and charge boost · Let go to BOOST into rivals';
const ARENA=1000,MATCH=90;
const SKINS=[{n:'Cyan Pulse',c:'#3ff7ff',cost:0},{n:'Hot Pink',c:'#ff3fbf',cost:150},{n:'Toxic Lime',c:'#9dff3f',cost:300},{n:'Solar Gold',c:'#ffd23f',cost:500},{n:'Ultraviolet',c:'#b46bff',cost:800},{n:'Prism',c:'rainbow',cost:1500}];
const AIN=['VIPER','BLITZ','NOVA','RAZOR','GHOST'],AIC=['#ff5a3c','#ff3fbf','#9dff3f','#ffd23f','#b46bff','#3ff7ff','#ffffff'];
let sv={coins:0,owned:[0],sel:0,best:0};try{const d=JSON.parse(localStorage.getItem('neondrift_v1')||'null');if(d)sv=Object.assign(sv,d)}catch(e){}
function persist(){try{localStorage.setItem('neondrift_v1',JSON.stringify(sv))}catch(e){}}

let AC=null,engine=null;
function snd(f,d=0.1,type='sawtooth',v=0.06,f2,noise){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const n=AC.currentTime,g=AC.createGain();g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(0.0008,n+d);
 if(noise){const len=Math.floor(AC.sampleRate*d),b=AC.createBuffer(1,len,AC.sampleRate),dd=b.getChannelData(0);for(let i=0;i<len;i++)dd[i]=(Math.random()*2-1)*(1-i/len);const s=AC.createBufferSource();s.buffer=b;const fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.value=f;s.connect(fl).connect(g).connect(AC.destination);s.start(n);return}
 const o=AC.createOscillator();o.type=type;o.frequency.setValueAtTime(f,n);if(f2)o.frequency.exponentialRampToValueAtTime(f2,n+d);o.connect(g).connect(AC.destination);o.start(n);o.stop(n+d+0.03)}catch(e){}}
function startEngine(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(engine)return;const o=AC.createOscillator(),o2=AC.createOscillator(),g=AC.createGain(),f=AC.createBiquadFilter();o.type='sawtooth';o2.type='square';f.type='lowpass';f.frequency.value=600;g.gain.value=0.025;o.connect(f);o2.connect(f);f.connect(g).connect(AC.destination);o.start();o2.start();engine={o,o2,g,f}}catch(e){}}
function stopEngine(){if(engine){try{engine.o.stop();engine.o2.stop()}catch(e){}engine=null}}

let W,H,DPR,zoom=1,camX=0,camY=0;
let state='title',cars=[],me=null,pillars=[],orbs=[],parts=[],skids=[],texts=[],feed=[],timeLeft=MATCH,countT=0,shake=0,time=0;
function layout(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR}
addEventListener('resize',layout);
function colOf(c,t){return c==='rainbow'?`hsl(${(t*120)%360},100%,60%)`:c}

function newCar(name,col,ai,skill){return{name,col,ai,skill,x:0,y:0,a:0,vx:0,vy:0,boostT:0,meter:0,drift:false,wasDrift:false,dead:0,inv:2,ko:0,deaths:0,drPts:0,score:0,trail:[],tgt:null,tgtT:0,steer:0,lastHit:null}}
function spawn(c,i,n){const a=i!==undefined?i/n*Math.PI*2:Math.random()*Math.PI*2;const r=i!==undefined?720:760;c.x=Math.cos(a)*r;c.y=Math.sin(a)*r;c.a=a+Math.PI;c.vx=c.vy=0;c.boostT=0;c.meter=i!==undefined?0:0.3;c.drift=false;c.inv=2;c.trail=[]}
function newMatch(){
 cars=[];const sk=SKINS[sv.sel];me=newCar('YOU',sk.c,false,1);cars.push(me);
 const cols=AIC.filter(c=>c!==sk.c);
 AIN.forEach((n,i)=>cars.push(newCar(n,cols[i%cols.length],true,0.55+Math.random()*0.4)));
 cars.forEach((c,i)=>spawn(c,i,cars.length));
 pillars=[{x:0,y:0,r:110}];for(let i=0;i<6;i++){const a=i/6*Math.PI*2+Math.PI/6;pillars.push({x:Math.cos(a)*530,y:Math.sin(a)*530,r:52})}
 orbs=[];for(let i=0;i<14;i++)orbs.push(newOrb());
 parts=[];skids=[];texts=[];feed=[];timeLeft=MATCH;countT=3.6;state='count';camX=me.x;camY=me.y;
 show(null);if(isTouch)for(const id of['tL','tR','tD'])$(id).classList.remove('hidden');
 startEngine();
}
function newOrb(){let x,y,ok;do{const a=Math.random()*6.283,r=150+Math.random()*(ARENA-230);x=Math.cos(a)*r;y=Math.sin(a)*r;ok=pillars.every(p=>Math.hypot(p.x-x,p.y-y)>p.r+40)}while(!ok);return{x,y,t:0,alive:1,ph:Math.random()*6}}

// input
const keys={};const tbtn={L:false,R:false,D:false};
addEventListener('keydown',e=>{keys[e.code]=true;if(['Space','ArrowLeft','ArrowRight','ArrowDown','ArrowUp'].includes(e.code))e.preventDefault();if(e.code==='Enter'&&(state==='title'||state==='end'))newMatch()});
addEventListener('keyup',e=>{keys[e.code]=false});addEventListener('blur',()=>{for(const k in keys)keys[k]=false;tbtn.L=tbtn.R=tbtn.D=false});
for(const [id,k] of[['tL','L'],['tR','R'],['tD','D']]){const el=$(id);el.addEventListener('pointerdown',e=>{e.preventDefault();tbtn[k]=true;el.classList.add('on');el.setPointerCapture(e.pointerId)});const up=()=>{tbtn[k]=false;el.classList.remove('on')};el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);el.addEventListener('lostpointercapture',up)}

function wrap(a){while(a>Math.PI)a-=Math.PI*2;while(a<-Math.PI)a+=Math.PI*2;return a}
function burst(x,y,col,n,sp,life=0.6,line=false){for(let i=0;i<n;i++){const a=Math.random()*6.283,v=sp*(0.2+Math.random()*0.8);parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:0,max:life*(0.5+Math.random()*0.7),col,line})}}
function addFeed(t,col){feed.unshift({t,col,life:0});if(feed.length>4)feed.pop()}
function nearMe(x,y){return Math.hypot(x-me.x,y-me.y)<700}

function control(c,dt){
 if(!c.ai){let s=0;if(keys.KeyA||keys.ArrowLeft||tbtn.L)s-=1;if(keys.KeyD||keys.ArrowRight||tbtn.R)s+=1;c.steer=s;c.drift=!!(keys.Space||keys.ShiftLeft||keys.ShiftRight||keys.ArrowDown||keys.KeyS||tbtn.D);return}
 c.tgtT-=dt;
 if(c.tgtT<=0||!c.tgt||(c.tgt.alive===0)||(c.tgt.dead>0)){c.tgtT=0.6+Math.random()*0.4;
  if(c.meter<0.55){let b=null,bd=1e9;for(const o of orbs){if(!o.alive)continue;const d=Math.hypot(o.x-c.x,o.y-c.y);if(d<bd){bd=d;b=o}}c.tgt=b}
  else{let b=null,bd=1e9;for(const o of cars){if(o===c||o.dead>0||o.inv>0)continue;const d=Math.hypot(o.x-c.x,o.y-c.y)*(o===me?1.15:1);if(d<bd){bd=d;b=o}}c.tgt=b}}
 let tx=0,ty=0;if(c.tgt){tx=c.tgt.x+(c.tgt.vx||0)*0.3;ty=c.tgt.y+(c.tgt.vy||0)*0.3}
 let des=Math.atan2(ty-c.y,tx-c.x);
 const fx=Math.cos(c.a),fy=Math.sin(c.a),dc=Math.hypot(c.x,c.y);
 if(dc>ARENA-260&&(fx*c.x+fy*c.y)/dc>0.2)des=Math.atan2(-c.y,-c.x);
 for(const p of pillars){const ax=c.x+fx*120,ay=c.y+fy*120;if(Math.hypot(ax-p.x,ay-p.y)<p.r+40){const side=(fx*(p.y-c.y)-fy*(p.x-c.x))>0?-1:1;des=c.a+side*1.2}}
 const diff=wrap(des-c.a);c.steer=Math.max(-1,Math.min(1,diff*2.4))*(0.75+c.skill*0.25);
 const sp=Math.hypot(c.vx,c.vy);
 if(!c.drift&&Math.abs(diff)>0.85&&sp>280&&Math.random()<c.skill*0.2)c.drift=true;
 else if(c.drift&&(Math.abs(diff)<0.25||c.meter>=1||sp<150))c.drift=false;
}
function physics(c,dt){
 const boosting=c.boostT>0;c.boostT=Math.max(0,c.boostT-dt);c.inv=Math.max(0,c.inv-dt);
 const sp0=Math.hypot(c.vx,c.vy);
 const turn=c.steer*3.1*Math.max(0.35,Math.min(1,sp0/260))*(c.drift?1.5:1);c.a+=turn*dt;
 const fx=Math.cos(c.a),fy=Math.sin(c.a);let vf=c.vx*fx+c.vy*fy,vl=-c.vx*fy+c.vy*fx;
 const acc=boosting?1500:620,max=boosting?980:560;vf+=acc*dt;if(vf>max)vf-=(vf-max)*Math.min(1,3*dt);
 vl*=Math.exp(-(c.drift?1.1:9)*dt);
 c.vx=fx*vf-fy*vl;c.vy=fy*vf+fx*vl;c.x+=c.vx*dt;c.y+=c.vy*dt;
 // drift charge
 if(c.drift&&Math.abs(vl)>80&&sp0>200){c.meter=Math.min(1,c.meter+dt*0.55);c.drPts+=dt*Math.abs(vl)*0.18;
  if(Math.random()<0.6)skids.push({x:c.x-fx*12,y:c.y-fy*12,a:c.a,life:0,col:c.col});
  if(Math.random()<0.4)parts.push({x:c.x-fx*14,y:c.y-fy*14,vx:-c.vx*0.1+(Math.random()-0.5)*60,vy:-c.vy*0.1+(Math.random()-0.5)*60,life:0,max:0.4,col:c.meter>=1?'#ffffff':colOf(c.col,time)})}
 if(c.wasDrift&&!c.drift&&c.meter>=0.25){c.boostT=0.6+c.meter*1.7;c.meter=0;if(!c.ai){snd(200,0.5,'sawtooth',0.08,900);shake=Math.max(shake,4)}else if(nearMe(c.x,c.y))snd(150,0.3,'sawtooth',0.03,600)}
 c.wasDrift=c.drift;
 if(boosting&&Math.random()<0.9){parts.push({x:c.x-fx*16,y:c.y-fy*16,vx:-fx*200+(Math.random()-0.5)*80,vy:-fy*200+(Math.random()-0.5)*80,life:0,max:0.35,col:Math.random()<0.5?'#ffd23f':'#ff5a3c'})}
 // walls
 const d=Math.hypot(c.x,c.y);if(d>ARENA-18){const nx=c.x/d,ny=c.y/d;c.x=nx*(ARENA-18);c.y=ny*(ARENA-18);const vn=c.vx*nx+c.vy*ny;if(vn>0){c.vx-=nx*vn*1.5;c.vy-=ny*vn*1.5;if(vn>250){burst(c.x+nx*14,c.y+ny*14,'#ff3fbf',10,300,0.4,true);if(!c.ai){snd(300,0.1,'square',0.05,0,true);shake=Math.max(shake,3)}}}}
 for(const p of pillars){const dx=c.x-p.x,dy=c.y-p.y,dd=Math.hypot(dx,dy),m=p.r+18;if(dd<m){const nx=dx/dd,ny=dy/dd;c.x=p.x+nx*m;c.y=p.y+ny*m;const vn=c.vx*nx+c.vy*ny;if(vn<0){c.vx-=nx*vn*1.6;c.vy-=ny*vn*1.6;if(-vn>250){burst(p.x+nx*p.r,p.y+ny*p.r,'#3ff7ff',10,300,0.4,true);if(!c.ai){snd(300,0.1,'square',0.05,0,true);shake=Math.max(shake,3)}}}}}
 // orbs
 for(const o of orbs){if(o.alive&&Math.hypot(o.x-c.x,o.y-c.y)<34){o.alive=0;o.t=4;c.meter=Math.min(1,c.meter+0.35);burst(o.x,o.y,'#ffd23f',12,200,0.5);if(!c.ai){snd(880,0.12,'square',0.05,1760);texts.push({x:o.x,y:o.y,t:'+BOOST',col:'#ffd23f',life:0})}}}
 c.trail.push([c.x,c.y]);if(c.trail.length>16)c.trail.shift();
}
function wreck(v,by){
 v.dead=2.6;v.deaths++;by.ko++;by.score+=100;by.lastKO=time;
 const col=colOf(v.col,time);burst(v.x,v.y,col,40,500,0.9,true);burst(v.x,v.y,'#ffffff',20,300,0.5);burst(v.x,v.y,'#ffd23f',15,250,0.7);
 parts.push({x:v.x,y:v.y,vx:0,vy:0,life:0,max:0.4,col,ring:1});
 if(by===me){texts.push({x:v.x,y:v.y,t:'WRECKED! +100',col:'#ffd23f',life:0,big:1});snd(90,0.6,'sawtooth',0.1,30);snd(800,0.5,'noise',0.12,0,true);shake=12}
 else if(nearMe(v.x,v.y)){snd(120,0.4,'sawtooth',0.05,40);shake=Math.max(shake,v===me?14:5)}
 if(v===me){texts.push({x:v.x,y:v.y,t:'WRECKED BY '+by.name,col:'#ff5a3c',life:0,big:1})}
 addFeed((by===me?'YOU':by.name)+' wrecked '+(v===me?'YOU':v.name),by===me?'#3ff7ff':v===me?'#ff5a3c':'#ffffffaa');
}
function collide(){
 for(let i=0;i<cars.length;i++)for(let j=i+1;j<cars.length;j++){const a=cars[i],b=cars[j];if(a.dead>0||b.dead>0)continue;
  const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);if(d>=36||d===0)continue;const nx=dx/d,ny=dy/d;const o=(36-d)/2;a.x-=nx*o;a.y-=ny*o;b.x+=nx*o;b.y+=ny*o;
  const va=a.vx*nx+a.vy*ny,vb=b.vx*nx+b.vy*ny,rel=va-vb;if(rel<=0)continue;
  const aAtk=a.boostT>0&&va>280,bAtk=b.boostT>0&&-vb>280;
  if(aAtk&&!bAtk&&b.inv<=0){wreck(b,a);a.vx-=nx*rel*0.3;a.vy-=ny*rel*0.3;continue}
  if(bAtk&&!aAtk&&a.inv<=0){wreck(a,b);b.vx+=nx*rel*0.3;b.vy+=ny*rel*0.3;continue}
  const j2=rel*0.95;a.vx-=nx*j2;a.vy-=ny*j2;b.vx+=nx*j2;b.vy+=ny*j2;
  burst((a.x+b.x)/2,(a.y+b.y)/2,'#ffffff',8,250,0.3,true);if(a===me||b===me){snd(250,0.12,'square',0.05,0,true);shake=Math.max(shake,4)}}
}
function update(dt){
 if(state==='count'){countT-=dt;const prev=Math.ceil(countT+dt);if(Math.ceil(countT)!==prev&&countT>0)snd(440,0.2,'square',0.06);if(countT<=0){state='race';snd(880,0.5,'square',0.07)}}
 const racing=state==='race';
 if(racing){timeLeft-=dt;if(timeLeft<=0){timeLeft=0;endMatch();return}}
 for(const c of cars){
  if(c.dead>0){c.dead-=dt;if(c.dead<=0)spawn(c);continue}
  if(racing)control(c,dt);else{c.steer=0;c.drift=false}
  if(racing)physics(c,dt);
  c.score=c.ko*100+Math.floor(c.drPts);
 }
 if(racing)collide();
 for(const o of orbs){if(!o.alive){o.t-=dt;if(o.t<=0){Object.assign(o,newOrb())}}}
 if(engine){const sp=Math.hypot(me.vx,me.vy);engine.o.frequency.value=50+sp*0.18+(me.boostT>0?40:0);engine.o2.frequency.value=25+sp*0.09;engine.g.gain.value=me.dead>0||state!=='race'?0.008:0.022;engine.f.frequency.value=400+sp*1.4}
}
function fxUpdate(dt){
 for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life+=dt;if(p.life>p.max){parts.splice(i,1);continue}p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=0.94;p.vy*=0.94}
 for(let i=skids.length-1;i>=0;i--){skids[i].life+=dt;if(skids[i].life>2.5)skids.splice(i,1)}if(skids.length>700)skids.splice(0,skids.length-700);
 for(let i=texts.length-1;i>=0;i--){texts[i].life+=dt;if(texts[i].life>1.4)texts.splice(i,1)}
 for(let i=feed.length-1;i>=0;i--){feed[i].life+=dt;if(feed[i].life>5)feed.splice(i,1)}
 shake=Math.max(0,shake-dt*25);
}
function endMatch(){
 state='end';stopEngine();for(const id of['tL','tR','tD'])$(id).classList.add('hidden');
 const ranked=[...cars].sort((a,b)=>b.score-a.score);const rank=ranked.indexOf(me)+1;
 const earned=Math.round(me.score/8)+[120,70,40,20,10,5][rank-1];sv.coins+=earned;if(me.score>sv.best)sv.best=me.score;persist();
 $('eT').textContent=['1ST PLACE!','2ND PLACE','3RD PLACE','4TH PLACE','5TH PLACE','6TH PLACE'][rank-1];
 $('eTab').innerHTML='<tr><th>#</th><th>DRIVER</th><th>WRECKS</th><th>SCORE</th></tr>'+ranked.map((c,i)=>`<tr class="${c===me?'me':''}"><td>${i+1}</td><td style="color:${c===me?'':colOf(c.col,0)}">${c.name}</td><td>${c.ko}</td><td>${c.score}</td></tr>`).join('');
 $('eC').innerHTML=`+<span class="gold">${earned}</span> credits · Bank <span class="gold">${sv.coins}</span>`;
 snd(rank===1?523:300,0.2,'square',0.06);setTimeout(()=>snd(rank===1?784:250,0.4,'square',0.06),180);
 setTimeout(()=>show('end'),900);
}

// render
function drawCar(g,x,y,a,col,t,opt={}){
 const c=colOf(col,t);g.save();g.translate(x,y);g.rotate(a);const s=opt.scale||1;g.scale(s,s);
 g.shadowColor=c;g.shadowBlur=opt.boost?32:16;
 g.fillStyle='rgba(10,0,30,.9)';g.strokeStyle=c;g.lineWidth=2.5;g.lineJoin='round';
 g.beginPath();g.moveTo(24,0);g.lineTo(8,-11);g.lineTo(-14,-13);g.lineTo(-18,-6);g.lineTo(-18,6);g.lineTo(-14,13);g.lineTo(8,11);g.closePath();g.fill();g.stroke();
 g.shadowBlur=8;g.beginPath();g.moveTo(6,-6);g.lineTo(-6,-7);g.lineTo(-6,7);g.lineTo(6,6);g.closePath();g.fillStyle=c;g.globalAlpha=0.55;g.fill();g.globalAlpha=1;
 g.fillStyle='#fff';g.fillRect(20,-5,3,3);g.fillRect(20,2,3,3);
 g.fillStyle=opt.boost?'#ffd23f':'#ff3b5c';g.shadowColor=g.fillStyle;g.shadowBlur=12;g.fillRect(-19,-10,3,6);g.fillRect(-19,4,3,6);
 if(opt.boost){g.fillStyle='#ffd23f';g.globalAlpha=0.8;g.beginPath();g.moveTo(-18,-5);g.lineTo(-34-Math.random()*14,0);g.lineTo(-18,5);g.fill();g.globalAlpha=1}
 g.restore();
}
function render(){
 ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle='#07021a';ctx.fillRect(0,0,W,H);
 if(!me){drawTitleBg();return}
 const tz=Math.max(0.42,Math.min(1.15,Math.min(W,H)/820))*(me.boostT>0?0.92:1);zoom+=(tz-zoom)*0.05;
 const lx=me.x+me.vx*0.25,ly=me.y+me.vy*0.25;camX+=(lx-camX)*0.12;camY+=(ly-camY)*0.12;
 const sx=(Math.random()-0.5)*shake,sy=(Math.random()-0.5)*shake;
 ctx.setTransform(zoom*DPR,0,0,zoom*DPR,(W/2-camX*zoom+sx)*DPR,(H/2-camY*zoom+sy)*DPR);
 // floor
 const fg=ctx.createRadialGradient(0,0,100,0,0,ARENA);fg.addColorStop(0,'#2a0a55');fg.addColorStop(1,'#12042a');ctx.fillStyle=fg;ctx.beginPath();ctx.arc(0,0,ARENA,0,6.283);ctx.fill();
 ctx.save();ctx.beginPath();ctx.arc(0,0,ARENA,0,6.283);ctx.clip();
 ctx.strokeStyle='rgba(255,63,191,.16)';ctx.lineWidth=2;ctx.beginPath();for(let i=-ARENA;i<=ARENA;i+=100){ctx.moveTo(i,-ARENA);ctx.lineTo(i,ARENA);ctx.moveTo(-ARENA,i);ctx.lineTo(ARENA,i)}ctx.stroke();
 ctx.strokeStyle='rgba(63,247,255,.08)';ctx.lineWidth=1;ctx.beginPath();for(let i=-ARENA+50;i<=ARENA;i+=100){ctx.moveTo(i,-ARENA);ctx.lineTo(i,ARENA);ctx.moveTo(-ARENA,i);ctx.lineTo(ARENA,i)}ctx.stroke();
 // skids
 for(const s of skids){const a=0.5*(1-s.life/2.5);ctx.fillStyle=colOf(s.col,time);ctx.globalAlpha=a*0.5;ctx.save();ctx.translate(s.x,s.y);ctx.rotate(s.a);ctx.fillRect(-3,-11,6,4);ctx.fillRect(-3,7,6,4);ctx.restore()}
 ctx.globalAlpha=1;ctx.restore();
 // border
 ctx.save();ctx.shadowColor='#ff3fbf';ctx.shadowBlur=30;ctx.strokeStyle='#ff3fbf';ctx.lineWidth=10;ctx.beginPath();ctx.arc(0,0,ARENA,0,6.283);ctx.stroke();
 ctx.shadowBlur=0;ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=2;ctx.stroke();
 ctx.strokeStyle='rgba(63,247,255,.5)';ctx.setLineDash([30,30]);ctx.lineDashOffset=-time*80;ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,ARENA-30,0,6.283);ctx.stroke();ctx.setLineDash([]);ctx.restore();
 // pillars
 for(const p of pillars){ctx.save();ctx.fillStyle='#0b0320';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.283);ctx.fill();ctx.shadowColor='#3ff7ff';ctx.shadowBlur=24;ctx.strokeStyle='#3ff7ff';ctx.lineWidth=5;ctx.stroke();ctx.shadowBlur=0;ctx.strokeStyle='rgba(63,247,255,.35)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x,p.y,p.r*0.65,time,time+4);ctx.stroke();ctx.beginPath();ctx.arc(p.x,p.y,p.r*0.35,-time*1.5,-time*1.5+3);ctx.stroke();ctx.restore()}
 // orbs
 for(const o of orbs){if(!o.alive)continue;const s=10+Math.sin(time*5+o.ph)*2;ctx.save();ctx.translate(o.x,o.y);ctx.rotate(time*2+o.ph);ctx.shadowColor='#ffd23f';ctx.shadowBlur=22;ctx.fillStyle='#ffd23f';ctx.beginPath();ctx.moveTo(0,-s);ctx.lineTo(s*0.7,0);ctx.lineTo(0,s);ctx.lineTo(-s*0.7,0);ctx.closePath();ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,0,s*0.25,0,6.283);ctx.fill();ctx.restore()}
 // trails
 ctx.globalCompositeOperation='lighter';
 for(const c of cars){if(c.dead>0||c.trail.length<2)continue;const col=colOf(c.col,time);ctx.strokeStyle=col;ctx.lineCap='round';for(let i=1;i<c.trail.length;i++){const a=i/c.trail.length;ctx.globalAlpha=a*(c.boostT>0?0.7:0.35);ctx.lineWidth=a*(c.boostT>0?14:7);ctx.beginPath();ctx.moveTo(c.trail[i-1][0],c.trail[i-1][1]);ctx.lineTo(c.trail[i][0],c.trail[i][1]);ctx.stroke()}}
 ctx.globalAlpha=1;
 for(const p of parts){const a=1-p.life/p.max;ctx.globalAlpha=a;ctx.strokeStyle=ctx.fillStyle=p.col;if(p.ring){ctx.lineWidth=4;ctx.beginPath();ctx.arc(p.x,p.y,20+(1-a)*90,0,6.283);ctx.stroke()}else if(p.line){ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.vx*0.04,p.y-p.vy*0.04);ctx.stroke()}else{ctx.beginPath();ctx.arc(p.x,p.y,3*a+1,0,6.283);ctx.fill()}}
 ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
 // cars
 for(const c of cars){if(c.dead>0)continue;if(c.inv>0&&Math.floor(c.inv*10)%2===0)ctx.globalAlpha=0.35;drawCar(ctx,c.x,c.y,c.a,c.col,time,{boost:c.boostT>0});ctx.globalAlpha=1;
  if(c.meter>=1&&Math.floor(time*8)%2===0){ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(c.x,c.y,28,0,6.283);ctx.stroke()}
  if(c!==me){ctx.font="13px 'Audiowide'";ctx.textAlign='center';ctx.fillStyle=colOf(c.col,time);ctx.fillText(c.name,c.x,c.y-30)}}
 if(me.dead<=0){ctx.strokeStyle='rgba(255,255,255,.6)';ctx.lineWidth=2;ctx.beginPath();const a=me.a;ctx.moveTo(me.x+Math.cos(a)*40,me.y+Math.sin(a)*40);ctx.lineTo(me.x+Math.cos(a+0.15)*34,me.y+Math.sin(a+0.15)*34);ctx.moveTo(me.x+Math.cos(a)*40,me.y+Math.sin(a)*40);ctx.lineTo(me.x+Math.cos(a-0.15)*34,me.y+Math.sin(a-0.15)*34);ctx.stroke()}
 // world texts
 for(const t of texts){const a=1-t.life/1.4;ctx.globalAlpha=a;ctx.font=`${t.big?28:16}px 'Audiowide'`;ctx.textAlign='center';ctx.fillStyle=t.col;ctx.shadowColor=t.col;ctx.shadowBlur=14;ctx.fillText(t.t,t.x,t.y-40-t.life*40);ctx.shadowBlur=0}
 ctx.globalAlpha=1;
 drawHud();
}
function drawHud(){
 ctx.setTransform(DPR,0,0,DPR,0,0);
 const tl=Math.ceil(timeLeft),low=tl<=10&&state==='race';
 ctx.textAlign='center';ctx.font=`${Math.min(44,W*0.09)}px 'Audiowide'`;ctx.fillStyle=low?'#ff5a3c':'#fff';ctx.shadowColor=low?'#ff5a3c':'#ff3fbf';ctx.shadowBlur=18;
 ctx.fillText(Math.floor(tl/60)+':'+String(tl%60).padStart(2,'0'),W/2,48);ctx.shadowBlur=0;
 ctx.textAlign='left';ctx.font="16px 'Audiowide'";ctx.fillStyle='#3ff7ff';ctx.shadowColor='#3ff7ff';ctx.shadowBlur=10;ctx.fillText('SCORE '+me.score,14,30);ctx.fillStyle='#ffd23f';ctx.shadowColor='#ffd23f';ctx.fillText('WRECKS '+me.ko,14,52);ctx.shadowBlur=0;
 // rank
 const ranked=[...cars].sort((a,b)=>b.score-a.score);ctx.textAlign='right';ctx.font="13px 'Audiowide'";
 ranked.slice(0,3).forEach((c,i)=>{ctx.fillStyle=c===me?'#3ff7ff':colOf(c.col,time);ctx.fillText(`${i+1}. ${c.name} ${c.score}`,W-14,26+i*18)});
 const myR=ranked.indexOf(me);if(myR>2){ctx.fillStyle='#3ff7ff';ctx.fillText(`${myR+1}. YOU ${me.score}`,W-14,26+3*18)}
 // feed
 ctx.font="12px 'Audiowide'";feed.forEach((f,i)=>{ctx.globalAlpha=Math.min(1,(5-f.life)*2);ctx.fillStyle=f.col;ctx.fillText(f.t,W-14,110+i*18)});ctx.globalAlpha=1;
 // minimap
 const mr=Math.min(56,W*0.12),mx=14+mr,my=76+mr;ctx.fillStyle='rgba(10,0,30,.6)';ctx.beginPath();ctx.arc(mx,my,mr,0,6.283);ctx.fill();ctx.strokeStyle='#ff3fbf';ctx.lineWidth=2;ctx.stroke();
 for(const p of pillars){ctx.fillStyle='rgba(63,247,255,.4)';ctx.beginPath();ctx.arc(mx+p.x/ARENA*mr,my+p.y/ARENA*mr,Math.max(2,p.r/ARENA*mr),0,6.283);ctx.fill()}
 for(const c of cars){if(c.dead>0)continue;ctx.fillStyle=colOf(c.col,time);ctx.beginPath();ctx.arc(mx+c.x/ARENA*mr,my+c.y/ARENA*mr,c===me?4:3,0,6.283);ctx.fill()}
 // boost meter
 const bw=Math.min(300,W*0.5),bx=(W-bw)/2,by=H-(isTouch?150:44);
 ctx.fillStyle='rgba(10,0,30,.7)';ctx.fillRect(bx-4,by-4,bw+8,22);ctx.strokeStyle='#ff3fbf';ctx.lineWidth=2;ctx.strokeRect(bx-4,by-4,bw+8,22);
 const segs=10;for(let i=0;i<segs;i++){const f=Math.max(0,Math.min(1,me.meter*segs-i));if(f<=0)continue;ctx.fillStyle=me.meter>=1?`hsl(${(time*300)%360},100%,60%)`:i<3?'#3ff7ff':i<7?'#ff3fbf':'#ffd23f';ctx.globalAlpha=0.4+f*0.6;ctx.fillRect(bx+i*(bw/segs)+1,by,(bw/segs-2)*f,14)}
 ctx.globalAlpha=1;ctx.textAlign='center';ctx.font="11px 'Audiowide'";ctx.fillStyle='#fff';ctx.fillText(me.boostT>0?'BOOSTING!':me.meter>=1?'MAX: LET GO TO BOOST!':me.drift?'DRIFTING… charging':'BOOST',W/2,by-10);
 if(state==='count'){const n=Math.ceil(countT);ctx.font=`${Math.min(140,W*0.3)}px 'Monoton'`;ctx.fillStyle='#fff';ctx.shadowColor='#3ff7ff';ctx.shadowBlur=30;ctx.fillText(n>3?'':n>0?n:'GO!',W/2,H/2+40);ctx.shadowBlur=0;if(countT>2.5){ctx.font="18px 'Audiowide'";ctx.fillText('Drift to charge · Boost to wreck',W/2,H/2+100)}}
 if(me.dead>0&&state==='race'){ctx.font="22px 'Audiowide'";ctx.fillStyle='#ff5a3c';ctx.fillText('RESPAWNING '+Math.ceil(me.dead),W/2,H/2)}
}
const ttl={cars:[]};for(let i=0;i<6;i++)ttl.cars.push({a:Math.random()*6.28,r:120+i*40,s:(0.4+Math.random()*0.4)*(i%2?1:-1),c:AIC[i]});
function drawTitleBg(){
 const t=time;const hz=H*0.55;const g=ctx.createLinearGradient(0,0,0,hz);g.addColorStop(0,'#07021a');g.addColorStop(1,'#3a0a55');ctx.fillStyle=g;ctx.fillRect(0,0,W,hz);
 const sg=ctx.createLinearGradient(0,hz-200,0,hz);sg.addColorStop(0,'#ffd23f');sg.addColorStop(1,'#ff3fbf');ctx.fillStyle=sg;ctx.save();ctx.beginPath();ctx.arc(W/2,hz,Math.min(W,H)*0.22,Math.PI,0);ctx.fill();ctx.fillStyle='#3a0a55';for(let i=0;i<6;i++)ctx.fillRect(0,hz-12-i*14,W,3+i*0.6);ctx.restore();
 ctx.fillStyle='#12042a';ctx.fillRect(0,hz,W,H-hz);ctx.strokeStyle='#ff3fbf';ctx.lineWidth=2;ctx.shadowColor='#ff3fbf';ctx.shadowBlur=10;
 for(let i=-20;i<=20;i++){ctx.beginPath();ctx.moveTo(W/2+i*20,hz);ctx.lineTo(W/2+i*160,H);ctx.stroke()}
 for(let k=0;k<12;k++){const p=((k+(t*0.8)%1)/12);const y=hz+(H-hz)*p*p;ctx.globalAlpha=p;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}ctx.globalAlpha=1;ctx.shadowBlur=0;
}

const OVS=['title','gar','end'];function show(id){for(const o of OVS)$(o).classList.toggle('hidden',o!==id)}
function refreshTitle(){$('tCoins').textContent=sv.coins;$('tBest').textContent=sv.best}
function openGar(from){garFrom=from;$('gCoins').textContent=sv.coins;const g=$('skins');g.innerHTML='';
 SKINS.forEach((s,i)=>{const d=document.createElement('div');const own=sv.owned.includes(i);d.className='skin'+(sv.sel===i?' sel':'');const c=document.createElement('canvas');c.width=200;c.height=110;d.appendChild(c);
  const b=document.createElement('b');b.textContent=s.n;d.appendChild(b);const sp=document.createElement('span');sp.innerHTML=sv.sel===i?'EQUIPPED':own?'TAP TO EQUIP':`<span class="gold">${s.cost}</span> credits`;d.appendChild(sp);
  d.onclick=()=>{if(own){sv.sel=i;persist();openGar(garFrom);snd(660,0.1,'square',0.05)}else if(sv.coins>=s.cost){sv.coins-=s.cost;sv.owned.push(i);sv.sel=i;persist();openGar(garFrom);snd(880,0.3,'square',0.06,1760)}else snd(120,0.2,'square',0.05)};
  g.appendChild(d);const cg=c.getContext('2d');drawCar(cg,100,55,-0.3,s.c,1.5,{scale:2.6})});
 show('gar')}
let garFrom='title';
$('playB').onclick=newMatch;$('againB').onclick=newMatch;$('garB').onclick=()=>openGar('title');$('eGarB').onclick=()=>openGar('end');
$('garBack').onclick=()=>{if(garFrom==='end')show('end');else{refreshTitle();show('title')}};
refreshTitle();

let last=performance.now();
function frame(now){const dt=Math.min(0.033,(now-last)/1000);last=now;time+=dt;
 if(state==='count'||state==='race')update(dt);fxUpdate(dt);
 render();requestAnimationFrame(frame)}
layout();requestAnimationFrame(t=>{last=t;frame(t)});
})();
</script>
