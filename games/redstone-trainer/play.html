<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redstone Trainer</title>
<link rel="stylesheet" href="/assets/fonts.css">
<style>
:root{--bg:#171916;--panel:#23261f;--panel2:#2c3028;--line:#3a3f35;--ink:#ecefe6;--mute:#a9b0a0;--red:#ff4b3e;--red2:#c7251c;--gold:#f6c453;--green:#7cc24a;--blue:#7fe0ff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Nunito,system-ui,-apple-system,Segoe UI,sans-serif}
a{color:var(--gold)}
.top{position:sticky;top:0;z-index:10;background:rgba(23,25,22,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(6px)}
.top .in{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:8px 12px}
.brand{font-family:'Press Start 2P',monospace;color:var(--ink);text-decoration:none;white-space:nowrap;font-size:11px}
.brand i{display:inline-block;width:10px;height:10px;background:var(--red);box-shadow:0 0 8px var(--red);margin-right:7px;transform:rotate(45deg)}
.nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1}
.nav::-webkit-scrollbar{display:none}
.nav a{color:var(--mute);text-decoration:none;font-size:14px;font-weight:600;padding:6px 10px;border-radius:8px;white-space:nowrap}
.nav a.on{background:var(--panel2);color:var(--ink)}
main{max-width:820px;margin:0 auto;padding:14px 14px 60px}
h1,h2{font-family:Fredoka,system-ui,sans-serif;font-weight:700;letter-spacing:.3px;line-height:1.2}
h1{font-family:'Press Start 2P',monospace;font-weight:400;line-height:1.4}
h1{font-size:26px;margin:10px 0 6px}
h2{font-size:24px;margin:8px 0 8px}
h3{font-size:18px;margin:14px 0 6px}
h4{font-size:15px;margin:12px 0 4px;color:var(--gold)}
p{margin:6px 0 10px}
.lead{font-size:17px;color:#dfe3d8}
.fine,.note{color:var(--mute);font-size:14px}
.card{display:block;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0;color:var(--ink);text-decoration:none}
a.card:hover{border-color:#556049}
.hero{text-align:center;padding:12px 0 4px}
.hero-art canvas{border-radius:8px;border:1px solid var(--line);max-width:100%}
.stages{display:grid;gap:4px}
.stage{display:flex;gap:14px;align-items:flex-start}
.stage-n{font-family:'Press Start 2P',monospace;font-size:18px;width:42px;height:42px;flex:none;display:grid;place-items:center;background:var(--red2);border-radius:10px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.3)}
.stage-b{flex:1}.stage-b h3{margin:0 0 2px}.stage-b p{margin:0 0 8px;color:var(--mute);font-size:14px}.stage-b small{color:var(--mute)}
.pbar{height:6px;background:#11130f;border-radius:4px;overflow:hidden;margin-bottom:4px}.pbar i{display:block;height:100%;background:var(--green)}
.sandbox-link span,.quiz-link span{color:var(--mute)}
.crumb{display:block;width:max-content;color:var(--mute);text-decoration:none;font-size:14px;margin:2px 0 6px}
.tag{display:inline-block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;padding:2px 8px;border-radius:6px;background:#3b4134;color:#d7dccf}
.t-logic{background:#294a6b}.t-clock{background:#6b3b29}.t-memory{background:#4f2f6b}.t-pulse{background:#6b5a29}.t-doors{background:#2f6b4f}.t-automation{background:#3d6b29}.t-movers{background:#2a6b6b}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:20px;border:1px solid #556049;color:#cfe3b9;margin:2px 4px 2px 0}
.grp{color:var(--gold);font-family:'Press Start 2P',monospace;font-weight:400;font-size:12px;margin-top:20px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.comp{display:flex;gap:12px;align-items:flex-start;margin:0}
.comp canvas,.noicon{flex:none;border-radius:6px;background:#2f342d}
.noicon{width:40px;height:40px;display:grid;place-items:center;color:var(--mute)}
.comp p{margin:2px 0;font-size:13.5px;color:var(--mute)}
.comp.seen{border-color:#4c5d3c}.comp.seen b::after{content:" ✓";color:var(--green)}
.chead{display:flex;gap:14px;align-items:center}.chead canvas{border-radius:8px;background:#2f342d}.chead h2{margin:4px 0 0}
.facts{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px 10px 30px}
.facts li{margin:4px 0}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.mech{margin:0}.mech h3{margin:8px 0 4px}.mech p{color:var(--mute);font-size:14px;margin:0 0 4px}
.mtop{display:flex;justify-content:space-between;align-items:center}
.tick{color:var(--green);font-weight:700}
.mech.done{border-color:#4c5d3c}
.used{font-size:14.5px;color:#cdd3c3;background:var(--panel);border-left:3px solid var(--gold);padding:8px 12px;border-radius:0 8px 8px 0}
.gotcha{background:#3a2a18;border-radius:8px;padding:8px 10px;font-size:14.5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:600 14px Nunito,system-ui,sans-serif;color:var(--ink);background:var(--panel2);border:1px solid #4a5142;border-radius:10px;padding:9px 14px;cursor:pointer;text-decoration:none;min-height:40px;touch-action:manipulation}
.btn:hover{border-color:#6c7760}.btn:disabled{opacity:.4}
.btn.on{background:#3b4a2c;border-color:var(--green)}
.btn.primary{background:var(--red2);border-color:#e1463b;color:#fff}
.btn.primary:hover{background:#d8302a}
.btn.big{font-size:16px;padding:11px 18px}
.btn.sm{padding:6px 10px;min-height:34px;font-size:13px}
.btn.next{margin-top:14px}
.navrow,.actions{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.ed{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px;margin:10px 0}
.ed-bar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.ed-stage{display:flex;justify-content:center;overflow:hidden}
.ed-cv{display:block;touch-action:manipulation;border-radius:6px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.ed-status{font-size:13.5px;color:#d6dbcc;min-height:22px;margin:8px 2px 6px;padding:6px 10px;background:#1b1e18;border-radius:8px}
.ed-toolrow{display:flex;gap:6px;align-items:stretch}
.ed-tools{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;flex:1;scrollbar-width:thin}
.tool{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:62px;min-height:62px;background:var(--panel2);border:2px solid transparent;border-radius:10px;color:var(--ink);font:600 10.5px Nunito,system-ui,sans-serif;cursor:pointer;padding:4px 2px;touch-action:manipulation}
.tool span{line-height:1.1;text-align:center}
.tool .emo{font-size:22px;line-height:34px}
.tool.sel{border-color:var(--gold);background:#3a3a26}
.tool.face{background:#26313a;border-color:#3e5566}.tool.face b{font-size:24px;line-height:32px;color:var(--blue)}
.stepbox{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px}
.stepbox p{margin:6px 0}
.dots{display:flex;gap:5px}.dots i{width:22px;height:6px;border-radius:3px;background:#444b3d}.dots i.on{background:var(--blue)}
.results{margin:6px 0}
.res{border-radius:12px;padding:12px 14px;margin:8px 0;border:1px solid}
.res h3{margin:0 0 4px}
.res.pass{background:#1f3318;border-color:#4f8a35}
.res.fail{background:#341b18;border-color:#8a3a30}
.res ul,.res ol{margin:4px 0;padding-left:22px}.res li{margin:5px 0}
.miss{list-style:none;padding-left:0!important}.miss li{display:flex;gap:10px;align-items:center}.miss canvas{background:#2f342d;border-radius:5px;flex:none}
.lints li::marker{color:#ff5147;font-weight:700}
.hint{background:#2e2a17;border-left:3px solid var(--gold);padding:8px 10px;border-radius:0 8px 8px 0;font-size:14.5px}
.skills{margin:2px 0 8px}
.howto summary{cursor:pointer;font-weight:700}.howto li{margin:5px 0;font-size:14.5px}
.quiz .opts{display:grid;gap:8px;margin:10px 0}
.opt{text-align:left;font:500 15px Nunito,system-ui,sans-serif;color:var(--ink);background:var(--panel2);border:2px solid #4a5142;border-radius:10px;padding:10px 12px;cursor:pointer}
.opt.right{border-color:var(--green);background:#22361a}.opt.wrong{border-color:var(--red);background:#3a1c18}
.fb{min-height:24px}
@media (max-width:520px){h1{font-size:20px}h2{font-size:20px}main{padding:10px 10px 50px}.card{padding:12px}.lead{font-size:16px}.brand span{display:none}}
</style>
</head>
<body>
<header class="top"><div class="in">
<a class="brand" href="#home"><i></i><span>Redstone Trainer</span></a>
<nav class="nav">
<a href="#components" data-r="components c- quiz">Learn</a>
<a href="#mechanisms" data-r="mechanisms m-">Mechanisms</a>
<a href="#practice" data-r="practice p-">Practice</a>
<a href="#tests" data-r="tests t-">Tests</a>
<a href="#sandbox" data-r="sandbox">Sandbox</a>
</nav></div></header>
<main id="view"></main>
<script>
// ===== Redstone Trainer simulation engine (top-down, 1 layer, redstone ticks) =====
const R = (function () {
  const DIRS = [[0, -1], [1, 0], [0, 1], [-1, 0]]; // N E S W
  const DN = { N: 0, E: 1, S: 2, W: 3 };
  const opp = d => (d + 2) & 3;
  let NEXT_ID = 1;
  const SRC_SIMPLE = new Set(['lever', 'button', 'plate']);
  const MOVABLE = new Set(['block', 'glass', 'rblock', 'lamp', 'observer', 'piston', 'sticky', 'slime']);
  const BREAK = new Set(['dust', 'torch', 'lever', 'button', 'plate', 'repeater', 'comparator', 'cane']);
  const DIRECTIONAL = new Set(['torch', 'repeater', 'comparator', 'observer', 'piston', 'sticky', 'hopper']);
  const GROW = 24, BUTTON_T = 10, HOP_CD = 4, HOP_CAP = 320;

  function newTile(t, d = 1, o = {}) {
    const tile = { id: NEXT_ID++, t, d: DIRECTIONAL.has(t) || t === 'head' ? d : 0 };
    switch (t) {
      case 'lever': case 'plate': tile.on = false; break;
      case 'button': tile.on = false; tile.timer = 0; break;
      case 'torch': tile.on = true; break;
      case 'repeater': tile.on = false; tile.delay = 1; tile.pend = 0; break;
      case 'comparator': tile.out = 0; tile.mode = 'c'; break;
      case 'observer': tile.on = false; tile.fire = false; tile.prev = '#'; break;
      case 'lamp': tile.lit = false; tile.off = 0; break;
      case 'piston': case 'sticky': tile.ext = false; tile.over = false; break;
      case 'hopper': tile.items = 0; tile.cd = 0; break;
      case 'cane': tile.grown = false; tile.age = 0; break;
    }
    Object.assign(tile, o);
    return tile;
  }

  class World {
    constructor(w, h) { this.w = w; this.h = h; this.c = new Array(w * h).fill(null); this.time = 0; this.harvested = 0; this.P = null; this.stats = null; }
    in(x, y) { return x >= 0 && y >= 0 && x < this.w && y < this.h; }
    get(x, y) { return this.in(x, y) ? this.c[y * this.w + x] : null; }
    set(x, y, t) { if (this.in(x, y)) this.c[y * this.w + x] = t; }
    each(fn) { for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++) { const t = this.c[y * this.w + x]; if (t) fn(t, x, y); } }
  }

  function clone(w) {
    const n = new World(w.w, w.h);
    n.c = w.c.map(t => (t ? { ...t } : null));
    n.time = w.time; n.harvested = w.harvested;
    return n;
  }

  // ---- helpers ----
  function outDir(t) {
    if (t.t === 'repeater' || t.t === 'comparator') return t.d;
    if (t.t === 'observer') return opp(t.d);
    return -1;
  }
  function outLvl(t) {
    if (t.t === 'repeater') return t.on ? 15 : 0;
    if (t.t === 'comparator') return t.out;
    if (t.t === 'observer') return t.on ? 15 : 0;
    return 0;
  }
  function containerSignal(items) { return items <= 0 ? 0 : Math.floor(1 + (items / HOP_CAP) * 14); }

  // does dust at (x,y) connect toward direction k?
  function connects(w, x, y, k) {
    const n = w.get(x + DIRS[k][0], y + DIRS[k][1]);
    if (!n) return false;
    switch (n.t) {
      case 'dust': case 'lever': case 'button': case 'plate': case 'torch': case 'rblock': case 'comparator': return true;
      case 'repeater': return n.d === k || n.d === opp(k);
      case 'observer': return n.d === k; // its back faces the dust
      default: return false;
    }
  }
  function pointDirs(w, x, y) {
    const c = [];
    for (let k = 0; k < 4; k++) if (connects(w, x, y, k)) c.push(k);
    if (c.length === 0) return [0, 1, 2, 3];
    if (c.length === 1) return [c[0], opp(c[0])];
    return c;
  }
  function torchAttach(w, x, y, t) {
    const b = opp(t.d);
    return [x + DIRS[b][0], y + DIRS[b][1]];
  }
  function torchValid(w, x, y, t) {
    const [ax, ay] = torchAttach(w, x, y, t);
    const a = w.get(ax, ay);
    return !!a && (a.t === 'block' || a.t === 'rblock');
  }

  function computePower(w) {
    const N = w.w * w.h, c = w.c;
    const strong = new Int8Array(N), weak = new Int8Array(N), dust = new Int8Array(N);
    const P = { w, strong, weak, dust };
    // strong power into blocks
    w.each((t, x, y) => {
      if (SRC_SIMPLE.has(t.t) && t.on) {
        for (let k = 0; k < 4; k++) {
          const nx = x + DIRS[k][0], ny = y + DIRS[k][1];
          const n = w.get(nx, ny);
          if (n && n.t === 'block') strong[ny * w.w + nx] = 15;
        }
      }
      const od = outDir(t);
      if (od >= 0) {
        const l = outLvl(t);
        if (l > 0) {
          const nx = x + DIRS[od][0], ny = y + DIRS[od][1];
          const n = w.get(nx, ny);
          if (n && n.t === 'block') { const j = ny * w.w + nx; strong[j] = Math.max(strong[j], l); }
        }
      }
    });
    // dust seeds
    const q = [];
    w.each((t, x, y) => {
      if (t.t !== 'dust') return;
      let s = 0;
      for (let k = 0; k < 4; k++) {
        const nx = x + DIRS[k][0], ny = y + DIRS[k][1];
        const n = w.get(nx, ny);
        if (!n) continue;
        let l = 0;
        if (SRC_SIMPLE.has(n.t)) l = n.on ? 15 : 0;
        else if (n.t === 'rblock') l = 15;
        else if (n.t === 'torch') l = n.on ? 15 : 0;
        else if (outDir(n) === opp(k)) l = outLvl(n);
        else if (n.t === 'block') l = strong[ny * w.w + nx];
        if (l > s) s = l;
      }
      const i = y * w.w + x;
      dust[i] = s;
      q.push(i);
    });
    // relax along dust
    while (q.length) {
      const i = q.pop(); const x = i % w.w, y = (i / w.w) | 0;
      const l = dust[i] - 1; if (l <= 0) continue;
      for (let k = 0; k < 4; k++) {
        const nx = x + DIRS[k][0], ny = y + DIRS[k][1];
        const n = w.get(nx, ny);
        if (n && n.t === 'dust') { const j = ny * w.w + nx; if (dust[j] < l) { dust[j] = l; q.push(j); } }
      }
    }
    // weak power from dust pointing into blocks
    w.each((t, x, y) => {
      if (t.t !== 'dust') return;
      const l = dust[y * w.w + x]; if (l <= 0) return;
      for (const k of pointDirs(w, x, y)) {
        const nx = x + DIRS[k][0], ny = y + DIRS[k][1];
        const n = w.get(nx, ny);
        if (n && n.t === 'block') { const j = ny * w.w + nx; weak[j] = Math.max(weak[j], l); }
      }
    });
    return P;
  }
  function blockLevel(P, x, y) { const i = y * P.w.w + x; return Math.max(P.strong[i], P.weak[i]); }

  // power that (x,y) receives from its neighbour in direction k
  function powerFrom(P, x, y, k) {
    const w = P.w; const nx = x + DIRS[k][0], ny = y + DIRS[k][1];
    const n = w.get(nx, ny);
    if (!n) return 0;
    switch (n.t) {
      case 'lever': case 'button': case 'plate': return n.on ? 15 : 0;
      case 'rblock': return 15;
      case 'torch': {
        if (!n.on) return 0;
        const [ax, ay] = torchAttach(w, nx, ny, n);
        return ax === x && ay === y ? 0 : 15;
      }
      case 'dust': {
        const l = P.dust[ny * w.w + nx]; if (l <= 0) return 0;
        return pointDirs(w, nx, ny).includes(opp(k)) ? l : 0;
      }
      case 'repeater': case 'comparator': case 'observer':
        return outDir(n) === opp(k) ? outLvl(n) : 0;
      case 'block': return blockLevel(P, nx, ny);
    }
    return 0;
  }
  function powered(P, x, y, exclude = -1) {
    for (let k = 0; k < 4; k++) if (k !== exclude && powerFrom(P, x, y, k) > 0) return true;
    return false;
  }
  function torchOff(P, x, y, t) {
    const w = P.w; const [ax, ay] = torchAttach(w, x, y, t); const a = w.get(ax, ay);
    if (!a) return false;
    if (a.t === 'rblock') return true;
    if (a.t === 'block') return blockLevel(P, ax, ay) > 0;
    return false;
  }
  function sideIn(P, x, y, k) { // comparator / repeater side input
    const w = P.w; const n = w.get(x + DIRS[k][0], y + DIRS[k][1]);
    if (!n) return 0;
    if (n.t === 'dust') return P.dust[(y + DIRS[k][1]) * w.w + x + DIRS[k][0]];
    if (n.t === 'rblock') return 15;
    if ((n.t === 'repeater' || n.t === 'comparator') && outDir(n) === opp(k)) return outLvl(n);
    return 0;
  }
  function lockIn(P, x, y, k) {
    const w = P.w; const n = w.get(x + DIRS[k][0], y + DIRS[k][1]);
    if (n && (n.t === 'repeater' || n.t === 'comparator') && outDir(n) === opp(k)) return outLvl(n) > 0;
    return false;
  }
  function comparatorRear(P, x, y, t) {
    const b = opp(t.d); const n = P.w.get(x + DIRS[b][0], y + DIRS[b][1]);
    if (n && n.t === 'hopper') return containerSignal(n.items);
    return powerFrom(P, x, y, b);
  }

  function signature(w, P, x, y) {
    if (!w.in(x, y)) return 'X';
    const t = w.get(x, y); if (!t) return '0';
    switch (t.t) {
      case 'dust': return 'd' + P.dust[y * w.w + x];
      case 'lever': case 'button': case 'plate': return t.t + (t.on ? 1 : 0);
      case 'torch': return 't' + t.d + (t.on ? 1 : 0);
      case 'repeater': return 'r' + t.d + (t.on ? 1 : 0) + t.delay;
      case 'comparator': return 'c' + t.d + t.out + t.mode;
      case 'observer': return 'o' + t.d + (t.on ? 1 : 0);
      case 'lamp': return 'l' + (t.lit ? 1 : 0);
      case 'piston': case 'sticky': return 'p' + t.d + (t.ext ? 1 : 0);
      case 'hopper': return 'h' + t.d;
      case 'cane': return 'k' + (t.grown ? 1 : 0);
      case 'head': return 'H' + t.d;
    }
    return t.t;
  }

  function canMove(t) {
    if (!t) return true;
    if (t.t === 'piston' || t.t === 'sticky') return !t.ext;
    return MOVABLE.has(t.t);
  }
  // gather the blocks a piston moves: a push chain plus everything stuck to slime blocks
  function gather(w, sx, sy, d, px, py) {
    const [dx, dy] = DIRS[d], key = (x, y) => y * w.w + x;
    const set = new Map(), breaks = new Map(), q = [];
    const anchor = (x, y) => x === px && y === py;
    const add = (x, y) => { const k = key(x, y); if (set.has(k)) return true; set.set(k, [x, y]); q.push([x, y]); return set.size <= 12; };
    if (!add(sx, sy)) return null;
    while (q.length) {
      const [bx, by] = q.shift(); const b = w.get(bx, by);
      const nx = bx + dx, ny = by + dy;
      if (!set.has(key(nx, ny))) {
        if (!w.in(nx, ny) || anchor(nx, ny)) return null;
        const n = w.get(nx, ny);
        if (n) {
          if (BREAK.has(n.t)) breaks.set(key(nx, ny), [nx, ny]);
          else if (n.t === 'head' || !canMove(n)) return null;
          else if (!add(nx, ny)) return null;
        }
      }
      if (b && b.t === 'slime') {
        for (let k = 0; k < 4; k++) {
          const ax = bx + DIRS[k][0], ay = by + DIRS[k][1];
          if (!w.in(ax, ay) || anchor(ax, ay) || set.has(key(ax, ay))) continue;
          const n = w.get(ax, ay);
          if (!n || BREAK.has(n.t) || n.t === 'head' || !canMove(n)) continue;
          if (!add(ax, ay)) return null;
        }
      }
    }
    for (const k of set.keys()) breaks.delete(k);

    return C.NAMES[t.t] + ' placed.';
  }
  function describe(t, w, x, y) {
    switch (t.t) {
      case 'torch': return 'Redstone torch: ' + (R.torchValid(w, x, y, t) ? (t.on ? 'ON' : 'OFF (its block is powered)') : 'not attached to a block!');
      case 'observer': return 'Observer watching the space ' + DIRNAME[t.d] + ' of it.';
      case 'dust': return 'Dust signal strength: ' + (w.P ? w.P.dust[y * w.w + x] : 0);
      case 'block': { const st = w.P.strong[y * w.w + x], wk = w.P.weak[y * w.w + x]; return 'Solid block: ' + (st ? 'strongly powered (' + st + ')' : wk ? 'weakly powered by dust' : 'unpowered'); }
      case 'lamp': return 'Lamp ' + (t.lit ? 'ON' : 'OFF');
      case 'piston': case 'sticky': return C.NAMES[t.t] + ', ' + (t.ext ? 'extended' : 'retracted') + ', pushing ' + DIRNAME[t.d];
      case 'head': return 'Piston arm';
      default: return C.NAMES[t.t] || t.t;
    }
  }

  let lastT = performance.now();
  function frame(now) { const dt = Math.min(200, now - lastT); lastT = now; EDITORS.forEach(e => e.loop(dt)); requestAnimationFrame(frame); }
  requestAnimationFrame(frame);
  window.addEventListener('resize', () => EDITORS.forEach(e => e.resize()));

  // ---------- views ----------
  const view = () => $('#view');
  function mount(...nodes) { EDITORS = []; const v = view(); v.innerHTML = ''; v.append(...nodes); window.scrollTo(0, 0); EDITORS.forEach(e => e.resize()); }
  function crumb(href, label) { return h('a', { class: 'crumb', href }, '← ' + label); }
  function pbar(n, of) { return h('div', { class: 'pbar' }, h('i', { style: `width:${of ? Math.round(100 * n / of) : 0}%` })); }

  const simComps = C.COMPONENTS;
  const cnt = o => Object.keys(o || {}).length;

  function home() {
    const stages = [
      { href: '#components', n: '1', t: 'Learn the components', d: 'What every piece does: dust, torches, repeaters, comparators, observers, pistons, hoppers and more.', done: cnt(progress.comp), of: simComps.length },
      { href: '#mechanisms', n: '2', t: 'Study the mechanisms', d: 'Step-by-step builds of the circuits used inside bigger builds: logic gates, clocks, latches, doors, the Etho hopper clock and farms.', done: cnt(progress.mech), of: C.MECHS.length },
      { href: '#practice', n: '3', t: 'Practice building', d: 'Rebuild each mechanism yourself, with an optional see-through blueprint. The trainer checks if it works.', done: cnt(progress.prac), of: C.MECHS.length },
      { href: '#tests', n: '4', t: 'Take the tests', d: 'Build new things that combine several mechanisms. You\'ll get feedback on missing or misused pieces.', done: cnt(progress.test), of: C.TESTS.length }
    ];
    mount(
      h('section', { class: 'hero' },
        h('div', { class: 'hero-art' }, heroArt()),
        h('h1', {}, 'Redstone Trainer'),
        h('p', { class: 'lead' }, 'Learn redstone from the first wire to working machines. Every circuit here really runs, so you can poke it, break it and fix it.')),
      h('div', { class: 'stages' }, stages.map(s => h('a', { class: 'stage card', href: s.href },
        h('div', { class: 'stage-n' }, s.n),
        h('div', { class: 'stage-b' }, h('h3', {}, s.t), h('p', {}, s.d), pbar(s.done, s.of), h('small', {}, `${s.done} / ${s.of} done`))))),
      h('a', { class: 'card sandbox-link', href: '#sandbox' }, h('b', {}, '🧪 Free-build sandbox'), h('span', {}, ' Experiment with every piece on a big grid.')),
      howToBuild(true),
      h('p', { class: 'fine' }, 'Rules follow Minecraft: Java Edition. The trainer shows a flat, top-down slice of a build, so a few things are simplified (no vertical wiring, no quasi-connectivity). Each lesson notes where the real game differs. Not an official Minecraft product.')
    );
  }
  function heroArt() {
    const cv = h('canvas', {}); const s = 30, W = 9, H = 2; const dpr = window.devicePixelRatio || 1;
    cv.width = s * W * dpr; cv.height = s * H * dpr; cv.style.width = s * W + 'px'; cv.style.height = s * H + 'px';
    const g = cv.getContext('2d'); g.scale(dpr, dpr);
    const w = R.build(W, H, [['lever', 0, 0, 0, { on: true }], ['dust', 1, 0], ['dust', 2, 0], ['repeater', 3, 0, 'E'], ['dust', 4, 0], ['block', 5, 0], ['torch', 6, 0, 'E'], ['lamp', 7, 0], ['dust', 4, 1], ['dust', 5, 1], ['dust', 6, 1], ['lamp', 7, 1]]);
    for (let i = 0; i < 6; i++) R.tick(w);
    w.each((t, x, y) => drawTile(g, t, x * s, y * s, s, infoFor(w, w.P, t, x, y)));
    return cv;
  }
  function howToBuild(collapsed) {
    return h('details', { class: 'card howto', open: collapsed ? false : null },
      h('summary', {}, 'How the builder works'),
      h('ul', {},
        h('li', {}, 'Pick a piece in the toolbar, then tap a square to place it. Tap the same piece again to rotate it.'),
        h('li', {}, 'The ', h('b', {}, 'Facing'), ' button sets which way new repeaters, comparators, observers, pistons and hoppers point.'),
        h('li', {}, h('b', {}, '✋ Use'), ' flips levers, presses buttons, steps on plates, changes repeater delay, switches comparator mode and adds items to hoppers.'),
        h('li', {}, 'Torches snap onto a neighbouring block. A red outline on a block means it is strongly powered; a dashed outline means weakly powered (by dust).'),
        h('li', {}, 'The circuit runs live. ', h('b', {}, '# Numbers'), ' shows signal strength on dust; ', h('b', {}, 'Slow'), ' speed helps you see quick pulses. 1 redstone tick = 0.1 s.')));
  }

  // components
  function components() {
    const groups = {};
    C.COMPONENTS.forEach(c => (groups[c.group] = groups[c.group] || []).push(c));
    const order = ['Power sources', 'Wiring', 'Detectors', 'Outputs'];
    mount(crumb('#home', 'Home'),
      h('h2', {}, '1 · Components'),
      h('p', {}, 'Tap a component to learn what it does. The ones marked ', h('span', { class: 'chip' }, 'Try it'), ' come with a live demo you can operate.'),
      ...order.map(gname => h('section', {},
        h('h3', { class: 'grp' }, gname),
        h('div', { class: 'cgrid' }, groups[gname].map(c => h('a', { class: 'card comp' + (progress.comp[c.id] ? ' seen' : ''), href: '#c-' + c.id },
          c.sim ? iconCanvas(c.id, 40) : h('div', { class: 'noicon' }, '◇'),
          h('div', {}, h('b', {}, nameOf(c)), h('p', {}, c.short), c.sim && c.demo ? h('span', { class: 'chip' }, 'Try it') : null)))))),
      h('a', { class: 'card quiz-link', href: '#quiz' }, h('b', {}, '✎ Components quick check'), h('span', {}, progress.quiz != null ? ` Best score: ${progress.quiz}/${C.QUIZ.length}` : ' 10 questions')),
      h('a', { class: 'btn primary next', href: '#mechanisms' }, 'Next: Mechanisms →'));
  }
  function nameOf(c) { return { dispenser: 'Dispenser & Dropper', daylight: 'Daylight Detector', target: 'Target Block', noteblock: 'Note Block', slime: 'Slime & Honey Blocks', doors: 'Doors & Trapdoors' }[c.id] || C.NAMES[c.id]; }
  function componentDetail(id) {
    const i = C.COMPONENTS.findIndex(c => c.id === id); const c = C.COMPONENTS[i]; if (!c) return components();
    progress.comp[id] = 1; saveProgress();
    const next = C.COMPONENTS[i + 1];
    const wrap = h('div', {});
    const nodes = [crumb('#components', 'All components'),
      h('div', { class: 'chead' }, c.sim ? iconCanvas(c.id, 56) : null, h('div', {}, h('small', { class: 'tag' }, c.group), h('h2', {}, nameOf(c)))),
      h('p', { class: 'lead', html: c.body }),
      h('ul', { class: 'facts' }, c.facts.map(f => h('li', { html: f })))];
    if (c.demo) {
      const [W, H, pcs] = c.demo;
      nodes.push(h('h3', {}, 'Try it'), h('p', { class: 'note' }, c.demoNote || ''), wrap);
    } else if (c.id === 'cane') {
      nodes.push(h('p', { class: 'note' }, 'See it working in the ', h('a', { href: '#m-farm' }, 'Observer Piston Farm'), ' lesson.'));
    } else if (!c.sim) nodes.push(h('p', { class: 'note' }, 'This piece isn\'t in the trainer\'s grid, but you\'ll meet it in bigger builds in the game.'));
    nodes.push(h('div', { class: 'navrow' }, next ? h('a', { class: 'btn primary', href: '#c-' + next.id }, 'Next: ' + nameOf(next) + ' →') : h('a', { class: 'btn primary', href: '#quiz' }, 'Take the quick check →')));
    mount(...nodes);
    if (c.demo) { const [W, H, pcs] = c.demo; new Editor(wrap, { world: R.build(W, H, pcs) }); EDITORS.forEach(e => e.resize()); }
  }

  function quiz() {
    let k = 0, score = 0; const box = h('div', { class: 'card quiz' });
    const show = () => {
      box.innerHTML = '';
      if (k >= C.QUIZ.length) {
        progress.quiz = Math.max(progress.quiz || 0, score); saveProgress();
        box.append(h('h3', {}, `You scored ${score} / ${C.QUIZ.length}`), h('p', {}, score >= 8 ? 'Great foundation. Time for mechanisms!' : 'Review the components you missed, then try again.'),
          h('div', { class: 'navrow' }, h('button', { class: 'btn', onclick: () => { k = 0; score = 0; show(); } }, 'Try again'), h('a', { class: 'btn primary', href: '#mechanisms' }, 'Mechanisms →')));
        return;
      }
      const q = C.QUIZ[k]; let answered = false;
      const fb = h('p', { class: 'fb' });
      const opts = h('div', { class: 'opts' }, q.a.map((a, j) => h('button', {
        class: 'opt', onclick: e => {
          if (answered) return; answered = true;
          const ok = j === q.c; if (ok) score++;
          e.currentTarget.classList.add(ok ? 'right' : 'wrong'); opts.children[q.c].classList.add('right');
          fb.innerHTML = (ok ? '<b>Correct.</b> ' : '<b>Not quite.</b> ') + q.why;
          nextB.hidden = false;
        }
      }, a)));
      const nextB = h('button', { class: 'btn primary', hidden: true, onclick: () => { k++; show(); } }, k === C.QUIZ.length - 1 ? 'See score' : 'Next question →');
      box.append(h('small', { class: 'tag' }, `Question ${k + 1} of ${C.QUIZ.length}`), h('h3', {}, q.q), opts, fb, nextB);
    };
    show();
    mount(crumb('#components', 'Components'), h('h2', {}, 'Components quick check'), box);
  }

  // mechanisms
  function mechList(kind) {
    const prac = kind === 'practice';
    mount(crumb('#home', 'Home'),
      h('h2', {}, prac ? '3 · Practice building' : '2 · Mechanisms'),
      h('p', {}, prac ? 'Rebuild each mechanism on your own. The inputs and outputs are placed for you (marked with a lock). Use the blueprint ghost if you get stuck, then press Check.' : 'Each lesson builds a mechanism one step at a time, then lets you run it. These are the circuits hidden inside bigger builds.'),
      h('div', { class: 'mgrid' }, C.MECHS.map((m, i) => {
        const done = prac ? progress.prac[m.id] : progress.mech[m.id];
        return h('a', { class: 'card mech' + (done ? ' done' : ''), href: (prac ? '#p-' : '#m-') + m.id },
          h('div', { class: 'mtop' }, h('span', { class: 'tag t-' + m.tag.toLowerCase() }, m.tag), done ? h('span', { class: 'tick' }, '✓') : null),
          h('h3', {}, (i + 1) + '. ' + m.name), h('p', {}, m.what));
      })),
      h('a', { class: 'btn primary next', href: prac ? '#tests' : '#practice' }, prac ? 'Next: Tests →' : 'Next: Practice →'));
  }
  function lesson(id) {
    const m = C.MECHS.find(x => x.id === id); if (!m) return mechList();
    const idx = C.MECHS.indexOf(m);
    let step = 0;
    const host = h('div', {});
    const stepBox = h('div', { class: 'stepbox' });
    const [W, H] = m.size;
    let ed;
    const go = k => {
      step = Math.max(0, Math.min(m.steps.length - 1, k));
      const pcs = m.steps.slice(0, step + 1).flatMap(s => s.add);
      const w = R.build(W, H, pcs);
      ed.setWorld(w); ed.hl = m.steps[step].add.map(p => [p[1], p[2]]); ed.running = true; ed.syncBar(); ed.render();
      ed.status('Blue dashed squares show what this step adds. You can operate the circuit with taps.');
      stepBox.innerHTML = '';
      stepBox.append(
        h('div', { class: 'dots' }, m.steps.map((_, j) => h('i', { class: j <= step ? 'on' : '' }))),
        h('p', {}, h('b', {}, `Step ${step + 1} of ${m.steps.length}: `), m.steps[step].say),
        h('div', { class: 'navrow' },
          h('button', { class: 'btn', disabled: step === 0 ? true : null, onclick: () => go(step - 1) }, '← Back'),
          step < m.steps.length - 1 ? h('button', { class: 'btn primary', onclick: () => go(step + 1) }, 'Next step →') : h('a', { class: 'btn primary', href: '#p-' + m.id }, 'Practice building it →')));
      if (step === m.steps.length - 1) { progress.mech[m.id] = 1; saveProgress(); }
    };
    const next = C.MECHS[idx + 1];
    mount(crumb('#mechanisms', 'All mechanisms'),
      h('small', { class: 'tag t-' + m.tag.toLowerCase() }, m.tag), h('h2', {}, m.name),
      h('p', { class: 'lead' }, m.what),
      h('p', { class: 'used' }, h('b', {}, 'Used in bigger builds: '), m.used),
      host, stepBox,
      h('div', { class: 'card' }, h('h3', {}, 'How it works'), h('ul', {}, m.how.map(x => h('li', {}, x))), h('p', { class: 'gotcha' }, h('b', {}, '⚠ Watch out: '), m.gotcha)),
      h('div', { class: 'navrow' }, h('a', { class: 'btn', href: '#p-' + m.id }, 'Practice this'), next ? h('a', { class: 'btn primary', href: '#m-' + next.id }, 'Next lesson: ' + next.name + ' →') : h('a', { class: 'btn primary', href: '#practice' }, 'Go to practice →')));
    ed = new Editor(host, { world: R.build(W, H, []), door: m.door });
    ed.resize(); go(0);
  }

  // practice + tests share a build page
  function buildPage(kind, id) {
    const isTest = kind === 'test';
    const def = (isTest ? C.TESTS : C.MECHS).find(x => x.id === id); if (!def) return isTest ? testList() : mechList('practice');
    const [W, H] = def.size;
    const key = 'build_' + kind + '_' + id;
    const lockedPieces = isTest ? def.locked.map(p => { const o = Object.assign({}, p[4] || {}, { lk: 1 }); return [p[0], p[1], p[2], p[3], o]; })
      : def.pieces.filter(p => p[4] && p[4].io).map(p => [p[0], p[1], p[2], p[3], Object.assign({}, p[4], { lk: 1 })]);
    const answer = isTest ? lockedPieces.concat(def.solution) : def.pieces.map(p => p[4] && p[4].io ? [p[0], p[1], p[2], p[3], Object.assign({}, p[4], { lk: 1 })] : p);
    const fresh = () => R.build(W, H, lockedPieces);
    let world; const saved = store.get(key, null);
    try { world = saved && saved.w === W && saved.h === H ? deserialize(saved) : fresh(); } catch (e) { world = fresh(); }
    let fails = 0, hintN = 0, clearArm = false, ansArm = false;
    const host = h('div', {}); const results = h('div', { class: 'results' });
    const ghostB = !isTest ? h('button', { class: 'btn', onclick: () => { ed.ghostOn = !ed.ghostOn; ghostB.classList.toggle('on', ed.ghostOn); ghostB.textContent = ed.ghostOn ? '👻 Blueprint on' : '👻 Blueprint'; ed.render(); } }, '👻 Blueprint') : null;
    const hintBox = h('div', { class: 'hints' });
    const hintB = isTest ? h('button', { class: 'btn', onclick: () => { if (hintN < def.hints.length) { hintBox.append(h('p', { class: 'hint' }, h('b', {}, `Hint ${hintN + 1}: `), def.hints[hintN])); hintN++; } if (hintN >= def.hints.length) hintB.disabled = true; } }, '💡 Hint') : null;
    const ansB = h('button', { class: 'btn', hidden: isTest ? true : null, onclick: () => {
      if (!ansArm) { ansArm = true; ansB.textContent = 'Tap again to replace your build'; setTimeout(() => { ansArm = false; ansB.textContent = isTest ? '🔑 Show a solution' : '🔑 Load the answer'; }, 3000); return; }
      ansArm = false; ed.setWorld(R.build(W, H, answer)); ansB.textContent = isTest ? '🔑 Show a solution' : '🔑 Load the answer'; results.innerHTML = '';
      ed.status(isTest ? 'Here is one working solution (other designs can work too). Press Check to test it.' : 'Blueprint loaded. Press Check to see it pass, then try it from scratch.'); save();
    } }, isTest ? '🔑 Show a solution' : '🔑 Load the answer');
    const clearB = h('button', { class: 'btn', onclick: () => {
      if (!clearArm) { clearArm = true; clearB.textContent = 'Tap again to clear'; setTimeout(() => { clearArm = false; clearB.textContent = '🗑 Clear'; }, 3000); return; }
      clearArm = false; clearB.textContent = '🗑 Clear'; ed.setWorld(fresh()); results.innerHTML = ''; save();
    } }, '🗑 Clear');
    const save = () => store.set(key, serialize(ed.w));
    const checkB = h('button', { class: 'btn primary big', onclick: () => {
      const res = C.runCheck(ed.w, def);
      ed.flags = res.lints.map(l => ({ x: l.x, y: l.y })); ed.render();
      results.innerHTML = '';
      if (res.pass) {
        (isTest ? progress.test : progress.prac)[id] = 1; saveProgress();
        const list = isTest ? C.TESTS : C.MECHS; const nx = list[list.indexOf(def) + 1];
        results.append(h('div', { class: 'res pass' }, h('h3', {}, '✅ It works!'),
          h('p', {}, isTest ? 'Your build passed every test case.' : 'Your ' + def.name + ' passed every check.'),
          nx ? h('a', { class: 'btn primary', href: (isTest ? '#t-' : '#p-') + nx.id }, 'Next: ' + nx.name + ' →') : h('a', { class: 'btn primary', href: isTest ? '#home' : '#tests' }, isTest ? 'Back home' : 'On to the tests →')));
      } else {
        fails++;
        if (isTest && fails >= 2) ansB.hidden = false;
        const box = h('div', { class: 'res fail' }, h('h3', {}, '❌ Not yet. Here\'s what I found'));
        box.append(h('h4', {}, 'What went wrong when I tested it'), h('ul', {}, res.fails.map(f => h('li', {}, f))));
        if (res.missing.length) box.append(h('h4', {}, 'Missing pieces'), h('ul', { class: 'miss' }, res.missing.map(mm => h('li', {}, iconCanvas(mm.t, 26), h('span', {}, h('b', {}, `${mm.need} more ${plural(C.NAMES[mm.t], mm.need)}`), ` (${mm.why})`)))));
        if (res.lints.length) box.append(h('h4', {}, 'Pieces that look misused (numbered on the grid)'), h('ol', { class: 'lints' }, res.lints.map(l => h('li', {}, l.msg))));
        if (!res.missing.length && !res.lints.length) box.append(h('p', { class: 'note' }, isTest ? 'All the right kinds of pieces are there, so check how they connect. Try a hint, or run the circuit slowly and watch the signal.' : 'All the right pieces are there, so check the connections. Turn on 👻 Blueprint to compare.'));
        results.append(box);
      }
      results.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    } }, '✔ Check my build');
    const reqs = isTest ? null : h('p', { class: 'note' }, 'Build it so that it behaves like the lesson. Locked pieces (🔒) are your inputs and outputs.');
    mount(crumb(isTest ? '#tests' : '#practice', isTest ? 'All tests' : 'All practice'),
      isTest ? h('small', { class: 'tag' }, 'Test') : h('small', { class: 'tag t-' + def.tag.toLowerCase() }, 'Practice · ' + def.tag),
      h('h2', {}, def.name),
      isTest ? h('p', { class: 'lead' }, def.brief) : h('p', { class: 'lead' }, 'Goal: ' + def.what),
      isTest ? h('p', { class: 'skills' }, def.skills.map(s => h('span', { class: 'chip' }, s))) : reqs,
      isTest ? hintBox : null,
      host,
      h('div', { class: 'actions' }, checkB, ghostB, hintB, ansB, clearB, !isTest ? h('a', { class: 'btn', href: '#m-' + def.id }, '📖 Lesson') : null),
      results, howToBuild(true));
    const allow = isTest ? C.PALETTE.filter(t => t !== 'cane' || def.id === 'alarmfarm') : C.PALETTE.filter(t => t !== 'cane' || def.id === 'farm');
    const ed = new Editor(host, { world, palette: true, door: def.door, ghost: isTest ? null : def.pieces, allow, onEdit: () => save() });
    ed.resize();
  }
  function testList() {
    mount(crumb('#home', 'Home'), h('h2', {}, '4 · Tests'),
      h('p', {}, 'Each test asks for something new that combines components and mechanisms you\'ve learned. There\'s no blueprint. When you press Check, the trainer runs your build through every case and tells you which pieces are missing or misused. Hints are available, and a solution unlocks after two tries.'),
      h('div', { class: 'mgrid' }, C.TESTS.map((t, i) => h('a', { class: 'card mech' + (progress.test[t.id] ? ' done' : ''), href: '#t-' + t.id },
        h('div', { class: 'mtop' }, h('span', { class: 'tag' }, 'Test ' + (i + 1)), progress.test[t.id] ? h('span', { class: 'tick' }, '✓') : null),
        h('h3', {}, t.name), h('p', {}, t.brief), h('p', { class: 'skills' }, t.skills.map(s => h('span', { class: 'chip' }, s)))))));
  }
  function sandbox() {
    const key = 'sandbox'; const saved = store.get(key, null);
    let world; try { world = saved ? deserialize(saved) : R.build(12, 9, []); } catch (e) { world = R.build(12, 9, []); }
    const host = h('div', {});
    let arm = false;
    const clr = h('button', { class: 'btn', onclick: () => { if (!arm) { arm = true; clr.textContent = 'Tap again to clear'; setTimeout(() => { arm = false; clr.textContent = '🗑 Clear all'; }, 3000); return; } arm = false; clr.textContent = '🗑 Clear all'; ed.setWorld(R.build(12, 9, [])); store.set(key, serialize(ed.w)); } }, '🗑 Clear all');
    mount(crumb('#home', 'Home'), h('h2', {}, '🧪 Sandbox'), h('p', {}, 'Build anything. Your sandbox is saved in this browser.'), host, h('div', { class: 'actions' }, clr), howToBuild(true));
    const ed = new Editor(host, { world, palette: true, onEdit: () => store.set(key, serialize(ed.w)) });
    ed.resize();
  }

  function route() {
    const hs = (location.hash || '#home').slice(1);
    document.querySelectorAll('.nav a').forEach(a => a.classList.toggle('on', a.dataset.r.split(' ').some(p => hs.startsWith(p))));
    if (hs === 'home' || !hs) return home();
    if (hs === 'components') return components();
    if (hs === 'quiz') return quiz();
    if (hs === 'mechanisms') return mechList('mech');
    if (hs === 'practice') return mechList('practice');
    if (hs === 'tests') return testList();
    if (hs === 'sandbox') return sandbox();
    if (hs.startsWith('c-')) return componentDetail(hs.slice(2));
    if (hs.startsWith('m-')) return lesson(hs.slice(2));
    if (hs.startsWith('p-')) return buildPage('practice', hs.slice(2));
    if (hs.startsWith('t-')) return buildPage('test', hs.slice(2));
    home();
  }
  window.addEventListener('hashchange', route);
  route();
})();

</script>
</body>
</html>
