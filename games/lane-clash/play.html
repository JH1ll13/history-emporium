<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Lane Clash</title>
<link rel="stylesheet" href="/assets/fonts.css">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#1b2a4a;color:#fff;font-family:'Nunito',sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.ov{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#3a5aa8,#141f3a);padding:12px;box-sizing:border-box;overflow:auto}
.hidden{display:none!important}
.box{text-align:center;width:100%;max-width:560px}
h1{font-family:'Lilita One',sans-serif;font-weight:400;font-size:clamp(46px,13vw,92px);margin:0;line-height:.95;color:#ffd23f;text-shadow:0 5px 0 #a3530a,0 10px 0 #3a1a04,0 0 30px #ffb02066;letter-spacing:1px}
h2{font-family:'Lilita One';font-weight:400;font-size:28px;margin:4px 0 8px;color:#ffd23f;text-shadow:0 3px 0 #7a3a04}
.btn{font-family:'Lilita One',sans-serif;font-size:24px;color:#fff;border:none;border-radius:16px;padding:12px 30px;margin:6px;cursor:pointer;background:linear-gradient(#ffcf3a,#f08a10);box-shadow:0 6px 0 #9a4a00,inset 0 2px 0 #fff8;text-shadow:0 2px 0 #9a4a00}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #9a4a00}
.btn.blue{background:linear-gradient(#6ab8ff,#2e6fe0);box-shadow:0 6px 0 #1a3f8a,inset 0 2px 0 #fff8;text-shadow:0 2px 0 #1a3f8a}
.stat{display:inline-block;background:rgba(0,0,0,.35);border-radius:12px;padding:6px 12px;margin:4px;font-family:'Lilita One';font-size:18px}
.small{font-size:13px;opacity:.85;margin-top:12px;line-height:1.6}
#deckRow,#coll{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0}
.cd{position:relative;background:linear-gradient(#5a7ad8,#2c428a);border:3px solid #9ab8ff;border-radius:12px;padding:4px 2px 6px;cursor:pointer}
.cd canvas{width:100%;max-width:90px;height:auto;display:block;margin:0 auto}
.cd .cost{position:absolute;top:-8px;left:-8px;width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ff9cf0,#c02ac8);border:2px solid #fff;font-family:'Lilita One';font-size:16px;line-height:26px;text-align:center}
.cd b{display:block;font-family:'Lilita One';font-weight:400;font-size:13px}
.cd .lv{font-size:11px;opacity:.9}
.cd .bar{height:6px;background:#0005;border-radius:4px;margin:3px 6px 0;overflow:hidden}.cd .bar i{display:block;height:100%;background:#5fff8a}
.cd.up{border-color:#5fff8a;box-shadow:0 0 12px #5fff8a}
.cd.sel{border-color:#ffd23f;box-shadow:0 0 16px #ffd23f;transform:translateY(-3px)}
.cd.lock{filter:grayscale(1) brightness(.5)}
#info{background:rgba(0,0,0,.35);border-radius:12px;padding:8px 10px;font-size:14px;min-height:40px;margin:6px 0}
#rewards{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0}
#rewards .cd{width:84px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ov" id="home"><div class="box">
  <h1>LANE<br>CLASH</h1>
  <div style="margin:14px 0"><span class="stat">🏆 <span id="hTro">0</span></span><span class="stat">🪙 <span id="hGold">0</span></span><span class="stat">Arena <span id="hArena">1</span></span></div>
  <button class="btn" id="battleB">⚔ BATTLE</button><br>
  <button class="btn blue" id="deckB">🃏 MY DECK</button>
  <div class="small" id="hNext"></div>
  <div class="small">Drag cards onto your side of the arena. Elixir refills over time.<br>Destroy the enemy King Tower, or more towers than them in 3 minutes!</div>
</div></div>
<div class="ov hidden" id="deck"><div class="box">
  <h2>BATTLE DECK</h2>
  <div id="deckRow"></div>
  <div id="info">Tap a card below, then tap a deck card to swap them.</div>
  <h2 style="font-size:22px">COLLECTION <span style="font-size:16px">🪙 <span id="dGold">0</span></span></h2>
  <div id="coll"></div>
  <button class="btn" id="upB" style="font-size:18px;display:none">UPGRADE</button>
  <button class="btn blue" id="deckBack">◀ BACK</button>
</div></div>
<div class="ov hidden" id="res" style="background:radial-gradient(circle at 50% 30%,rgba(58,90,168,.9),rgba(20,31,58,.95))"><div class="box">
  <h1 id="rT" style="font-size:clamp(40px,11vw,76px)">VICTORY!</h1>
  <div id="rCrowns" style="font-size:44px;margin:8px 0"></div>
  <div id="rS" class="stat"></div>
  <div id="rewards"></div>
  <button class="btn" id="rOk">CONTINUE</button>
</div></div>
<script>
(()=>{
const cv=document.getElementById('c'),ctx=cv.getContext('2d');const $=id=>document.getElementById(id);
const AW=18,AH=32,RIVER=16,BR=[3.5,14.5];
const CARDS={
 knight:{n:'Knight',cost:3,hp:700,dmg:85,hs:1.1,range:0.7,spd:1.0,tgt:'ground',r:0.45,d:'Tough melee fighter.'},
 archers:{n:'Archers',cost:3,count:2,hp:150,dmg:45,hs:1.0,range:5,spd:1.0,tgt:'both',r:0.35,proj:'arrow',d:'Two archers. Hit air and ground.'},
 giant:{n:'Giant',cost:5,hp:2100,dmg:125,hs:1.5,range:0.8,spd:0.7,tgt:'buildings',r:0.7,d:'Huge HP. Only attacks towers.'},
 goblins:{n:'Goblins',cost:2,count:3,hp:120,dmg:60,hs:1.0,range:0.6,spd:1.6,tgt:'ground',r:0.32,d:'Three speedy stabbers.'},
 bomber:{n:'Bomber',cost:3,hp:190,dmg:120,hs:1.8,range:4.5,spd:1.0,tgt:'ground',splash:1.4,r:0.38,proj:'bomb',d:'Throws bombs that splash groups.'},
 musketeer:{n:'Musketeer',cost:4,hp:400,dmg:110,hs:1.1,range:6,spd:1.0,tgt:'both',r:0.4,proj:'bullet',d:'Long-range sharpshooter.'},
 fireball:{n:'Fireball',cost:4,spell:1,dmg:330,radius:2.5,d:'Blasts an area. Weaker on towers.'},
 zap:{n:'Zap',cost:2,spell:1,dmg:160,radius:2.2,stun:0.6,d:'Instant shock that stuns.'},
 skeletons:{n:'Skeleton Army',cost:3,count:10,hp:35,dmg:35,hs:1.0,range:0.5,spd:1.5,tgt:'ground',r:0.25,d:'A swarm of 10 skeletons!',unlock:100},
 dragon:{n:'Baby Dragon',cost:4,hp:620,dmg:85,hs:1.5,range:3,spd:1.4,tgt:'both',splash:1.2,fly:1,r:0.5,proj:'fire',d:'Flies over the river. Splash fire.',unlock:250},
 prince:{n:'Prince',cost:5,hp:1150,dmg:220,hs:1.4,range:0.9,spd:1.1,tgt:'ground',charge:1,r:0.6,d:'Charges for double damage!',unlock:450}
};
const START=['knight','archers','giant','goblins','bomber','musketeer','fireball','zap'];
const UPC=[2,4,8,15,25,40,60,100],UPG=[20,50,100,200,400,800,1500,3000];
let sv={tro:0,gold:100,deck:START.slice(),cards:{}};
try{const d=JSON.parse(localStorage.getItem('laneclash_v1')||'null');if(d)sv=Object.assign(sv,d)}catch(e){}
for(const k in CARDS)if(!sv.cards[k]&&!CARDS[k].unlock)sv.cards[k]={lv:1,n:0};
function unlocks(){for(const k in CARDS){const c=CARDS[k];if(c.unlock&&sv.tro>=c.unlock&&!sv.cards[k]){sv.cards[k]={lv:1,n:0};newUnlock=k}}}
let newUnlock=null;unlocks();
function persist(){try{localStorage.setItem('laneclash_v1',JSON.stringify(sv))}catch(e){}}
let AC=null;function snd(f,d=0.1,type='square',v=0.05,f2,noise){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const n=AC.currentTime,g=AC.createGain();g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(0.0008,n+d);
 if(noise){const len=Math.floor(AC.sampleRate*d),b=AC.createBuffer(1,len,AC.sampleRate),dd=b.getChannelData(0);for(let i=0;i<len;i++)dd[i]=(Math.random()*2-1)*(1-i/len);const s=AC.createBufferSource();s.buffer=b;const fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.value=f;s.connect(fl).connect(g).connect(AC.destination);s.start(n);return}
 const o=AC.createOscillator();o.type=type;o.frequency.setValueAtTime(f,n);if(f2)o.frequency.exponentialRampToValueAtTime(f2,n+d);o.connect(g).connect(AC.destination);o.start(n);o.stop(n+d+0.03)}catch(e){}}

// ============ drawing ============
const TC=['#3a8cff','#ff4a4a'],TD=['#1a3f8a','#8a1a1a'];
function drawUnit(g,type,team,x,y,R,t,o={}){
 const tc=TC[team],td=TD[team],walk=o.walk||0,atk=o.atk||0,face=o.face||1;
 g.save();g.translate(x,y);
 if(!o.noShadow){g.fillStyle='rgba(0,0,0,.3)';g.beginPath();g.ellipse(0,R*0.15+(o.fly?R*0.9:0),R*0.9,R*0.32,0,0,6.283);g.fill()}
 const bob=Math.abs(Math.sin(walk*6))*R*0.12;g.translate(0,-bob);g.scale(face,1);
 g.lineJoin='round';g.lineCap='round';g.lineWidth=Math.max(1.2,R*0.09);g.strokeStyle='#1a1008';
 const body=(c,w,h,yy=0)=>{g.fillStyle=c;g.beginPath();g.ellipse(0,yy,w,h,0,0,6.283);g.fill();g.stroke()};
 const head=(c,r,yy)=>{g.fillStyle=c;g.beginPath();g.arc(0,yy,r,0,6.283);g.fill();g.stroke()};
 const eyes=(yy,r,c='#1a1008')=>{g.fillStyle=c;g.beginPath();g.arc(R*0.12,yy,r,0,6.283);g.arc(-R*0.12,yy,r,0,6.283);g.fill()};
 if(type==='knight'){body(tc,R*0.55,R*0.5,-R*0.35);head('#d6dbe6',R*0.38,-R*1.0);g.fillStyle='#1a1008';g.fillRect(-R*0.25,-R*1.05,R*0.5,R*0.08);g.fillStyle=tc;g.beginPath();g.moveTo(0,-R*1.38);g.lineTo(R*0.15,-R*1.6);g.lineTo(-R*0.1,-R*1.5);g.fill();
  g.save();g.translate(R*0.5,-R*0.5);g.rotate(-0.6+atk*1.6);g.fillStyle='#e8eef8';g.fillRect(0,-R*0.07,R*0.9,R*0.14);g.strokeRect(0,-R*0.07,R*0.9,R*0.14);g.fillStyle='#ffd23f';g.fillRect(-R*0.08,-R*0.2,R*0.1,R*0.4);g.restore();
  g.fillStyle='#9aa4b8';g.beginPath();g.ellipse(-R*0.5,-R*0.4,R*0.22,R*0.32,0,0,6.283);g.fill();g.stroke()}
 else if(type==='archers'){body(tc,R*0.45,R*0.45,-R*0.3);head('#ffd0a8',R*0.32,-R*0.9);g.fillStyle=td;g.beginPath();g.arc(0,-R*0.95,R*0.36,Math.PI*0.9,Math.PI*2.1);g.fill();g.stroke();eyes(-R*0.85,R*0.05);
  g.strokeStyle='#8a5a2a';g.lineWidth=R*0.1;g.beginPath();g.arc(R*0.45,-R*0.5,R*0.4,-1.2,1.2);g.stroke();g.strokeStyle='#fff';g.lineWidth=1;g.beginPath();g.moveTo(R*0.45+Math.cos(-1.2)*R*0.4-atk*R*0.2,-R*0.5+Math.sin(-1.2)*R*0.4);g.lineTo(R*0.45+Math.cos(1.2)*R*0.4-atk*R*0.2,-R*0.5+Math.sin(1.2)*R*0.4);g.stroke()}
 else if(type==='giant'){body('#c98a5a',R*0.7,R*0.65,-R*0.45);g.fillStyle=tc;g.fillRect(-R*0.6,-R*0.25,R*1.2,R*0.3);g.strokeRect(-R*0.6,-R*0.25,R*1.2,R*0.3);head('#e0a070',R*0.38,-R*1.25);eyes(-R*1.25,R*0.06);g.strokeStyle='#1a1008';g.beginPath();g.moveTo(-R*0.2,-R*1.4);g.lineTo(-R*0.05,-R*1.35);g.moveTo(R*0.2,-R*1.4);g.lineTo(R*0.05,-R*1.35);g.stroke();
  g.fillStyle='#e0a070';g.lineWidth=R*0.08;g.beginPath();g.arc(R*0.75,-R*0.55+atk*R*0.4,R*0.25,0,6.283);g.fill();g.stroke()}
 else if(type==='goblins'){body('#5ac84a',R*0.45,R*0.42,-R*0.28);head('#6ad85a',R*0.33,-R*0.85);g.fillStyle='#6ad85a';for(const s of[-1,1]){g.beginPath();g.moveTo(s*R*0.25,-R*0.95);g.lineTo(s*R*0.7,-R*1.1);g.lineTo(s*R*0.28,-R*0.75);g.fill();g.stroke()}eyes(-R*0.88,R*0.06,'#ffe14a');g.fillStyle=tc;g.fillRect(-R*0.4,-R*0.35,R*0.8,R*0.15);
  g.save();g.translate(R*0.45,-R*0.35);g.rotate(-0.3+atk*1.2);g.fillStyle='#c0c8d8';g.beginPath();g.moveTo(0,-R*0.06);g.lineTo(R*0.55,0);g.lineTo(0,R*0.06);g.fill();g.restore()}
 else if(type==='bomber'||type==='skeletons'){const sk=type==='skeletons';body(sk?'#e8e2d0':tc,R*0.4,R*0.45,-R*0.3);if(!sk){g.fillStyle='#e8e2d0';g.fillRect(-R*0.25,-R*0.55,R*0.5,R*0.08);g.fillRect(-R*0.25,-R*0.35,R*0.5,R*0.08)}else{g.fillStyle=tc;g.fillRect(-R*0.4,-R*0.4,R*0.8,R*0.12)}
  head('#f0ece0',R*0.36,-R*0.9);g.fillStyle='#1a1008';g.beginPath();g.arc(R*0.13,-R*0.92,R*0.1,0,6.283);g.arc(-R*0.13,-R*0.92,R*0.1,0,6.283);g.fill();g.fillRect(-R*0.12,-R*0.7,R*0.24,R*0.05);
  if(!sk){g.fillStyle='#2a2a3a';g.beginPath();g.arc(R*0.5,-R*0.6-atk*R*0.3,R*0.25,0,6.283);g.fill();g.stroke();g.strokeStyle='#ffb020';g.beginPath();g.moveTo(R*0.55,-R*0.85-atk*R*0.3);g.lineTo(R*0.7,-R*1.0-atk*R*0.3);g.stroke()}else{g.strokeStyle='#e8e2d0';g.lineWidth=R*0.12;g.beginPath();g.moveTo(R*0.35,-R*0.4);g.lineTo(R*0.75,-R*0.8+atk*R*0.4);g.stroke()}}
 else if(type==='musketeer'){body(tc,R*0.45,R*0.5,-R*0.32);head('#ffd0a8',R*0.32,-R*0.95);eyes(-R*0.92,R*0.05);g.fillStyle=td;g.beginPath();g.ellipse(0,-R*1.18,R*0.55,R*0.12,0,0,6.283);g.fill();g.stroke();g.beginPath();g.arc(0,-R*1.2,R*0.3,Math.PI,0);g.fill();g.stroke();g.fillStyle='#fff';g.beginPath();g.ellipse(-R*0.2,-R*1.45,R*0.08,R*0.22,-0.5,0,6.283);g.fill();
  g.fillStyle='#5a3a1a';g.fillRect(R*0.1,-R*0.6,R*1.0,R*0.12);g.fillStyle='#8a909c';g.fillRect(R*0.6,-R*0.6,R*0.6,R*0.08);if(atk>0.6){g.fillStyle='#ffd23f';g.beginPath();g.arc(R*1.25,-R*0.56,R*0.15,0,6.283);g.fill()}}
 else if(type==='dragon'){const fl=Math.sin(t*14)*0.4;g.translate(0,-R*0.9);g.fillStyle='#b46bff';for(const s of[-1,1]){g.save();g.scale(s,1);g.rotate(fl);g.beginPath();g.moveTo(R*0.2,-R*0.2);g.lineTo(R*1.1,-R*0.8);g.lineTo(R*0.9,-R*0.1);g.lineTo(R*0.3,R*0.1);g.closePath();g.fill();g.stroke();g.restore()}
  body('#7ad84a',R*0.5,R*0.42,0);head('#8ae85a',R*0.35,-R*0.4);eyes(-R*0.45,R*0.06);g.fillStyle='#ffd23f';g.beginPath();g.moveTo(-R*0.15,-R*0.7);g.lineTo(-R*0.05,-R*0.95);g.lineTo(0,-R*0.7);g.moveTo(R*0.15,-R*0.7);g.lineTo(R*0.05,-R*0.95);g.lineTo(0,-R*0.7);g.fill();g.strokeStyle=tc;g.lineWidth=R*0.12;g.beginPath();g.arc(0,R*0.1,R*0.3,0.3,2.8);g.stroke()}
 else if(type==='prince'){body('#8a5a3a',R*0.75,R*0.4,-R*0.3);g.fillStyle='#6a4a2a';g.beginPath();g.ellipse(R*0.75,-R*0.6,R*0.25,R*0.35,0.5,0,6.283);g.fill();g.stroke();g.fillStyle=tc;g.fillRect(-R*0.5,-R*0.55,R*0.9,R*0.2);
  body(tc,R*0.3,R*0.35,-R*0.85);head('#ffd0a8',R*0.26,-R*1.3);g.fillStyle='#ffd23f';g.beginPath();g.moveTo(-R*0.22,-R*1.48);g.lineTo(-R*0.22,-R*1.7);g.lineTo(-R*0.08,-R*1.58);g.lineTo(0,-R*1.75);g.lineTo(R*0.08,-R*1.58);g.lineTo(R*0.22,-R*1.7);g.lineTo(R*0.22,-R*1.48);g.closePath();g.fill();g.stroke();
  g.save();g.translate(R*0.2,-R*0.85);g.rotate(-0.15+atk*0.3);g.fillStyle='#e8eef8';g.beginPath();g.moveTo(0,-R*0.06);g.lineTo(R*1.5,0);g.lineTo(0,R*0.06);g.fill();g.stroke();g.restore()}
 else if(type==='fireball'){const gr=g.createRadialGradient(0,-R*0.6,R*0.1,0,-R*0.6,R);gr.addColorStop(0,'#fff6b0');gr.addColorStop(0.4,'#ff9a1a');gr.addColorStop(1,'#c0260a');g.fillStyle=gr;g.beginPath();g.arc(0,-R*0.6,R*0.8,0,6.283);g.fill()}
 else if(type==='zap'){g.strokeStyle='#9be8ff';g.lineWidth=R*0.25;g.shadowColor='#9be8ff';g.shadowBlur=12;g.beginPath();g.moveTo(-R*0.2,-R*1.4);g.lineTo(R*0.3,-R*0.7);g.lineTo(-R*0.2,-R*0.6);g.lineTo(R*0.2,R*0.1);g.stroke();g.shadowBlur=0}
 if(o.flash){g.globalAlpha=0.5;g.fillStyle='#fff';g.beginPath();g.ellipse(0,-R*0.6,R*0.7,R*0.85,0,0,6.283);g.fill();g.globalAlpha=1}
 g.restore();
}
function drawTower(g,tw,T,t){
 const x=tw.x*T,y=tw.y*T,R=tw.r*T,c=TC[tw.team],d=TD[tw.team];
 if(tw.hp<=0){g.fillStyle='#6a6050';g.beginPath();g.ellipse(x,y,R*1.0,R*0.6,0,0,6.283);g.fill();g.fillStyle='#4a4038';for(let i=0;i<6;i++){g.beginPath();g.arc(x+Math.cos(i*1.3)*R*0.6,y+Math.sin(i*1.3)*R*0.3,R*0.2,0,6.283);g.fill()}return}
 g.fillStyle='rgba(0,0,0,.3)';g.beginPath();g.ellipse(x,y+R*0.5,R*1.1,R*0.45,0,0,6.283);g.fill();
 const h=R*(tw.kind==='king'?1.4:1.6);
 g.fillStyle='#8a8a9a';g.strokeStyle='#2a2a34';g.lineWidth=2;g.beginPath();g.moveTo(x-R*0.9,y+R*0.4);g.lineTo(x-R*0.8,y-h);g.lineTo(x+R*0.8,y-h);g.lineTo(x+R*0.9,y+R*0.4);g.closePath();g.fill();g.stroke();
 g.fillStyle='#6a6a7a';for(let i=0;i<3;i++)g.fillRect(x-R*0.7,y-h+R*0.5+i*R*0.45,R*1.4,R*0.06);
 g.fillStyle=c;g.fillRect(x-R*0.95,y-h-R*0.25,R*1.9,R*0.35);g.strokeRect(x-R*0.95,y-h-R*0.25,R*1.9,R*0.35);
 for(let i=0;i<4;i++){g.fillStyle=c;g.fillRect(x-R*0.95+i*R*0.53,y-h-R*0.5,R*0.3,R*0.27);g.strokeRect(x-R*0.95+i*R*0.53,y-h-R*0.5,R*0.3,R*0.27)}

 if(state==='home'||state==='deckscr'){return}
 const sx=(Math.random()-0.5)*shake,sy=(Math.random()-0.5)*shake;
 ctx.save();ctx.translate(OX+sx,OY+sy);
 // grass
 for(let y=0;y<AH;y++)for(let x=0;x<AW;x++){ctx.fillStyle=(x+y)%2?'#5cae46':'#64b84c';ctx.fillRect(x*T,y*T,T+0.5,T+0.5)}
 // deploy zone highlight
 const dk=drag?drag.k:selCard>=0?hand[selCard]:null;
 if(dk&&!CARDS[dk].spell){ctx.fillStyle='rgba(255,60,60,.22)';for(let y=0;y<AH;y++)for(let x=0;x<AW;x++){if(!canDeploy(0,x+0.5,y+0.5))ctx.fillRect(x*T,y*T,T,T)}}
 // river
 const rg=ctx.createLinearGradient(0,(RIVER-1)*T,0,(RIVER+1)*T);rg.addColorStop(0,'#2a7ad8');rg.addColorStop(0.5,'#4aa8ff');rg.addColorStop(1,'#2a7ad8');ctx.fillStyle=rg;ctx.fillRect(0,(RIVER-1)*T,AW*T,2*T);
 ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=2;for(let i=0;i<10;i++){const xx=((i*2.3+time*0.8)%AW)*T;ctx.beginPath();ctx.moveTo(xx,(RIVER-0.3+((i%3)*0.3))*T);ctx.lineTo(xx+T*0.8,(RIVER-0.3+((i%3)*0.3))*T);ctx.stroke()}
 for(const b of BR){ctx.fillStyle='#a07040';ctx.fillRect((b-1)*T,(RIVER-1.3)*T,2*T,2.6*T);ctx.strokeStyle='#5a3a1a';ctx.lineWidth=2;for(let i=0;i<6;i++){ctx.beginPath();ctx.moveTo((b-1)*T,(RIVER-1.3+i*0.52)*T);ctx.lineTo((b+1)*T,(RIVER-1.3+i*0.52)*T);ctx.stroke()}ctx.fillStyle='#6a4a2a';ctx.fillRect((b-1.15)*T,(RIVER-1.3)*T,0.2*T,2.6*T);ctx.fillRect((b+0.95)*T,(RIVER-1.3)*T,0.2*T,2.6*T)}
 // paths
 ctx.fillStyle='rgba(200,170,110,.35)';for(const b of BR){ctx.fillRect((b-0.6)*T,2*T,1.2*T,(AH-4)*T)}ctx.fillRect(3.5*T,28.4*T,11*T,1.2*T);ctx.fillRect(3.5*T,2.4*T,11*T,1.2*T);
 // entities sorted
 const ents=[...towers.map(t=>({y:t.y,t})),...units.map(u=>({y:u.y+(CARDS[u.type].fly?100:0),u}))].sort((a,b)=>a.y-b.y);
 for(const it of ents){if(it.t){drawTower(ctx,it.t,T,time);continue}const u=it.u,c=CARDS[u.type],R=(c.r||0.4)*T*1.6;
  if(u.deploy>0){ctx.globalAlpha=0.5;ctx.strokeStyle=TC[u.team];ctx.lineWidth=2;ctx.beginPath();ctx.arc(u.x*T,u.y*T,R*(1+u.deploy),0,6.283);ctx.stroke()}
  drawUnit(ctx,u.type,u.team,u.x*T,u.y*T,R,time,{walk:u.walk,atk:u.atk,face:u.face,fly:c.fly,flash:u.flash>0});ctx.globalAlpha=1;
  if(u.stun>0){ctx.fillStyle='#9be8ff';ctx.font=`${T*0.5}px Lilita One`;ctx.textAlign='center';ctx.fillText('⚡',u.x*T,u.y*T-R*2)}
  if(u.hp<u.maxHp){const bw=Math.max(T*0.9,R*1.6),yy=u.y*T-R*(c.fly?3:2.1);ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(u.x*T-bw/2,yy,bw,4);ctx.fillStyle=TC[u.team];ctx.fillRect(u.x*T-bw/2,yy,bw*Math.max(0,u.hp/u.maxHp),4)}}
 // projectiles
 for(const p of projs){const x=p.x*T,y=p.y*T;if(p.kind==='arrow'){const a=Math.atan2(p.ty-p.y,p.tx-p.x);ctx.save();ctx.translate(x,y);ctx.rotate(a);ctx.fillStyle=p.tower?'#fff':'#8a5a2a';ctx.fillRect(-T*0.35,-1.2,T*0.5,2.4);ctx.fillStyle='#ddd';ctx.beginPath();ctx.moveTo(T*0.2,-3);ctx.lineTo(T*0.32,0);ctx.lineTo(T*0.2,3);ctx.fill();ctx.restore()}
  else if(p.kind==='bomb'){ctx.fillStyle='#2a2a3a';ctx.beginPath();ctx.arc(x,y,T*0.2,0,6.283);ctx.fill()}
  else if(p.kind==='bullet'){ctx.fillStyle='#ffd23f';ctx.beginPath();ctx.arc(x,y,T*0.1,0,6.283);ctx.fill()}
  else if(p.kind==='fire'){ctx.fillStyle='#ff9a1a';ctx.beginPath();ctx.arc(x,y,T*0.25,0,6.283);ctx.fill();ctx.fillStyle='#fff6b0';ctx.beginPath();ctx.arc(x,y,T*0.12,0,6.283);ctx.fill()}
  else if(p.kind==='fireball'){const gr=ctx.createRadialGradient(x,y,1,x,y,T*0.8);gr.addColorStop(0,'#fff6b0');gr.addColorStop(0.5,'#ff9a1a');gr.addColorStop(1,'rgba(255,60,0,0)');ctx.fillStyle=gr;ctx.beginPath();ctx.arc(x,y,T*0.8,0,6.283);ctx.fill()}}
 for(const z of zaps){const a=1-z.life/0.35;ctx.strokeStyle=`rgba(155,232,255,${a})`;ctx.lineWidth=3;for(let k=0;k<6;k++){ctx.beginPath();let px=z.x*T,py=z.y*T;ctx.moveTo(px,py);for(let s=0;s<4;s++){px+=(Math.random()-0.5)*z.r*T*0.7;py+=(Math.random()-0.5)*z.r*T*0.7;ctx.lineTo(px,py)}ctx.stroke()}ctx.fillStyle=`rgba(155,232,255,${a*0.3})`;ctx.beginPath();ctx.arc(z.x*T,z.y*T,z.r*T,0,6.283);ctx.fill()}
 for(const p of parts){const a=1-p.life/p.max;ctx.globalAlpha=a;if(p.ring){ctx.strokeStyle=p.col;ctx.lineWidth=3;ctx.beginPath();ctx.arc(p.x*T,p.y*T,p.ring*T*(1.2-a*0.5),0,6.283);ctx.stroke()}else{ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x*T,p.y*T,Math.max(1,p.r*T*(0.4+a*0.6)),0,6.283);ctx.fill()}}
 ctx.globalAlpha=1;
 // drag ghost
 if(drag&&Math.hypot(drag.x-drag.sx,drag.y-drag.sy)>20&&drag.y<H-HAND_H){const [wx,wy]=toWorld(drag.x,drag.y-30);const c=CARDS[drag.k];const ok=canDeploy(0,wx,wy,c.spell);
  if(c.spell){ctx.strokeStyle=ok?'#fff':'#ff4a4a';ctx.fillStyle='rgba(255,255,255,.15)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(wx*T,wy*T,c.radius*T,0,6.283);ctx.fill();ctx.stroke()}
  else{ctx.globalAlpha=0.65;drawUnit(ctx,drag.k,0,wx*T,wy*T,(c.r||0.4)*T*1.6,time,{fly:c.fly});ctx.globalAlpha=1;if(c.range>2){ctx.strokeStyle='rgba(255,255,255,.4)';ctx.setLineDash([5,5]);ctx.beginPath();ctx.arc(wx*T,wy*T,c.range*T,0,6.283);ctx.stroke();ctx.setLineDash([])}}}
 ctx.textAlign='center';for(const t of texts){const a=Math.min(1,(1.8-t.life)*2);ctx.globalAlpha=Math.max(0,a);ctx.font=`${t.big?Math.min(30,W*0.06):Math.max(12,T*0.55)}px Lilita One`;ctx.lineWidth=4;ctx.strokeStyle='#000';const y=t.y*T-t.life*T*0.6;ctx.strokeText(t.t,t.x*T,y);ctx.fillStyle=t.col;ctx.fillText(t.t,t.x*T,y)}ctx.globalAlpha=1;
 ctx.restore();
 // HUD top
 ctx.fillStyle='rgba(10,16,32,.85)';ctx.fillRect(0,0,W,HUD_T);
 ctx.font="20px Lilita One";ctx.textAlign='left';ctx.fillStyle='#ff7a7a';ctx.fillText('👑'.repeat(crowns[1])+'  ENEMY Lv'+aiLv,10,29);
 ctx.textAlign='right';ctx.fillStyle='#7ab8ff';ctx.fillText('YOU '+'👑'.repeat(crowns[0]),W-10,29);
 const tl=Math.max(0,Math.ceil(timeLeft));ctx.textAlign='center';ctx.fillStyle=timeLeft<60||overtime?'#ffd23f':'#fff';ctx.font="24px Lilita One";ctx.fillText((overtime?'OT ':'')+Math.floor(tl/60)+':'+String(tl%60).padStart(2,'0'),W/2,31);
 if((timeLeft<60||overtime)&&state==='battle'){ctx.font="11px Nunito";ctx.fillStyle='#ff9cf0';ctx.fillText('2x ELIXIR',W/2,43)}
 // hand
 ctx.fillStyle='rgba(10,16,32,.9)';ctx.fillRect(0,H-HAND_H,W,HAND_H);
 // elixir bar
 const ex=Math.min(W*0.08,40),ew=W-ex*2,ey=H-HAND_H+8;ctx.fillStyle='#1a1030';ctx.fillRect(ex,ey,ew,14);for(let i=0;i<10;i++){const f=Math.max(0,Math.min(1,elixir[0]-i));if(f>0){const g2=ctx.createLinearGradient(0,ey,0,ey+14);g2.addColorStop(0,'#ff9cf0');g2.addColorStop(1,'#b02ac0');ctx.fillStyle=g2;ctx.fillRect(ex+i*ew/10+1,ey+1,(ew/10-2)*f,12)}}
 ctx.font="13px Lilita One";ctx.fillStyle='#fff';ctx.textAlign='center';ctx.lineWidth=3;ctx.strokeStyle='#000';ctx.strokeText(Math.floor(elixir[0])+' / 10',W/2,ey+12);ctx.fillText(Math.floor(elixir[0])+' / 10',W/2,ey+12);
 // next card
 if(queue.length){const nr=handRect(0);const nx=nr.x-58,ny=nr.y+nr.h*0.3,nw=40;ctx.font="10px Nunito";ctx.fillStyle='#aab';ctx.textAlign='center';ctx.fillText('NEXT',nx+nw/2,ny-4);ctx.fillStyle='#2c428a';ctx.fillRect(nx,ny,nw,nw*1.15);drawUnit(ctx,queue[0],0,nx+nw/2,ny+nw*0.95,nw*0.25,time,{noShadow:1})}
 for(let i=0;i<4;i++){const k=hand[i];if(!k)continue;const r=handRect(i),c=CARDS[k],ok=elixir[0]>=c.cost;const lift=selCard===i?-8:0;
  ctx.save();ctx.translate(0,lift);const cg=ctx.createLinearGradient(0,r.y,0,r.y+r.h);cg.addColorStop(0,ok?'#5a7ad8':'#3a4058');cg.addColorStop(1,ok?'#2c428a':'#22283a');ctx.fillStyle=cg;ctx.strokeStyle=selCard===i?'#ffd23f':'#9ab8ff';ctx.lineWidth=3;ctx.beginPath();ctx.roundRect?ctx.roundRect(r.x,r.y,r.w,r.h,10):ctx.rect(r.x,r.y,r.w,r.h);ctx.fill();ctx.stroke();
  ctx.save();ctx.beginPath();ctx.rect(r.x,r.y,r.w,r.h);ctx.clip();drawUnit(ctx,k,0,r.x+r.w/2,r.y+r.h*0.78,r.w*0.26,time,{noShadow:1});ctx.restore();
  if(!ok){ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(r.x,r.y,r.w,r.h)}
  ctx.fillStyle='#c02ac8';ctx.beginPath();ctx.arc(r.x+4,r.y+4,12,0,6.283);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#fff';ctx.font="15px Lilita One";ctx.textAlign='center';ctx.fillText(c.cost,r.x+4,r.y+9);
  ctx.font=`${Math.max(10,r.w*0.14)}px Lilita One`;ctx.fillText(c.n.split(' ').pop(),r.x+r.w/2,r.y+r.h-5);ctx.restore()}
 if(state==='count'){ctx.fillStyle='rgba(0,0,0,.4)';ctx.fillRect(0,0,W,H);ctx.font=`${Math.min(120,W*0.25)}px Lilita One`;ctx.fillStyle='#ffd23f';ctx.strokeStyle='#000';ctx.lineWidth=8;ctx.textAlign='center';const n=Math.ceil(countT);ctx.strokeText(n,W/2,H/2);ctx.fillText(n,W/2,H/2)}
 if(selCard>=0&&!drag&&state==='battle'){ctx.font="13px Nunito";ctx.fillStyle='#fff';ctx.textAlign='center';ctx.fillText('Tap the arena to place '+CARDS[hand[selCard]].n,W/2,H-HAND_H-6)}
}

// ============ menus ============
const OVS=['home','deck','res'];function show(id){for(const o of OVS)$(o).classList.toggle('hidden',o!==id);if(id==='home'){state='home';refreshHome()}if(id==='deck')state='deckscr'}
function arena(){return 1+Math.floor(sv.tro/200)}
function refreshHome(){$('hTro').textContent=sv.tro;$('hGold').textContent=sv.gold;$('hArena').textContent=arena();const nxt=Object.keys(CARDS).filter(k=>CARDS[k].unlock&&!sv.cards[k]).sort((a,b)=>CARDS[a].unlock-CARDS[b].unlock)[0];$('hNext').innerHTML=nxt?`Next unlock: <b>${CARDS[nxt].n}</b> at 🏆 ${CARDS[nxt].unlock}`:'All cards unlocked!'}
function cardEl(k,o={}){const c=CARDS[k],own=sv.cards[k];const d=document.createElement('div');d.className='cd';const cvs=document.createElement('canvas');cvs.width=180;cvs.height=180;d.appendChild(cvs);
 const cost=document.createElement('div');cost.className='cost';cost.textContent=c.cost;d.appendChild(cost);const b=document.createElement('b');b.textContent=c.n;d.appendChild(b);
 if(o.extra){const s=document.createElement('div');s.className='lv';s.textContent=o.extra;s.style.color='#ffd23f';s.style.fontFamily='Lilita One';s.style.fontSize='16px';d.appendChild(s)}
 else if(own){const lv=document.createElement('div');lv.className='lv';const need=UPC[own.lv-1];lv.textContent='Lv '+own.lv+(need?` · ${own.n}/${need}`:' MAX');d.appendChild(lv);if(need){const bar=document.createElement('div');bar.className='bar';const i=document.createElement('i');i.style.width=Math.min(100,own.n/need*100)+'%';bar.appendChild(i);d.appendChild(bar);if(own.n>=need&&sv.gold>=UPG[own.lv-1])d.classList.add('up')}}
 else{d.classList.add('lock');const lv=document.createElement('div');lv.className='lv';lv.textContent='🏆 '+c.unlock;d.appendChild(lv)}
 const g=cvs.getContext('2d');drawUnit(g,k,0,90,150,c.spell?60:(k==='giant'||k==='prince'?44:52),1.2,{noShadow:1});return d}
let selColl=null;
function openDeck(){$('dGold').textContent=sv.gold;const D=$('deckRow');D.innerHTML='';
 sv.deck.forEach((k,i)=>{const d=cardEl(k);d.onclick=()=>{if(selColl&&!sv.deck.includes(selColl)){sv.deck[i]=selColl;selColl=null;persist();snd(600,0.08);openDeck()}else{selColl=k;showCardInfo(k);openDeckMark()}};D.appendChild(d)});
 const C=$('coll');C.innerHTML='';for(const k in CARDS){if(sv.deck.includes(k))continue;const d=cardEl(k);if(sv.cards[k])d.onclick=()=>{selColl=k;showCardInfo(k);openDeckMark()};C.appendChild(d)}
 if(!selColl)$('info').textContent='Tap a card below, then tap a deck card to swap them.';$('upB').style.display='none';openDeckMark();show('deck')}
function openDeckMark(){for(const el of document.querySelectorAll('#deck .cd'))el.classList.remove('sel');const all=[...document.querySelectorAll('#deckRow .cd')].map((e,i)=>[e,sv.deck[i]]);const keysColl=Object.keys(CARDS).filter(k=>!sv.deck.includes(k));[...document.querySelectorAll('#coll .cd')].forEach((e,i)=>all.push([e,keysColl[i]]));for(const [e,k] of all)if(k===selColl)e.classList.add('sel')}
function showCardInfo(k){const c=CARDS[k],o=sv.cards[k];const m=mult(o.lv);let st=c.spell?`Damage ${Math.round(c.dmg*m)} · Radius ${c.radius}`:`HP ${Math.round(c.hp*m)} · DMG ${Math.round(c.dmg*m)}${c.count?' · x'+c.count:''}${c.fly?' · Flying':''}`;
 $('info').innerHTML=`<b>${c.n}</b> (Lv ${o.lv}): ${c.d}<br>${st}${sv.deck.includes(k)?'':'<br><i>Now tap a card in your deck to swap it in.</i>'}`;
 const need=UPC[o.lv-1],gc=UPG[o.lv-1];if(need&&o.n>=need){$('upB').style.display='inline-block';$('upB').textContent=`UPGRADE 🪙${gc}`;$('upB').style.filter=sv.gold>=gc?'':'grayscale(1)';$('upB').onclick=()=>{if(sv.gold<gc){snd(150,0.15);return}sv.gold-=gc;o.n-=need;o.lv++;persist();snd(523,0.1);setTimeout(()=>snd(784,0.25),100);selColl=k;openDeck();showCardInfo(k);openDeckMark()}}else $('upB').style.display='none'}
$('battleB').onclick=()=>{snd(400,0.05);startBattle()};$('deckB').onclick=()=>{selColl=null;openDeck()};$('deckBack').onclick=()=>show('home');$('rOk').onclick=()=>show('home');
refreshHome();

let last=performance.now();
function frame(now){const dt=Math.min(0.033,(now-last)/1000);last=now;time+=dt;
 update(dt);if(state==='end')endT+=dt;
 for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life+=dt;if(p.life>p.max){parts.splice(i,1);continue}p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=0.92;p.vy*=0.92}
 for(let i=texts.length-1;i>=0;i--){texts[i].life+=dt;if(texts[i].life>1.8)texts.splice(i,1)}
 for(let i=zaps.length-1;i>=0;i--){zaps[i].life+=dt;if(zaps[i].life>0.35)zaps.splice(i,1)}
 shake=Math.max(0,shake-dt*25);render();requestAnimationFrame(frame)}
layout();requestAnimationFrame(t=>{last=t;frame(t)});
})();
</script>
